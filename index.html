<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDZ TEAM - TRANG WEB CỦA TÔI</title>
    <style>
        /* --- ĐÂY LÀ PHẦN CSS THIẾT KẾ --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #0b0c10; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { background: #1f2833; padding: 40px; border-radius: 20px; border: 2px solid #45f3ff; text-align: center; box-shadow: 0 0 20px #45f3ff; }
        h1 { color: #45f3ff; margin-bottom: 15px; font-size: 32px; text-shadow: 0 0 10px #45f3ff; }
        p { color: #c5c6c7; margin-bottom: 25px; }
        .btn { display: inline-block; background: #45f3ff; color: #0b0c10; padding: 12px 30px; font-weight: bold; border-radius: 8px; text-decoration: none; transition: 0.3s; }
        .btn:hover { background: #fff; box-shadow: 0 0 15px #fff; transform: scale(1.05); }
    </style>
</head>
<body>

    <!-- --- ĐÂY LÀ PHẦN HTML GIAO DIỆN --- -->
    <div class="box">
        <h1>BDZ TEAM WEBSITE</h1>
        <p>Chào mừng bạn đến với trang web giao diện HTML + CSS thuần túy!</p>
        <a href="#" class="btn">TẢI MENU GAME</a>
    </div>

</body>
</html>

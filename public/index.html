<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="BDZMOD — nhận Key">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="./security-hardening.js?v=121"></script>
<title>BDZMOD — Nhận Key</title>
<link rel="icon" type="image/png" href="https://263.org.vn/logo?v=20261003">
<style>
  :root {
    --bg: #07070a;
    --card: #121218;
    --border: #2a2a35;
    --text: #f0eef6;
    --muted: #9a96a8;
    --accent: #00dfd8;
    --accent2: #7928ca;
    --err: #ff8a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  body {
    display: grid;
    place-items: center;
    padding: 16px;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(121, 40, 202, 0.25), transparent),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0, 223, 216, 0.08), transparent),
      var(--bg);
  }
  .panel {
    width: min(420px, 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--card);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
  }
  .brand img {
    width: 28px;
    height: 28px;
    border-radius: 8px;
  }
  .brand strong {
    display: block;
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  .brand small {
    display: block;
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .admin-link {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .admin-link:hover { color: var(--text); border-color: #3d3d4a; }
  .panel-body {
    padding: 22px 18px 18px;
  }
  .title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 18px;
  }
  .info-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 18px;
    font-size: 13px;
  }
  .info-table th,
  .info-table td {
    text-align: left;
    padding: 10px 12px;
    border: 1px solid var(--border);
  }
  .info-table th {
    width: 42%;
    color: var(--muted);
    font-weight: 600;
    background: rgba(255, 255, 255, 0.02);
  }
  .info-table td {
    font-weight: 600;
  }
  .info-table tr:first-child th,
  .info-table tr:first-child td {
    border-top-left-radius: 10px;
  }
  .info-table tr:first-child td {
    border-top-right-radius: 10px;
  }
  .info-table tr:last-child th {
    border-bottom-left-radius: 10px;
  }
  .info-table tr:last-child td {
    border-bottom-right-radius: 10px;
  }
  .btn-get {
    width: 100%;
    min-height: 48px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    color: #041014;
    background: linear-gradient(135deg, var(--accent), #5eead4);
    transition: opacity 0.15s, transform 0.15s;
  }
  .btn-get:hover:not(:disabled) { opacity: 0.92; }
  .btn-get:active:not(:disabled) { transform: scale(0.98); }
  .btn-get:disabled {
    opacity: 0.65;
    cursor: wait;
  }
  .result {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
    display: none;
  }
  .result.show { display: block; }
  .result.err {
    color: var(--err);
    border: 1px solid rgba(255, 138, 138, 0.35);
    background: rgba(255, 70, 70, 0.08);
  }
  .result.info {
    color: var(--muted);
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
  }
  .steps {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }
  .steps b { color: #c8c4d4; font-weight: 600; }
  .panel-foot {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .live::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2);
  }
</style>
</head>
<body>

<div class="panel" role="main">
  <div class="panel-head">
    <a class="brand" href="./">
      <img src="https://263.org.vn/logo?v=20261003" alt="" width="28" height="28">
      <span><strong>BDZMOD</strong><small>Key Service</small></span>
    </a>
    <a class="admin-link" href="./admin.html">Admin</a>
  </div>

  <div class="panel-body">
    <h1 class="title">Nhận Key</h1>
    <p class="subtitle">Nhấn Get Key, hoàn tất vượt link, hệ thống sẽ cấp Key cho bạn.</p>

    <table class="info-table">
      <tr>
        <th>Thời hạn</th>
        <td id="durValue">…</td>
      </tr>
      <tr>
        <th>Trạng thái</th>
        <td id="statusValue">Sẵn sàng</td>
      </tr>
    </table>

    <button type="button" class="btn-get" id="start">Get Key</button>
    <div id="result" class="result" role="status" aria-live="polite"></div>

    <div class="steps">
      <b>1.</b> Bấm Get Key → mở link vượt<br>
      <b>2.</b> Hoàn tất yêu cầu trên trang vượt link<br>
      <b>3.</b> Quay lại và nhận Key (dùng 1 lần)
    </div>
  </div>

  <div class="panel-foot">
    <span>BDZMOD</span>
    <span class="live">Online</span>
  </div>
</div>

<script src="./config.js?v=111"></script>
<script src="./supabase-api.js?v=111"></script>
<script>
(function () {
  function viErr(err) {
    var m = {
      MAINTENANCE: "Hệ thống đang bảo trì. Thử lại sau.",
      BANNED: "Bạn đã bị khóa tạm thời.",
      RATE_LIMITED: "Thao tác quá nhiều. Thử lại sau.",
      NO_KEYS: "Hết key. Quay lại sau.",
      SHORTENER_NOT_CONFIGURED: "Rút gọn chưa cấu hình.",
      SHORTENER_UPSTREAM: "Lỗi dịch vụ rút gọn.",
      ERR: "Không tạo được phiên. Thử lại."
    };
    return m[err] || m.ERR;
  }

  var durEl = document.getElementById("durValue");
  var statusEl = document.getElementById("statusValue");
  var btn = document.getElementById("start");
  var result = document.getElementById("result");

  (async function loadDuration() {
    try {
      if (typeof BDZ === "undefined" || !BDZ.rpc) {
        durEl.textContent = "5 giờ";
        return;
      }
      var x = await BDZ.rpc("bdz_public_key_info", {});
      var h = (x && x.duration_hours) || 5;
      durEl.textContent = h + " giờ";
    } catch (e) {
      durEl.textContent = "5 giờ";
    }
  })();

  btn.onclick = async function () {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = "Đang chuẩn bị…";
    statusEl.textContent = "Đang tạo link…";
    result.className = "result";
    result.textContent = "";
    try {
      if (typeof BDZ === "undefined") throw Error("Chưa tải cấu hình. Refresh trang.");
      var v = BDZ.visitorId();
      var x = await BDZ.edge("web-get-key", { action: "start", ip: v, visitor_id: v });
      if (!x || !x.ok || !x.shortenedUrl) throw Error(viErr(x && x.error));
      btn.textContent = "Đang chuyển tiếp…";
      statusEl.textContent = "Chuyển hướng…";
      window.location.href = x.shortenedUrl;
    } catch (e) {
      btn.disabled = false;
      btn.textContent = "Get Key";
      statusEl.textContent = "Lỗi";
      result.className = "result show err";
      result.textContent = e.message || "Lỗi";
    }
  };
})();
</script>
</body>
</html>

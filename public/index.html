<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="BDZMOD — nhận Key">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="./security-hardening.js?v=121"></script>
<title>BDZMOD — Nhận Key</title>
<link rel="icon" type="image/png" href="https://263.org.vn/logo?v=20261003">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=170">
<style>
  .split {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .split-left {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 40px 48px;
    border-right: 1px solid var(--line);
    background:
      radial-gradient(ellipse 90% 70% at 20% 30%, rgba(245, 158, 11, 0.14), transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 80%, rgba(180, 83, 9, 0.08), transparent 55%),
      var(--bg-2);
    overflow: hidden;
  }
  .split-left::after {
    content: "BDZ";
    position: absolute;
    right: -4%;
    bottom: -6%;
    font-size: clamp(120px, 22vw, 220px);
    font-weight: 700;
    letter-spacing: -0.06em;
    line-height: 0.85;
    color: rgba(245, 158, 11, 0.06);
    pointer-events: none;
    user-select: none;
  }
  .split-brand {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 1;
  }
  .split-brand img {
    width: 44px;
    height: 44px;
    border-radius: 12px;
  }
  .split-brand strong {
    display: block;
    font-size: 18px;
    font-weight: 650;
    letter-spacing: -0.03em;
  }
  .split-brand small {
    display: block;
    margin-top: 3px;
    font-size: 11px;
    color: var(--fg-3);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .split-hero {
    position: relative;
    z-index: 1;
    max-width: 360px;
  }
  .split-hero h1 {
    margin: 0;
    font-size: clamp(32px, 4.5vw, 44px);
    font-weight: 650;
    letter-spacing: -0.04em;
    line-height: 1.1;
  }
  .split-hero p {
    margin: 16px 0 0;
    font-size: 15px;
    line-height: 1.6;
    color: var(--fg-2);
  }
  .split-meta {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--fg-3);
  }
  .split-meta span {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.18);
    animation: pulse-dot 1.8s ease-in-out infinite;
  }
  .split-right {
    display: grid;
    place-items: center;
    padding: 32px 24px;
  }
  .panel {
    width: min(400px, 100%);
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--bg-2);
    padding: 28px 24px;
    box-shadow: 0 28px 64px -28px rgba(0,0,0,0.65);
    animation: fade-in 0.45s var(--ease) both;
  }
  .panel h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.03em;
  }
  .panel .sub {
    margin: 8px 0 0;
    font-size: 13px;
    color: var(--fg-3);
    line-height: 1.5;
  }
  .info-grid {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .info-cell {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    background: var(--bg);
  }
  .info-cell label {
    display: block;
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-3);
    margin-bottom: 6px;
  }
  .info-cell strong {
    font-size: 15px;
    font-weight: 600;
  }
  .cap-box {
    margin-top: 16px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255,255,255,0.015);
  }
  .cap-box > label {
    display: block;
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-3);
    margin-bottom: 10px;
  }
  .cap-row { display: flex; align-items: center; gap: 8px; }
  .cap-prompt {
    min-width: 7rem;
    min-height: 42px;
    padding: 0 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--bg);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    font-weight: 600;
  }
  #result {
    margin-top: 12px;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    line-height: 1.5;
  }
  #result.err {
    border: 1px solid rgba(248,113,113,0.25);
    background: var(--danger-soft);
    color: #fecaca;
  }
  .admin-link {
    display: inline-flex;
    margin-top: 16px;
    font-size: 12px;
    color: var(--fg-3);
  }
  .admin-link:hover { color: var(--accent-2); }
  @media (max-width: 860px) {
    .split { grid-template-columns: 1fr; }
    .split-left {
      min-height: auto;
      padding: 28px 24px;
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
    .split-left::after { font-size: 100px; }
    .split-hero { max-width: none; }
    .split-hero h1 { font-size: 28px; }
    .split-right { padding: 24px 16px 40px; }
  }
</style>
</head>
<body>
<div class="split">
  <aside class="split-left">
    <div class="split-brand">
      <img src="https://263.org.vn/logo?v=20261003" alt="">
      <span>
        <strong>BDZMOD</strong>
        <small>Key Service</small>
      </span>
    </div>
    <div class="split-hero">
      <h1>Nhận Key<br>nhanh & an toàn</h1>
      <p>Giải captcha, vượt từng phiên link theo API đã cấu hình, rồi nhận key dùng một lần.</p>
    </div>
    <div class="split-meta">
      <span><span class="dot"></span>Hệ thống online</span>
      <span>Token 1 lần · bảo vệ phiên</span>
    </div>
  </aside>

  <main class="split-right">
    <div class="panel">
      <h2>Bắt đầu</h2>
      <p class="sub">Xác minh và nhận key ngay.</p>

      <div class="info-grid">
        <div class="info-cell">
          <label>Thời hạn</label>
          <strong id="durValue">…</strong>
        </div>
        <div class="info-cell">
          <label>Trạng thái</label>
          <strong id="statusValue">Sẵn sàng</strong>
        </div>
      </div>

      <div class="cap-box">
        <label>Xác minh (toán)</label>
        <div class="cap-row">
          <span id="captchaPrompt" class="cap-prompt">…</span>
          <input id="captchaAnswer" class="input" type="text" inputmode="numeric" autocomplete="off" placeholder="?">
          <button type="button" id="captchaRefresh" class="btn icon-btn" title="Đổi câu hỏi">↻</button>
        </div>
      </div>

      <button type="button" id="start" class="btn primary lg" style="margin-top:18px">
        <span id="startLabel">Get Key</span>
      </button>

      <div id="result" class="hidden" role="status" aria-live="polite"></div>
      <a class="admin-link" href="./admin.html">Đăng nhập Admin →</a>
    </div>
  </main>
</div>

<script src="./config.js?v=111"></script>
<script src="./supabase-api.js?v=111"></script>
<script>
(function () {
  function viErr(err) {
    var m = {
      MAINTENANCE: "Hệ thống đang bảo trì. Thử lại sau.",
      BANNED: "Bạn đã bị khóa tạm thời.",
      RATE_LIMITED: "Thao tác quá nhiều. Thử lại sau.",
      CAPTCHA_INVALID: "Captcha sai hoặc hết hạn. Thử lại.",
      SHORTENER_NOT_CONFIGURED: "Chưa cấu hình API rút gọn.",
      SHORTENER_UPSTREAM: "Lỗi dịch vụ rút gọn.",
      SHORTENER_INVALID_RESPONSE: "Phản hồi rút gọn không hợp lệ.",
      ERR: "Không tạo được phiên. Thử lại."
    };
    return m[err] || m.ERR;
  }
  var captchaId = "";
  var durEl = document.getElementById("durValue");
  var statusEl = document.getElementById("statusValue");
  var btn = document.getElementById("start");
  var label = document.getElementById("startLabel");
  var result = document.getElementById("result");
  var promptEl = document.getElementById("captchaPrompt");
  var answerEl = document.getElementById("captchaAnswer");

  function setLoading(on, text) {
    btn.disabled = on;
    btn.classList.toggle("loading", on);
    label.textContent = text || (on ? "Đang xử lý…" : "Get Key");
  }
  function showAlert(type, msg) {
    result.className = type === "err" ? "err" : "";
    result.textContent = msg;
    result.classList.remove("hidden");
  }
  async function loadCaptcha() {
    promptEl.textContent = "…";
    captchaId = "";
    answerEl.value = "";
    try {
      var v = BDZ.visitorId();
      var x = await BDZ.edge("web-get-key", { action: "captcha", ip: v, visitor_id: v });
      if (!x || !x.ok) throw Error(x && x.error || "CAPTCHA");
      captchaId = x.captcha_id;
      promptEl.textContent = x.prompt || "?";
    } catch (e) {
      promptEl.textContent = "Lỗi";
      showAlert("err", "Không tải được captcha.");
    }
  }
  document.getElementById("captchaRefresh").onclick = loadCaptcha;
  (async function () {
    try {
      if (typeof BDZ !== "undefined" && BDZ.rpc) {
        var x = await BDZ.rpc("bdz_public_key_info", {});
        durEl.textContent = ((x && x.duration_hours) || 5) + " giờ";
      } else durEl.textContent = "5 giờ";
    } catch (_) { durEl.textContent = "5 giờ"; }
    await loadCaptcha();
  })();
  btn.onclick = async function () {
    if (btn.disabled) return;
    var ans = (answerEl.value || "").trim();
    if (!captchaId || !ans) { showAlert("err", "Nhập kết quả captcha."); return; }
    setLoading(true, "Đang chuẩn bị…");
    statusEl.textContent = "Đang tạo phiên…";
    result.classList.add("hidden");
    try {
      if (typeof BDZ === "undefined") throw Error("Chưa tải cấu hình. Refresh trang.");
      var v = BDZ.visitorId();
      var x = await BDZ.edge("web-get-key", {
        action: "start", ip: v, visitor_id: v,
        captcha_id: captchaId, captcha_answer: ans
      });
      if (!x || !x.ok || !x.shortenedUrl) {
        await loadCaptcha();
        throw Error(viErr(x && x.error));
      }
      setLoading(true, "Đang chuyển tiếp…");
      statusEl.textContent = "Phiên 1/" + (x.total_steps || 1);
      window.location.href = x.shortenedUrl;
    } catch (e) {
      setLoading(false, "Get Key");
      statusEl.textContent = "Lỗi";
      showAlert("err", e.message || "Lỗi");
    }
  };
})();
</script>
</body>
</html>

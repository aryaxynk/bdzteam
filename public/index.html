<body class="min-h-screen overflow-hidden bg-background text-foreground antialiased selection:bg-indigo-500/30">
<!-- Ambient layers — low opacity glass depth -->
<div class="pointer-events-none fixed inset-0 bg-[radial-gradient(ellipse_70%_45%_at_50%_-15%,rgba(99,102,241,0.14),transparent),radial-gradient(ellipse_45%_35%_at_85%_100%,rgba(16,185,129,0.08),transparent)]"></div>
<div class="pointer-events-none fixed inset-0 bg-neutral-950/20 backdrop-blur-[1px]"></div>

<main class="relative z-10 flex min-h-screen items-center justify-center p-4">
  <div class="w-full max-w-md animate-fade-in rounded-lg border border-neutral-800 bg-neutral-900/25 backdrop-blur-md">
    <!-- Header -->
    <div class="flex items-center justify-between gap-3 border-b border-neutral-800 px-5 py-4">
      <a href="./" class="group flex items-center gap-2.5 no-underline">
        <img src="https://263.org.vn/logo?v=20261003" alt="" width="28" height="28" class="h-7 w-7 rounded-md transition-transform duration-300 ease-in-out group-hover:scale-105">
        <span class="leading-tight">
          <span class="block text-sm font-semibold tracking-tight text-neutral-50">BDZMOD</span>
          <span class="block text-[10px] font-medium uppercase tracking-widest text-neutral-500">Key Service</span>
        </span>
      </a>
      <a href="./admin.html" class="inline-flex h-8 items-center rounded-md border border-neutral-800 bg-neutral-900/20 px-3 text-xs font-medium text-neutral-400 transition-all duration-300 ease-in-out hover:border-neutral-700 hover:bg-neutral-800/40 hover:text-neutral-100 no-underline">Admin</a>
    </div>

    <!-- Body -->
    <div class="px-5 py-5">
      <h1 class="text-xl font-semibold tracking-tight text-neutral-50">Nhận Key</h1>
      <p class="mt-1.5 text-sm leading-relaxed text-neutral-400">Nhấn Get Key, hoàn tất vượt link, hệ thống sẽ cấp Key cho bạn.</p>

      <!-- Info table -->
      <div class="mt-5 overflow-hidden rounded-lg border border-neutral-800 bg-neutral-900/20">
        <table class="w-full text-sm">
          <tbody>
            <tr class="border-b border-neutral-800">
              <th class="w-[42%] bg-neutral-900/30 px-3.5 py-2.5 text-left font-medium text-neutral-500">Thời hạn</th>
              <td id="durValue" class="px-3.5 py-2.5 font-medium text-neutral-100">…</td>
            </tr>
            <tr>
              <th class="bg-neutral-900/30 px-3.5 py-2.5 text-left font-medium text-neutral-500">Trạng thái</th>
              <td id="statusValue" class="px-3.5 py-2.5 font-medium text-neutral-100">Sẵn sàng</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Primary button -->
      <button type="button" id="start" class="group mt-5 inline-flex h-10 w-full items-center justify-center gap-2 rounded-md border border-transparent bg-neutral-50 px-4 text-sm font-semibold text-neutral-950 transition-all duration-300 ease-in-out hover:bg-white active:scale-[0.98] disabled:pointer-events-none disabled:opacity-50">
        <svg id="startSpin" class="hidden h-4 w-4 animate-spin text-indigo-600" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
          <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <span id="startLabel">Get Key</span>
      </button>

      <!-- Alert -->
      <div id="result" role="status" aria-live="polite" class="mt-3 hidden rounded-md border px-3.5 py-2.5 text-sm leading-relaxed transition-all duration-300 ease-in-out"></div>

      <!-- Steps -->
      <div class="mt-5 border-t border-neutral-800 pt-4 text-xs leading-relaxed text-neutral-500">
        <p><span class="font-medium text-neutral-300">1.</span> Bấm Get Key → mở link vượt</p>
        <p><span class="font-medium text-neutral-300">2.</span> Hoàn tất yêu cầu trên trang vượt link</p>
        <p><span class="font-medium text-neutral-300">3.</span> Quay lại và nhận Key (dùng 1 lần)</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-between border-t border-neutral-800 px-5 py-3 text-[11px] text-neutral-500">
      <span>BDZMOD</span>
      <span class="inline-flex items-center gap-1.5">
        <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse-dot"></span>
        Online
      </span>
    </div>
  </div>
</main>

<script src="./config.js?v=111"></script>
<script src="./supabase-api.js?v=111"></script>
<script>
(function () {
  function viErr(err) {
    var m = {
      MAINTENANCE: "Hệ thống đang bảo trì. Thử lại sau.",
      BANNED: "Bạn đã bị khóa tạm thời.",
      RATE_LIMITED: "Thao tác quá nhiều. Thử lại sau.",
      NO_KEYS: "Hết key. Quay lại sau.",
      SHORTENER_NOT_CONFIGURED: "Rút gọn chưa cấu hình.",
      SHORTENER_UPSTREAM: "Lỗi dịch vụ rút gọn.",
      ERR: "Không tạo được phiên. Thử lại."
    };
    return m[err] || m.ERR;
  }

  var durEl = document.getElementById("durValue");
  var statusEl = document.getElementById("statusValue");
  var btn = document.getElementById("start");
  var label = document.getElementById("startLabel");
  var spin = document.getElementById("startSpin");
  var result = document.getElementById("result");

  function setLoading(on, text) {
    btn.disabled = on;
    if (on) {
      spin.classList.remove("hidden");
      label.textContent = text || "Đang xử lý…";
    } else {
      spin.classList.add("hidden");
      label.textContent = text || "Get Key";
    }
  }

  function showAlert(type, msg) {
    result.className = "mt-3 rounded-md border px-3.5 py-2.5 text-sm leading-relaxed transition-all duration-300 ease-in-out animate-fade-in";
    if (type === "err") {
      result.className += " border-red-500/25 bg-red-500/10 text-red-400";
    } else if (type === "ok") {
      result.className += " border-emerald-500/25 bg-emerald-500/10 text-emerald-400";
    } else {
      result.className += " border-indigo-500/20 bg-indigo-500/10 text-indigo-300";
    }
    result.textContent = msg;
    result.classList.remove("hidden");
  }

  (async function loadDuration() {
    try {
      if (typeof BDZ === "undefined" || !BDZ.rpc) {
        durEl.textContent = "5 giờ";
        return;
      }
      var x = await BDZ.rpc("bdz_public_key_info", {});
      var h = (x && x.duration_hours) || 5;
      durEl.textContent = h + " giờ";
    } catch (e) {
      durEl.textContent = "5 giờ";
    }
  })();

  btn.onclick = async function () {
    if (btn.disabled) return;
    setLoading(true, "Đang chuẩn bị…");
    statusEl.textContent = "Đang tạo link…";
    result.classList.add("hidden");
    result.textContent = "";
    try {
      if (typeof BDZ === "undefined") throw Error("Chưa tải cấu hình. Refresh trang.");
      var v = BDZ.visitorId();
      var x = await BDZ.edge("web-get-key", { action: "start", ip: v, visitor_id: v });
      if (!x || !x.ok || !x.shortenedUrl) throw Error(viErr(x && x.error));
      setLoading(true, "Đang chuyển tiếp…");
      statusEl.textContent = "Chuyển hướng…";
      window.location.href = x.shortenedUrl;
    } catch (e) {
      setLoading(false, "Get Key");
      statusEl.textContent = "Lỗi";
      showAlert("err", e.message || "Lỗi");
    }
  };
})();
</script>
</body>
</html>

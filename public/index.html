<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="BDZMOD — nhận Key">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="./security-hardening.js?v=121"></script>
<title>BDZMOD — Nhận Key</title>
<link rel="icon" type="image/png" href="https://263.org.vn/logo?v=20261003">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=160">
<style>
  .gk-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    position: relative;
    z-index: 1;
  }
  .gk-card {
    width: min(420px, 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--bg-elevated);
    box-shadow: 0 24px 64px -28px rgba(0,0,0,0.65);
    animation: fade-in 0.45s var(--ease) both;
    overflow: hidden;
  }
  .gk-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
  }
  .gk-brand {
    display: flex;
    align-items: center;
    gap: 11px;
    color: inherit;
    text-decoration: none;
  }
  .gk-brand img {
    width: 32px;
    height: 32px;
    border-radius: 10px;
  }
  .gk-brand strong {
    display: block;
    font-size: 14px;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .gk-brand small {
    display: block;
    font-size: 10px;
    color: var(--fg-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 1px;
  }
  .gk-body { padding: 20px 18px; }
  .gk-body h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.03em;
  }
  .gk-body .lead {
    margin: 8px 0 0;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--fg-secondary);
  }
  .gk-info {
    margin-top: 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .gk-info table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .gk-info th {
    width: 42%;
    text-align: left;
    padding: 11px 14px;
    color: var(--fg-muted);
    font-weight: 500;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--line);
  }
  .gk-info td {
    padding: 11px 14px;
    font-weight: 550;
    border-bottom: 1px solid var(--line);
  }
  .gk-info tr:last-child th,
  .gk-info tr:last-child td { border-bottom: none; }
  .gk-captcha {
    margin-top: 14px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: rgba(255,255,255,0.015);
  }
  .gk-captcha label {
    display: block;
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 10px;
  }
  .gk-captcha-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .gk-prompt {
    min-width: 7.2rem;
    padding: 0 12px;
    min-height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--bg);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    font-weight: 600;
  }
  .gk-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--fg-muted);
  }
  .gk-online {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .gk-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.18);
    animation: pulse-dot 1.8s ease-in-out infinite;
  }
  #result {
    margin-top: 12px;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    line-height: 1.5;
  }
  #result.err {
    border: 1px solid rgba(248,113,113,0.25);
    background: var(--danger-soft);
    color: #fecaca;
  }
  #result.info {
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.03);
    color: var(--fg-secondary);
  }
</style>
</head>
<body>
<main class="gk-wrap">
  <div class="gk-card">
    <div class="gk-head">
      <a href="./" class="gk-brand">
        <img src="https://263.org.vn/logo?v=20261003" alt="">
        <span>
          <strong>BDZMOD</strong>
          <small>Key Service</small>
        </span>
      </a>
      <a href="./admin.html" class="btn sm">Admin</a>
    </div>

    <div class="gk-body">
      <h1>Nhận Key</h1>
      <p class="lead">Giải captcha, vượt link theo phiên, rồi nhận Key.</p>

      <div class="gk-info">
        <table>
          <tr>
            <th>Thời hạn</th>
            <td id="durValue">…</td>
          </tr>
          <tr>
            <th>Trạng thái</th>
            <td id="statusValue">Sẵn sàng</td>
          </tr>
        </table>
      </div>

      <div class="gk-captcha">
        <label>Xác minh (toán)</label>
        <div class="gk-captcha-row">
          <span id="captchaPrompt" class="gk-prompt">…</span>
          <input id="captchaAnswer" class="input" type="text" inputmode="numeric" autocomplete="off" placeholder="?">
          <button type="button" id="captchaRefresh" class="btn icon-btn" title="Đổi câu hỏi">↻</button>
        </div>
      </div>

      <button type="button" id="start" class="btn primary lg" style="margin-top:16px">
        <span id="startLabel">Get Key</span>
      </button>

      <div id="result" class="hidden" role="status" aria-live="polite"></div>
    </div>

    <div class="gk-foot">
      <span>BDZMOD</span>
      <span class="gk-online"><span class="gk-dot"></span>Online</span>
    </div>
  </div>
</main>

<script src="./config.js?v=111"></script>
<script src="./supabase-api.js?v=111"></script>
<script>
(function () {
  function viErr(err) {
    var m = {
      MAINTENANCE: "Hệ thống đang bảo trì. Thử lại sau.",
      BANNED: "Bạn đã bị khóa tạm thời.",
      RATE_LIMITED: "Thao tác quá nhiều. Thử lại sau.",
      CAPTCHA_INVALID: "Captcha sai hoặc hết hạn. Thử lại.",
      SHORTENER_NOT_CONFIGURED: "Chưa cấu hình API rút gọn.",
      SHORTENER_UPSTREAM: "Lỗi dịch vụ rút gọn.",
      SHORTENER_INVALID_RESPONSE: "Phản hồi rút gọn không hợp lệ.",
      ERR: "Không tạo được phiên. Thử lại."
    };
    return m[err] || m.ERR;
  }

  var captchaId = "";
  var durEl = document.getElementById("durValue");
  var statusEl = document.getElementById("statusValue");
  var btn = document.getElementById("start");
  var label = document.getElementById("startLabel");
  var result = document.getElementById("result");
  var promptEl = document.getElementById("captchaPrompt");
  var answerEl = document.getElementById("captchaAnswer");

  function setLoading(on, text) {
    btn.disabled = on;
    btn.classList.toggle("loading", on);
    label.textContent = text || (on ? "Đang xử lý…" : "Get Key");
  }

  function showAlert(type, msg) {
    result.className = type === "err" ? "err" : "info";
    result.textContent = msg;
    result.classList.remove("hidden");
  }

  async function loadCaptcha() {
    promptEl.textContent = "…";
    captchaId = "";
    answerEl.value = "";
    try {
      var v = BDZ.visitorId();
      var x = await BDZ.edge("web-get-key", { action: "captcha", ip: v, visitor_id: v });
      if (!x || !x.ok) throw Error(x && x.error || "CAPTCHA");
      captchaId = x.captcha_id;
      promptEl.textContent = x.prompt || "?";
    } catch (e) {
      promptEl.textContent = "Lỗi";
      showAlert("err", "Không tải được captcha.");
    }
  }

  document.getElementById("captchaRefresh").onclick = loadCaptcha;

  (async function () {
    try {
      if (typeof BDZ !== "undefined" && BDZ.rpc) {
        var x = await BDZ.rpc("bdz_public_key_info", {});
        durEl.textContent = ((x && x.duration_hours) || 5) + " giờ";
      } else durEl.textContent = "5 giờ";
    } catch (_) { durEl.textContent = "5 giờ"; }
    await loadCaptcha();
  })();

  btn.onclick = async function () {
    if (btn.disabled) return;
    var ans = (answerEl.value || "").trim();
    if (!captchaId || !ans) { showAlert("err", "Nhập kết quả captcha."); return; }
    setLoading(true, "Đang chuẩn bị…");
    statusEl.textContent = "Đang tạo phiên…";
    result.classList.add("hidden");
    try {
      if (typeof BDZ === "undefined") throw Error("Chưa tải cấu hình. Refresh trang.");
      var v = BDZ.visitorId();
      var x = await BDZ.edge("web-get-key", {
        action: "start",
        ip: v,
        visitor_id: v,
        captcha_id: captchaId,
        captcha_answer: ans
      });
      if (!x || !x.ok || !x.shortenedUrl) {
        await loadCaptcha();
        throw Error(viErr(x && x.error));
      }
      setLoading(true, "Đang chuyển tiếp…");
      statusEl.textContent = "Phiên 1/" + (x.total_steps || 1);
      window.location.href = x.shortenedUrl;
    } catch (e) {
      setLoading(false, "Get Key");
      statusEl.textContent = "Lỗi";
      showAlert("err", e.message || "Lỗi");
    }
  };
})();
</script>
</body>
</html>

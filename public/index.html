<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Nhận Key · BDZ</title>
<link rel="stylesheet" href="./style.css?v=111">
<link rel="icon" type="image/png" href="https://263.org.vn/logo?v=20261003">
<link rel="apple-touch-icon" href="https://263.org.vn/logo?v=20261003">
</head>
<body>
<script>document.documentElement.dataset.theme=localStorage.getItem('bdz_theme')||'light';</script>

<header class="site-nav">
  <a class="nav-brand" href="./">
    <img src="https://263.org.vn/logo?v=20261003" alt="" width="32" height="32" referrerpolicy="no-referrer" style="width:32px;height:32px;object-fit:cover;border-radius:10px">
    <span>BDZ Key</span>
  </a>
  <nav class="nav-links">
    <a href="./" class="active">Nhận key</a>
  </nav>
  <div class="nav-actions">
    <a href="./admin.html" class="btn sm ghost">Admin</a>
    <button type="button" class="btn sm" id="themeBtn" title="Sáng / Tối">◐</button>
  </div>
</header>

<main class="studio">
  <section class="studio-hero">
    <p class="eyebrow">Key system</p>
    <h1>Nhận Key</h1>
    <p class="lead">Vượt link một lần · gắn thiết bị · dùng trong app.</p>
    <div class="chips">
      <span class="chip" id="durLine">Thời hạn · —</span>
      <span class="chip">Bind device</span>
      <span class="chip">Secure API</span>
    </div>
  </section>

  <section class="studio-panel">
    <div class="panel-head">
      <div>
        <p class="eyebrow">Bước tiếp theo</p>
        <h2>Tạo phiên nhận key</h2>
      </div>
    </div>
    <p class="panel-desc">Nhấn nút bên dưới để nhận key.</p>
    <button id="start" class="btn primary lg">Bắt đầu nhận key</button>
    <div id="result" class="result hidden">
      <div id="status"></div>
      <div id="link" class="result-link"></div>
    </div>
    <p class="hint foot-hint">Không chia sẻ key công khai.</p>
  </section>
</main>

<footer class="site-foot">
  <span>BDZ Team</span>
</footer>
<script src="./config.js?v=111"></script>
<script src="./supabase-api.js?v=111"></script>
<script>
(function(){
  function viErr(err){
    var m={
      MAINTENANCE:'Hệ thống đang bảo trì. Vui lòng thử lại sau.',
      BANNED:'Bạn đã bị khóa tạm thời. Vui lòng thử lại sau.',
      RATE_LIMITED:'Thao tác quá nhiều. Thử lại sau.',
      NO_KEYS:'Hết key. Vui lòng quay lại sau.',
      ERR:'Không tạo được phiên. Thử lại.'
    };
    return m[err]||m.ERR;
  }
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
  var lastTouch=0;
  document.addEventListener('touchend', function(e){
    var now=Date.now();
    if(now-lastTouch<=300){ e.preventDefault(); }
    lastTouch=now;
  }, {passive:false});
  document.addEventListener('wheel', function(e){
    if(e.ctrlKey){ e.preventDefault(); }
  }, {passive:false});
  document.addEventListener('keydown', function(e){
    if((e.ctrlKey||e.metaKey)&&(e.key==='+'||e.key==='-'||e.key==='='||e.key==='0')) e.preventDefault();
  });
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C'))||(e.ctrlKey&&e.key==='u')) e.preventDefault();
  });
  document.getElementById('themeBtn').onclick=function(){
    var n=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=n;
    localStorage.setItem('bdz_theme',n);
  };
  (async function(){
    var el=document.getElementById('durLine');
    try{
      if(typeof BDZ==='undefined'||!BDZ.rpc){ el.textContent='Thời hạn · 5 giờ'; return; }
      var x=await BDZ.rpc('bdz_public_key_info',{});
      var h=(x&&x.duration_hours)||5;
      el.textContent='Thời hạn · '+h+' giờ';
    }catch(e){ el.textContent='Thời hạn · 5 giờ'; }
  })();
  var b=document.getElementById('start'), box=document.getElementById('result'),
      s=document.getElementById('status'), l=document.getElementById('link');
  var btnLabel=b.textContent;
  b.onclick=async function(){
    if(b.disabled) return;
    b.disabled=true;
    b.classList.add('loading');
    b.textContent='…';
    if(box){ box.classList.add('hidden'); box.className='result hidden'; }
    if(s) s.textContent='';
    if(l) l.textContent='';
    try{
      if(typeof BDZ==='undefined') throw Error('Chưa tải cấu hình. Refresh trang.');
      var v=BDZ.visitorId();
      var x=await BDZ.edge('web-get-key',{action:'start',ip:v,visitor_id:v});
      if(!x||!x.ok||!x.shortenedUrl) throw Error(viErr(x&&x.error));
      b.textContent='…';
      window.location.href=x.shortenedUrl;
      return;
    }catch(e){
      b.disabled=false;
      b.classList.remove('loading');
      b.textContent=btnLabel;
      if(box){ box.classList.remove('hidden'); box.className='result err'; }
      if(s) s.textContent=e.message||'Lỗi';
    }
  };
})();
</script>
</body>
</html>

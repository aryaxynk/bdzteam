<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Key</title>
<link rel="stylesheet" href="./style.css">
<link rel="icon" href="https://263.org.vn/logo">
</head>
<body>
<main class="login-page">
  <div class="login-box">
    <div class="logo-wrap"><img src="https://263.org.vn/logo" alt="" referrerpolicy="no-referrer"></div>
    <h1>Nhận Key</h1>
    <p class="sub">Hoàn tất bước vượt link để nhận key</p>
    <button id="start" class="btn primary" style="width:100%">Bắt đầu</button>
    <div id="result" class="hidden" style="margin-top:14px">
      <div id="status"></div>
      <div id="link" style="margin-top:8px;word-break:break-all"></div>
    </div>
  </div>
</main>
<script src="./config.js"></script>
<script src="./supabase-api.js"></script>
<script>
(function(){
  const t=localStorage.getItem('bdz_theme')||'light';
  document.documentElement.dataset.theme=t;
  const b=document.getElementById('start'), box=document.getElementById('result'),
        s=document.getElementById('status'), l=document.getElementById('link');
  b.onclick=async()=>{
    b.disabled=true; box.classList.remove('hidden'); box.className='okbox';
    s.textContent='Đang tạo…'; l.textContent='';
    try{
      const v=BDZ.visitorId();
      const x=await BDZ.edge('web-get-key',{action:'start',ip:v,visitor_id:v});
      if(!x?.ok||!x?.shortenedUrl) throw Error(x?.error||'Không tạo được');
      s.textContent='Link sẵn sàng';
      const a=document.createElement('a'); a.href=x.shortenedUrl; a.target='_blank'; a.rel='noopener noreferrer';
      a.textContent='Mở liên kết'; a.style.fontWeight='700';
      l.append(a);
    }catch(e){ box.className='err'; s.textContent=e.message||'Lỗi'; }
    finally{ b.disabled=false; }
  };
})();
</script>
</body>
</html>

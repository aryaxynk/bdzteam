<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BDZ Key</title>
<link rel="stylesheet" href="./neo.css">
</head>
<body>
<main class="wrap" style="min-height:100vh;display:grid;place-items:center;padding:24px 0">
  <section class="neo panel" style="width:min(520px,100%);padding:28px;background:#fffdf8">
    <header style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div class="brand"><span class="logo">BZ</span>BDZ KEY</div>
      <span class="tag">GET KEY</span>
    </header>
    <h1 style="font-size:clamp(32px,7vw,48px);line-height:1;margin:18px 0 8px;letter-spacing:-.04em">NHẬN KEY.</h1>
    <p class="muted" style="margin:0 0 18px">Vượt link → nhận key 1 lần · mặc định 5 giờ · 1 device.</p>
    <div class="neo-sm" style="padding:14px;margin-bottom:18px;background:#8fd8ff;font-weight:750;font-size:14px">
      1. Bấm bắt đầu<br>
      2. Hoàn tất VuotLink<br>
      3. Quay lại nhận key
    </div>
    <button id="start" class="btn primary" style="width:100%">BẮT ĐẦU GET KEY →</button>
    <div id="result" class="status info hidden" style="margin-top:16px">
      <div id="status"></div>
      <div id="link" style="margin-top:8px;word-break:break-all"></div>
    </div>
    <p style="margin:18px 0 0;font-size:11px;font-weight:750;color:#4e514f">Token 1 lần · IP/visitor bind · Admin: <a href="./admin.html" style="color:#111">vào đây</a></p>
  </section>
</main>
<script src="./config.js"></script>
<script src="./supabase-api.js"></script>
<script>
const b=document.getElementById('start'), box=document.getElementById('result'), s=document.getElementById('status'), l=document.getElementById('link');
b.onclick=async()=>{
  b.disabled=true; box.classList.remove('hidden'); box.className='status info'; s.textContent='Đang tạo link…'; l.textContent='';
  try{
    const visitor=BDZ.visitorId();
    const x=await BDZ.edge('web-get-key',{action:'start',ip:visitor,visitor_id:visitor});
    if(!x?.ok||!x?.shortenedUrl) throw Error(x?.error==='SHORTENER_NOT_CONFIGURED'?'VuotLink chưa cấu hình.':(x?.error||'Không tạo được link.'));
    box.className='status ok'; s.textContent='✓ Link sẵn sàng';
    const a=document.createElement('a'); a.href=x.shortenedUrl; a.target='_blank'; a.rel='noopener'; a.textContent='MỞ VUOTLINK →'; a.style.fontWeight='1000'; a.style.color='#111';
    l.append(a);
  }catch(e){ box.className='status err'; s.textContent='✕ '+(e?.message||'Lỗi'); }
  finally{ b.disabled=false; }
};
</script>
</body>
</html>

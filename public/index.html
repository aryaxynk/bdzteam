<!doctype html>
<html lang="vi" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="BDZMOD — nhận Key">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="./security-hardening.js?v=121"></script>
<title>BDZMOD — Nhận Key</title>
<link rel="icon" type="image/png" href="https://263.org.vn/logo?v=20261003">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        border: 'hsl(240 4% 16%)',
        input: 'hsl(240 4% 16%)',
        ring: 'hsl(240 5% 64%)',
        background: 'hsl(240 6% 4%)',
        foreground: 'hsl(0 0% 98%)',
        card: 'hsl(240 5% 8%)',
        muted: 'hsl(240 4% 16%)',
        'muted-foreground': 'hsl(240 5% 64%)',
        primary: 'hsl(0 0% 98%)',
        'primary-foreground': 'hsl(240 6% 6%)',
        destructive: 'hsl(0 72% 51%)',
        accent: 'hsl(173 80% 40%)',
      },
      borderRadius: { lg: '0.5rem', md: '0.375rem', sm: '0.25rem' }
    }
  }
}
</script>
</head>
<body class="min-h-screen overflow-hidden bg-background text-foreground antialiased">
<div class="pointer-events-none fixed inset-0 bg-[radial-gradient(ellipse_80%_50%_at_50%_-20%,hsla(270,60%,40%,0.12),transparent),radial-gradient(ellipse_50%_40%_at_90%_100%,hsla(173,60%,40%,0.06),transparent)]"></div>

<main class="relative z-10 flex min-h-screen items-center justify-center p-4">
  <div class="w-full max-w-md rounded-lg border border-border bg-card/60 backdrop-blur-sm">
    <!-- Header -->
    <div class="flex items-center justify-between gap-3 border-b border-border px-5 py-4">
      <a href="./" class="flex items-center gap-2.5 no-underline">
        <img src="https://263.org.vn/logo?v=20261003" alt="" width="28" height="28" class="h-7 w-7 rounded-md">
        <span class="leading-tight">
          <span class="block text-sm font-semibold tracking-tight text-foreground">BDZMOD</span>
          <span class="block text-[10px] font-medium uppercase tracking-widest text-muted-foreground">Key Service</span>
        </span>
      </a>
      <a href="./admin.html" class="inline-flex h-8 items-center rounded-md border border-border bg-transparent px-3 text-xs font-medium text-muted-foreground transition-colors hover:bg-muted/40 hover:text-foreground no-underline">Admin</a>
    </div>

    <!-- Body -->
    <div class="px-5 py-5">
      <h1 class="text-xl font-semibold tracking-tight text-foreground">Nhận Key</h1>
      <p class="mt-1.5 text-sm text-muted-foreground leading-relaxed">Nhấn Get Key, hoàn tất vượt link, hệ thống sẽ cấp Key cho bạn.</p>

      <!-- Info table -->
      <div class="mt-5 overflow-hidden rounded-lg border border-border">
        <table class="w-full text-sm">
          <tbody>
            <tr class="border-b border-border">
              <th class="w-[42%] bg-muted/30 px-3.5 py-2.5 text-left font-medium text-muted-foreground">Thời hạn</th>
              <td id="durValue" class="px-3.5 py-2.5 font-medium text-foreground">…</td>
            </tr>
            <tr>
              <th class="bg-muted/30 px-3.5 py-2.5 text-left font-medium text-muted-foreground">Trạng thái</th>
              <td id="statusValue" class="px-3.5 py-2.5 font-medium text-foreground">Sẵn sàng</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Primary button -->
      <button type="button" id="start" class="mt-5 inline-flex h-10 w-full items-center justify-center rounded-md border border-transparent bg-primary px-4 text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/90 disabled:pointer-events-none disabled:opacity-50">
        Get Key
      </button>

      <!-- Alert -->
      <div id="result" role="status" aria-live="polite" class="mt-3 hidden rounded-md border px-3.5 py-2.5 text-sm leading-relaxed"></div>

      <!-- Steps -->
      <div class="mt-5 border-t border-border pt-4 text-xs leading-relaxed text-muted-foreground">
        <p><span class="font-medium text-foreground/80">1.</span> Bấm Get Key → mở link vượt</p>
        <p><span class="font-medium text-foreground/80">2.</span> Hoàn tất yêu cầu trên trang vượt link</p>
        <p><span class="font-medium text-foreground/80">3.</span> Quay lại và nhận Key (dùng 1 lần)</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-between border-t border-border px-5 py-3 text-[11px] text-muted-foreground">
      <span>BDZMOD</span>
      <span class="inline-flex items-center gap-1.5">
        <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
        Online
      </span>
    </div>
  </div>
</main>

<script src="./config.js?v=111"></script>
<script src="./supabase-api.js?v=111"></script>
<script>
(function () {
  function viErr(err) {
    var m = {
      MAINTENANCE: "Hệ thống đang bảo trì. Thử lại sau.",
      BANNED: "Bạn đã bị khóa tạm thời.",
      RATE_LIMITED: "Thao tác quá nhiều. Thử lại sau.",
      NO_KEYS: "Hết key. Quay lại sau.",
      SHORTENER_NOT_CONFIGURED: "Rút gọn chưa cấu hình.",
      SHORTENER_UPSTREAM: "Lỗi dịch vụ rút gọn.",
      ERR: "Không tạo được phiên. Thử lại."
    };
    return m[err] || m.ERR;
  }

  var durEl = document.getElementById("durValue");
  var statusEl = document.getElementById("statusValue");
  var btn = document.getElementById("start");
  var result = document.getElementById("result");

  function showAlert(type, msg) {
    result.className = "mt-3 rounded-md border px-3.5 py-2.5 text-sm leading-relaxed";
    if (type === "err") {
      result.className += " border-red-500/30 bg-red-500/10 text-red-400";
    } else {
      result.className += " border-border bg-muted/30 text-muted-foreground";
    }
    result.textContent = msg;
    result.classList.remove("hidden");
  }

  (async function loadDuration() {
    try {
      if (typeof BDZ === "undefined" || !BDZ.rpc) {
        durEl.textContent = "5 giờ";
        return;
      }
      var x = await BDZ.rpc("bdz_public_key_info", {});
      var h = (x && x.duration_hours) || 5;
      durEl.textContent = h + " giờ";
    } catch (e) {
      durEl.textContent = "5 giờ";
    }
  })();

  btn.onclick = async function () {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = "Đang chuẩn bị…";
    statusEl.textContent = "Đang tạo link…";
    result.classList.add("hidden");
    result.textContent = "";
    try {
      if (typeof BDZ === "undefined") throw Error("Chưa tải cấu hình. Refresh trang.");
      var v = BDZ.visitorId();
      var x = await BDZ.edge("web-get-key", { action: "start", ip: v, visitor_id: v });
      if (!x || !x.ok || !x.shortenedUrl) throw Error(viErr(x && x.error));
      btn.textContent = "Đang chuyển tiếp…";
      statusEl.textContent = "Chuyển hướng…";
      window.location.href = x.shortenedUrl;
    } catch (e) {
      btn.disabled = false;
      btn.textContent = "Get Key";
      statusEl.textContent = "Lỗi";
      showAlert("err", e.message || "Lỗi");
    }
  };
})();
</script>
</body>
</html>

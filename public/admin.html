<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDZTEAM - Dashboard</title><link rel="icon" href="https://files.catbox.moe/5tw3y4.jpg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><main class="wrap"><header class="nav"><a class="brand" href="/"><img class="logo" src="https://files.catbox.moe/5tw3y4.jpg"><span>BDZTEAM ADMIN</span></a><div class="nav-actions"><a class="btn" href="/">Trang chủ</a><button id="logout" class="btn">Đăng xuất</button></div></header><div id="error" class="error hidden"></div><section id="dash"><div class="grid stats"><div class="stat" style="background:#FFE3EF"><b>KEY</b><div id="st1" class="num">0</div></div><div class="stat" style="background:#FFF7DA"><b>ACTIVE</b><div id="st2" class="num">0</div></div><div class="stat" style="background:#E3FCEF"><b>VERIFY</b><div id="st3" class="num">0</div></div><div class="stat" style="background:#E4F0FF"><b>PRODUCT</b><div id="st4" class="num">0</div></div></div><div class="spacer"></div><section class="card"><h2>Quản lý Key</h2><div class="grid" style="grid-template-columns:2fr 1fr 1fr auto;align-items:end"><label>Product<select id="prod"></select></label><label>Giờ<input id="hours" class="input" type="number" value="10" min="1" max="720"></label><label>Key tùy chọn<input id="custom" class="input" placeholder="BDZ-..." autocomplete="off"></label><button id="createKey" class="btn yellow">Tạo Key</button></div><div class="spacer"></div><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th style="text-align:left;padding:9px">Key</th><th style="text-align:left;padding:9px">Sản phẩm</th><th style="text-align:left;padding:9px">Trạng thái</th><th style="text-align:left;padding:9px">Hết hạn</th><th style="padding:9px">Hành động</th></tr></thead><tbody id="keys"></tbody></table></div></section><div class="spacer"></div><section class="card"><h2>Sản phẩm</h2><div class="grid" style="grid-template-columns:2fr 2fr auto;align-items:end"><input id="pname" class="input" placeholder="Tên sản phẩm"><input id="pslug" class="input" placeholder="slug"><button id="createProduct" class="btn yellow">Thêm</button></div><div class="spacer"></div><div id="products" class="grid product-grid"></div></section><div class="spacer"></div><section class="card"><h2>Shortener</h2><p class="small muted">Token shortener vẫn chỉ được gửi tới Worker; trình duyệt admin không nhận token khi tải dashboard.</p><div id="shortener"></div></section><div class="spacer"></div><section class="card"><h2>Logs gần đây</h2><div id="logs" class="small"></div></section></section></main><script>const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const err=m=>{const x=$('#error');x.textContent=m||'';x.classList.toggle('hidden',!m)};async function api(path,opt={}){const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const d=await api('/api/admin/dashboard');$('#st1').textContent=d.stats.total_keys;$('#st2').textContent=d.stats.active_keys;$('#st3').textContent=d.stats.verifications;$('#st4').textContent=d.stats.products;$('#prod').innerHTML=d.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');$('#keys').innerHTML=d.keys.map(k=>'<tr style="border-top:1px solid #eee"><td style="padding:8px"><code>'+esc(k.key_code)+'</code></td><td style="padding:8px">'+esc(k.products?.name||'—')+'</td><td style="padding:8px">'+esc(k.status)+'</td><td style="padding:8px">'+(k.expires_at?new Date(k.expires_at).toLocaleString('vi-VN'):'—')+'</td><td style="padding:8px;display:flex;gap:5px"><button class="btn" onclick="toggleKey('+k.id+')">Đổi trạng thái</button><button class="btn" onclick="extendKey('+k.id+')">+24h</button><button class="btn" onclick="deleteKey('+k.id+')">Xóa</button></td></tr>').join('');$('#products').innerHTML=d.products.map(p=>'<div class="card" style="padding:13px;display:flex;justify-content:space-between;align-items:center"><div><b>'+esc(p.name)+'</b><div class="small muted">'+esc(p.slug)+'</div></div><button class="btn" onclick="deleteProduct('+p.id+')">Xóa</button></div>').join('');$('#shortener').innerHTML=Object.values(d.shortener).map(s=>'<div class="card" style="padding:12px;margin:8px 0"><b>Vị trí '+s.position+'</b> · '+esc(s.provider||'Chưa cấu hình')+' · quota '+s.quota+'/ngày'+(s.enabled?'':' · tắt')+'</div>').join('');$('#logs').innerHTML=d.logs.map(l=>'<div style="padding:7px 0;border-bottom:1px solid #eee"><b>'+esc(l.result)+'</b> · '+esc(l.key_code||'')+' · '+esc(l.ip_address||'')+' · '+new Date(l.created_at).toLocaleString('vi-VN')+'</div>').join('')}catch(e){if(e.message.includes('đăng nhập'))location.href='/login.html';else err(e.message)}}async function toggleKey(id){await api('/api/admin/key',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'toggle',id})});load()}async function deleteKey(id){if(!confirm('Xóa Key này?'))return;await api('/api/admin/key',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'delete',id})});load()}async function extendKey(id){await api('/api/admin/key',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'extend',id,hours:24})});load()}async function deleteProduct(id){if(!confirm('Xóa sản phẩm?'))return;await api('/api/admin/product',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'delete',id})});load()}$('#createKey').onclick=async()=>{try{const d=await api('/api/admin/key',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'create',product_id:Number($('#prod').value),duration_hours:Number($('#hours').value),key_code:$('#custom').value})});alert('Key: '+d.key_code);$('#custom').value='';load()}catch(e){err(e.message)}};$('#createProduct').onclick=async()=>{try{await api('/api/admin/product',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'create',name:$('#pname').value,slug:$('#pslug').value})});$('#pname').value='';$('#pslug').value='';load()}catch(e){err(e.message)}};$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.href='/login.html'};load();</script></body></html>

<link rel="icon" type="image/png" href="https://263.org.vn/logo?v=20261003">
</head>
<body>
<script>document.documentElement.dataset.theme=localStorage.getItem('bdz_theme')||'light';</script>
<div id="root"></div>
<script src="./config.js?v=103"></script>
<script src="./supabase-api.js?v=103"></script>
<script src="./admin-core.js?v=103"></script>
<script src="./admin-logic.js?v=103"></script>
<script src="./admin-logic2.js?v=103"></script>
<script src="./admin-versions.js?v=103"></script>
<script src="./admin-shop.js?v=103"></script>
<script src="./admin-extra.js?v=103"></script>
<script src="./chart-month.js?v=103"></script>
<script>
(function(){
  document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
  var lt=0;
  document.addEventListener('touchend',function(e){var n=Date.now();if(n-lt<=300)e.preventDefault();lt=n},{passive:false});
  document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});
  document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&(e.key==='+'||e.key==='-'||e.key==='='||e.key==='0'))e.preventDefault()});
})();
</script>
</body>
</html>

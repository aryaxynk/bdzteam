<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>BDZTEAM - Bảng Điều Khiển Admin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin-layout.css"></head><body class="min-h-screen"><div id="bdzPageLoader"><span class="loader"></span><span class="font-extrabold text-xs tracking-widest bg-[#FFCC00] border-2 border-[#111827] rounded-lg px-3 py-1.5 shadow-[3px 3px 0 #111827]">ĐANG TẢI...</span></div><button id="adminMenuBtn" aria-label="Mở menu quản trị"><i class="fa-solid fa-bars"></i></button><div id="adminOverlay" class="admin-overlay"></div><div class="admin-shell lg:grid lg:grid-cols-[240px_1fr]"><aside id="adminSidebar" class="admin-sidebar admin-sidebar-drawer p-4"><div class="flex items-center justify-between gap-2 mb-5"><div class="flex items-center gap-2 min-w-0"><img src="https://files.catbox.moe/5tw3y4.jpg" class="bdz-logo" alt="BDZTEAM"><div class="min-w-0"><div class="font-black truncate">BDZTEAM</div><div id="roleLabel" class="text-[10px] text-[#B9C2D0] truncate">ADMIN</div></div></div><button id="adminCloseBtn" class="lg:hidden text-white text-xl p-2" aria-label="Đóng menu"><i class="fa-solid fa-xmark"></i></button></div><nav id="adminNav" class="space-y-2"><button class="admin-tab active w-full" data-tab="dashboard"><i class="fa-solid fa-gauge"></i> Dashboard</button><button class="admin-tab w-full" data-tab="keys"><i class="fa-solid fa-key"></i> Quản Lý Key</button><button class="admin-tab w-full" data-tab="shortener"><i class="fa-solid fa-link"></i> Shortener</button><button class="admin-tab w-full" data-tab="products"><i class="fa-solid fa-box"></i> Sản Phẩm</button><button class="admin-tab w-full" data-tab="settings"><i class="fa-solid fa-gear"></i> Cấu Hình</button><button class="admin-tab w-full" data-tab="logs"><i class="fa-solid fa-clock-rotate-left"></i> Logs</button><button class="admin-tab w-full" data-tab="integration"><i class="fa-solid fa-code"></i> Tích Hợp API</button><button class="admin-tab w-full" data-tab="security"><i class="fa-solid fa-shield-halved"></i> Bảo Mật</button><button class="admin-tab w-full" data-tab="subadmins"><i class="fa-solid fa-user-shield"></i> Admin Phụ</button></nav><div class="border-t border-[#283145] mt-5 pt-4 space-y-2"><a href="/" class="admin-tab w-full"><i class="fa-solid fa-house"></i> Trang công khai</a><button id="logoutBtn" class="admin-tab w-full"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button></div></aside><main class="admin-main admin-content-safe p-4 md:p-6 lg:p-8"><div class="admin-head-row flex flex-wrap items-center justify-between gap-3 mb-5"><div><h1 id="tabTitle" class="admin-top-title text-2xl md:text-3xl font-black">Dashboard</h1><p id="tabSub" class="text-xs text-[#6B7280]">Tổng quan hệ thống</p></div><div class="admin-head-badge admin-role-badge text-xs font-bold bg-white border-2 border-[#111827] rounded-lg px-3 py-2 shadow-[3px 3px 0 #111827]">Cloudflare Edge · Proxy · Supabase</div></div><div id="flash" class="hidden"></div><div id="tabContent"></div></main></div><script src="/common.js"></script><script src="/admin-fixed.js"></script><script src="/admin-enhance.js"></script><script src="/api-guide.js"></script><script>(function(){const s=document.getElementById('adminSidebar'),o=document.getElementById('adminOverlay'),m=document.getElementById('adminMenuBtn'),c=document.getElementById('adminCloseBtn');const open=()=>{s?.classList.add('open');o?.classList.add('open');document.body.classList.add('admin-menu-open')};const close=()=>{s?.classList.remove('open');o?.classList.remove('open');document.body.classList.remove('admin-menu-open')};m?.addEventListener('click',open);c?.addEventListener('click',close);o?.add

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BDZ Admin</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f0e8;color:#111;font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{padding:18px}.wrap{width:min(1280px,100%);margin:auto}.neo{border:4px solid #111;box-shadow:8px 8px 0 #111}.neo-sm{border:3px solid #111;box-shadow:5px 5px 0 #111}.panel{background:#fffdf8;padding:22px}.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fffdf8;padding:14px 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:1000;letter-spacing:.04em}.logo{width:42px;height:42px;border:4px solid #111;background:#ffdf4d;display:grid;place-items:center;font-weight:1000}.tag{display:inline-block;border:3px solid #111;padding:4px 9px;font-size:11px;font-weight:1000;background:#fff}.blue{background:#8fd8ff}.yellow{background:#ffdf4d}.green{background:#8df58d}.pink{background:#ff8fb3}.muted{color:#565656}.grow{flex:1}.tabs{display:flex;gap:0;margin:18px 0;overflow:auto;background:#fffdf8}.tab{border:0;border-right:3px solid #111;background:#fff;padding:13px 17px;font-weight:1000;cursor:pointer;white-space:nowrap}.tab:last-child{border-right:0}.tab.active{background:#ffdf4d}.view{display:none}.view.active{display:block}.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;font-weight:1000;text-transform:uppercase}.input,.select{width:100%;border:4px solid #111;padding:11px 12px;background:#fff;font:inherit;font-weight:700;outline:0}.input:focus,.select:focus{background:#fff8b8}.btn{border:4px solid #111;background:#fff;padding:11px 16px;font:inherit;font-weight:1000;cursor:pointer;box-shadow:5px 5px 0 #111}.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #111}.btn.primary{background:#ffdf4d}.btn.pink{background:#ff8fb3}.btn.blue{background:#8fd8ff}.btn.green{background:#8df58d}.stats{display:grid;gap:14px;padding:17px}.stats b{font-size:12px}.stats strong{font-size:40px;line-height:1}.list{display:grid;gap:0;border:3px solid #111}.list div{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:2px solid #111}.list div:last-child{border-bottom:0}.toolbar{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.tableWrap{overflow:auto;border:4px solid #111;background:#fff}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px;border-right:2px solid #111;border-bottom:2px solid #111;text-align:left;vertical-align:top}th{background:#ffdf4d;font-size:12px;font-weight:1000}td:last-child,th:last-child{border-right:0}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.mini{padding:7px 9px;border:3px solid #111;box-shadow:3px 3px 0 #111;font-size:12px}.bar{height:16px;border:3px solid #111;background:#fff}.bar i{display:block;height:100%;background:#111}.barRow{display:grid;gap:6px;margin:10px 0}.barMeta{display:flex;justify-content:space-between;gap:10px}.code{white-space:pre-wrap;word-break:break-word;background:#111;color:#fff;border:4px solid #111;padding:14px;min-height:100px}.status{border:4px solid #111;padding:12px 14px;font-weight:900;margin-top:14px}.ok{background:#8df58d}.err{background:#ff8fb3}.info{background:#8fd8ff}.hidden{display:none!important}.login{min-height:calc(100vh - 36px);display:grid;place-items:center}.loginbox{width:min(520px,100%);background:#fffdf8;padding:26px}.loginbox h1{font-size:64px;line-height:.9;margin:18px 0 10px}.mt{margin-top:18px}.footer{text-align:center;font-size:12px;font-weight:800;padding:20px}.notice{border:3px solid #111;background:#8fd8ff;padding:12px;font-weight:800}@media(max-width:900px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}@media(max-width:600px){body{padding:10px}.g4,.g3{grid-template-columns:1fr}.btn{width:100%}.loginbox h1{font-size:50px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(()=>{
'use strict';
const CONFIG={url:'https://nklukqriopezsoalnghm.supabase.co',key:'sb_publishable_RUE5iV8GqoVCFxjVt5ZBpg_FlTC1v-0'};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=()=>sessionStorage.getItem('bdz_admin_token')||'';
function visitor(){let v=localStorage.getItem('bdz_visitor');if(!v){v=crypto.randomUUID?.()||String(Date.now())+Math.random();localStorage.setItem('bdz_visitor',v)}return v}
async function rpc(name,args={}){const r=await fetch(CONFIG.url+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:CONFIG.key,'content-type':'application/json'},body:JSON.stringify(args),cache:'no-store'});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x?.message||x?.error||('RPC_'+r.status));return x}
let keys=[];let page='dashboard';let timer=null;
function loginView(){return `<div class="login"><section class="neo loginbox"><div class="brand"><span class="logo">BZ</span><span>BDZ ADMIN</span></div><span class="tag blue">OWNER ACCESS</span><h1>ARYA.</h1><p class="muted">Key System Control Center</p><div class="field"><label>Tài khoản</label><input id="user" class="input" value="arya" autocomplete="username"></div><div class="field"><label>Mật khẩu</label><input id="pass" class="input" type="password" autocomplete="current-password"></div><button class="btn primary" id="doLogin">ĐĂNG NHẬP →</button><div id="loginErr" class="status err hidden"></div></section></div>`}
function appView(){return `<main class="wrap"><header class="neo top"><div class="brand"><span class="logo">BZ</span><span>BDZ CONTROL CENTER</span></div><span class="tag blue">OWNER • ARYA</span><span class="grow"></span><span id="clock" class="muted"></span><button class="btn" id="refresh">↻</button><button class="btn pink" id="logout">LOGOUT</button></header><nav class="neo-sm tabs">${[['dashboard','DASHBOARD'],['manage','QUẢN LÝ'],['stats','THỐNG KÊ'],['api','API'],['profile','PROFILE'],['settings','SETTINGS']].map(([k,v],i)=>`<button class="tab ${i?'':'active'}" data-page="${k}">${v}</button>`).join('')}</nav><div id="pages"></div><div class="footer">BDZ • GitHub Pages + Supabase</div></main>`}
function renderPages(){
$('pages').innerHTML=`<section id="p-dashboard" class="view active"><div class="grid g4"><div class="neo-sm stats yellow"><b>TOTAL KEYS</b><strong id="total">0</strong></div><div class="neo-sm stats green"><b>ACTIVE</b><strong id="active">0</strong></div><div class="neo-sm stats blue"><b>CHECKS</b><strong id="checks">0</strong></div><div class="neo-sm stats pink"><b>DEVICES</b><strong id="devices">0</strong></div></div><div class="grid g2 mt"><section class="neo panel"><h2>Tổng quan</h2><div id="overview" class="list"></div></section><section class="neo panel"><h2>Hoạt động gần đây</h2><div id="recent" class="list"></div></section></div></section><section id="p-manage" class="view"><section class="neo panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h2>Quản lý Key</h2><p class="muted">Tạo, bật/tắt, reset device/checks, sửa và xoá.</p></div><button class="btn primary" id="createKey">＋ TẠO KEY</button></div><div class="toolbar"><input id="search" class="input" placeholder="Tìm Key…"><select id="filter" class="select"><option value="">Tất cả</option><option>ACTIVE</option><option>DISABLED</option><option>EXPIRED</option><option>LIMIT_REACHED</option><option>REACTIVATED</option><option>CREATED</option></select></div><div class="tableWrap"><table><thead><tr><th>KEY</th><th>STATUS</th><th>CHECKS</th><th>DEVICE</th><th>EXPIRY</th><th>ACTIONS</th></tr></thead><tbody id="keyRows"></tbody></table></div></section></section><section id="p-stats" class="view"><div class="grid g3"><section class="neo panel"><h2>Trạng thái</h2><div id="statusStats"></div></section><section class="neo panel"><h2>Top checks</h2><div id="topStats"></div></section><section class="neo panel"><h2>Health</h2><div id="health"></div></section></div><section class="neo panel mt"><h2>Thống kê tổng</h2><div id="summary"></div></section></section><section id="p-api" class="view"><div class="grid g2"><section class="neo panel"><h2>API MAP</h2><div class="list"><div><b>GET KEY</b><span>Supabase Edge</span></div><div><b>CHECK KEY</b><span>bdz_check_key_public</span></div><div><b>ADMIN</b><span>bdz_admin_*</span></div><div><b>SHORTENER</b><span>VuotLink server-side</span></div></div></section><section class="neo panel"><h2>CHECK TESTER</h2><div class="field"><label>Key</label><input id="testKey" class="input"></div><div class="field"><label>Device ID</label><input id="testDevice" class="input" value="admin-test"></div><div class="field"><label>App version</label><input id="testVersion" class="input" value="V1"></div><button id="testBtn" class="btn primary">TEST →</button><pre id="testOut" class="code mt">Chưa test.</pre></section></div></section><section id="p-profile" class="view"><section class="neo panel"><span class="tag blue">OWNER</span><h2>ARYA.</h2><div class="grid g2"><div class="field"><label>Username</label><input id="profileUser" class="input" readonly></div><div class="field"><label>Role</label><input id="profileRole" class="input" readonly></div><div class="field"><label>Authentication</label><input value="Supabase RPC session" class="input" readonly></div><div class="field"><label>Password</label><input value="Stored as hash" class="input" readonly></div></div><div class="notice mt">Thông tin bí mật không được render vào client.</div></section></section><section id="p-settings" class="view"><div class="grid g2"><section class="neo panel"><h2>Giao diện</h2><div class="field"><label>Auto refresh</label><select id="auto" class="select"><option value="0">Tắt</option><option value="30">30 giây</option><option value="60">60 giây</option><option value="300">5 phút</option></select></div><button id="saveSettings" class="btn primary">LƯU SETTINGS</button><span id="saveMsg" class="muted"></span></section><section class="neo panel"><h2>Bảo mật</h2><div class="list"><div><b>One-time claim</b><span>ON</span></div><div><b>Context binding</b><span>ON</span></div><div><b>Rate limit</b><span>ON</span></div><div><b>Secrets</b><span>SERVER ONLY</span></div></div><button id="clearSession" class="btn pink mt">CLEAR SESSION</button></section></div></section>`;
}
function setPage(n){page=n;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===n));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='p-'+n))}
function bind(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('doLogin').onclick=login;$('logout').onclick=logout;$('refresh').onclick=load;$('createKey').onclick=createKey;$('search').oninput=table;$('filter').onchange=table;$('testBtn').onclick=testApi;$('saveSettings').onclick=saveSettings;$('clearSession').onclick=()=>{sessionStorage.clear();location.reload()};}
async function login(){const e=$('loginErr');e.classList.add('hidden');try{const x=await rpc('bdz_admin_login',{p_username:$('user').value.trim(),p_password:$('pass').value,p_ip:visitor(),p_user_agent:navigator.userAgent.slice(0,240)});if(!x?.ok)throw Error(x?.error||'INVALID_LOGIN');sessionStorage.setItem('bdz_admin_token',x.token);sessionStorage.setItem('bdz_admin_user',x.user||'arya');sessionStorage.setItem('bdz_admin_role',x.role||'OWNER');$('pass').value='';mountApp();await load()}catch(err){e.textContent='✕ '+(err.message==='INVALID_LOGIN'?'Sai tài khoản hoặc mật khẩu.':err.message);e.classList.remove('hidden')}}
async function logout(){try{await rpc('bdz_admin_logout',{p_token:token()})}catch{}sessionStorage.clear();location.reload()}
async function load(){if(!token())return;try{const x=await rpc('bdz_admin_keys',{p_token:token()});if(x?.error==='UNAUTHORIZED'){sessionStorage.clear();location.reload();return}keys=x?.keys||[];dashboard();table();stats()}catch(err){showGlobal('err',err.message||'Không tải được dữ liệu.')}}
function showGlobal(kind,msg){let x=$('globalMsg');if(!x){x=document.createElement('div');x.id='globalMsg';document.body.appendChild(x)}x.className='status '+kind;x.textContent='✕ '+msg;x.style.position='fixed';x.style.right='18px';x.style.bottom='18px';x.style.zIndex='99'}
function dashboard(){const a=keys.filter(k=>['ACTIVE','REACTIVATED'].includes(k.status)).length,c=keys.reduce((n,k)=>n+(Number(k.check_count)||0),0),d=keys.filter(k=>k.device_id_hash||k.activated_device_id_hash).length;$('total').textContent=keys.length;$('active').textContent=a;$('checks').textContent=c;$('devices').textContent=d;$('overview').innerHTML=[['FRONTEND','GitHub Pages'],['BACKEND','Supabase'],['SHORTENER','VuotLink'],['OWNER','ARYA / OWNER']].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');$('recent').innerHTML=keys.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,8).map(k=>`<div><b class="mono">${esc(k.key_code)}</b><span>${esc(k.status)}</span></div>`).join('')||'<div>Chưa có dữ liệu.</div>'}
function table(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value,r=keys.filter(k=>(!q||String(k.key_code).toLowerCase().includes(q))&&(!f||k.status===f));$('keyRows').innerHTML=r.map(k=>`<tr><td><b class="mono">${esc(k.key_code)}</b><div class="muted">#${k.id}</div></td><td><span class="tag">${esc(k.status)}</span></td><td>${k.check_count||0} / ${k.max_checks||'∞'}</td><td>${k.device_id_hash||k.activated_device_id_hash?'1':'0'} / ${k.max_devices||1}</td><td>${k.expires_at?new Date(k.expires_at).toLocaleString('vi-VN'):'—'}</td><td><button class="mini" onclick="window.BDZA.toggle(${k.id},'${['ACTIVE','REACTIVATED'].includes(k.status)?'DISABLED':'ACTIVE'}')">${['ACTIVE','REACTIVATED'].includes(k.status)?'DISABLE':'ENABLE'}</button> <button class="mini" onclick="window.BDZA.device(${k.id})">DEVICE</button> <button class="mini" onclick="window.BDZA.checks(${k.id})">CHECKS</button> <button class="mini" onclick="window.BDZA.edit(${k.id})">EDIT</button> <button class="mini pink" onclick="window.BDZA.remove(${k.id})">DELETE</button></td></tr>`).join('')||'<tr><td colspan="6">Không có Key.</td></tr>'}
function stats(){const c={};keys.forEach(k=>c[k.status]=(c[k.status]||0)+1);const total=keys.length||1;$('statusStats').innerHTML=Object.entries(c).map(([s,n])=>`<div class="barRow"><div class="barMeta"><b>${esc(s)}</b><span>${n}</span></div><div class="bar"><i style="width:${Math.round(n/total*100)}%"></i></div></div>`).join('')||'—';const top=keys.slice().sort((a,b)=>(Number(b.check_count)||0)-(Number(a.check_count)||0)).slice(0,8),mx=Math.max(1,...top.map(k=>Number(k.check_count)||0));$('topStats').innerHTML=top.map(k=>`<div class="barRow"><div class="barMeta"><b class="mono">${esc(String(k.key_code).slice(0,16))}</b><span>${k.check_count||0}</span></div><div class="bar"><i style="width:${Math.round((Number(k.check_count)||0)/mx*100)}%"></i></div></div>`).join('')||'—';const expired=keys.filter(k=>k.expires_at&&new Date(k.expires_at)<new Date()).length;$('health').innerHTML=[['API','READY'],['EXPIRED',expired],['BOUND',keys.filter(k=>k.device_id_hash||k.activated_device_id_hash).length]].map(x=>`<div class="list" style="margin:7px 0"><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join('');$('summary').innerHTML=`<p><b>${keys.length}</b> total keys · <b>${c.ACTIVE||0}</b> active · <b>${keys.reduce((n,k)=>n+(Number(k.check_count)||0),0)}</b> total checks.</p>`}
async function createKey(){const h=prompt('Thời hạn giờ:','24');if(h===null)return;const d=prompt('Max devices:','1');if(d===null)return;const c=prompt('Max checks (0 = unlimited):','100');if(c===null)return;try{const x=await rpc('bdz_admin_key_action',{p_token:token(),p_action:'create',p_payload:{duration_hours:Number(h),max_devices:Number(d),max_checks:Number(c)}});if(!x?.ok)throw Error(x?.error||'CREATE_FAILED');alert('KEY: '+(x.row?.key_code||'created'));await load()}catch(e){alert(e.message)}}
async function action(a,p){const x=await rpc('bdz_admin_key_action',{p_token:token(),p_action:a,p_payload:p});if(!x?.ok)throw Error(x?.error||'ACTION_FAILED');return x}
window.BDZA={toggle:async(id,s)=>{try{await action('status',{id,status:s});await load()}catch(e){alert(e.message)}},device:async id=>{if(!confirm('Reset device?'))return;try{await action('reset_device',{id});await load()}catch(e){alert(e.message)}},checks:async id=>{if(!confirm('Reset checks?'))return;try{await action('reset_checks',{id});await load()}catch(e){alert(e.message)}},edit:async id=>{const k=keys.find(x=>x.id===id);if(!k)return;const h=prompt('Thời hạn giờ:',k.duration_hours||24);if(h===null)return;const c=prompt('Max checks:',k.max_checks||100);if(c===null)return;try{await action('update',{id,duration_hours:Number(h),max_devices:Number(k.max_devices||1),max_checks:Number(c),key_code:k.key_code,status:k.status});await load()}catch(e){alert(e.message)}},remove:async id=>{if(!confirm('Xóa Key vĩnh viễn?'))return;try{await action('delete',{id});await load()}catch(e){alert(e.message)}}};
async function testApi(){const o=$('testOut');o.textContent='Đang test…';try{o.textContent=JSON.stringify(await rpc('bdz_check_key_public',{p_key:$('testKey').value.trim(),p_device_id:$('testDevice').value.trim(),p_app_version:$('testVersion').value.trim(),p_ip:null}),null,2)}catch(e){o.textContent='ERROR: '+e.message}}
function saveSettings(){localStorage.setItem('bdz_refresh',$('auto').value);$('saveMsg').textContent='Đã lưu ✓';if(timer)clearInterval(timer);const n=Number($('auto').value);if(n)timer=setInterval(load,n*1000)}
function mountApp(){$('root').innerHTML=appView();renderPages();bind();$('profileUser').value=sessionStorage.getItem('bdz_admin_user')||'arya';$('profileRole').value=sessionStorage.getItem('bdz_admin_role')||'OWNER';$('auto').value=localStorage.getItem('bdz_refresh')||'0';setInterval(()=>{if($('clock'))$('clock').textContent=new Date().toLocaleString('vi-VN')},1000)}
window.addEventListener('error',e=>{showGlobal('err','JS: '+(e.message||'Unknown error'))});
if(token()){mountApp();load()}else{$('root').innerHTML=loginView();$('doLogin').onclick=login}
})();
</script>
</body>
</html>

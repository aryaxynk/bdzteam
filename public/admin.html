<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050b18">
  <title>BDZTEAM - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css?v=admin-ui-v8">
  <link rel="stylesheet" href="/admin-layout.css?v=admin-ui-v8">
  <link rel="stylesheet" href="/admin-reference-ui.css?v=admin-ui-v8">
  <link rel="stylesheet" href="/admin-hotfix.css?v=admin-ui-v8">
  <link rel="stylesheet" href="/admin-ui-runtime.css?v=admin-ui-v8">
  <link rel="stylesheet" href="/admin-theme.css?v=admin-ui-v8">
</head>
<body class="min-h-screen">
  <div id="bdzPageLoader"><span class="loader"></span><span class="font-extrabold text-xs tracking-widest">ĐANG TẢI...</span></div>
  <div class="admin-shell">
    <div id="adminBackdrop" class="admin-backdrop" aria-hidden="true"></div>
    <aside id="adminSidebar" class="admin-sidebar" aria-label="Điều hướng Admin">
      <div class="admin-sidebar-brand">
        <a href="/" class="admin-brand"><img src="https://files.catbox.moe/xpaekr.jpg" alt="BDZTEAM"><span class="min-w-0"><span class="admin-brand-title block truncate">BDZTEAM</span><span id="roleLabel" class="admin-brand-role block truncate">ADMIN</span></span></a>
        <button id="adminCloseBtn" class="admin-mobile-close" type="button" aria-label="Đóng menu"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="admin-side-scroll">
        <div class="admin-nav-group"><div class="admin-nav-label">TỔNG QUAN</div><button class="admin-side-item active" data-tab="dashboard" type="button"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></button></div>
        <div class="admin-nav-group"><div class="admin-nav-label">QUẢN LÝ</div><button class="admin-side-item" data-tab="keys" type="button"><i class="fa-solid fa-key"></i><span>Quản Lý Key</span></button><button class="admin-side-item" data-tab="shortener" type="button"><i class="fa-solid fa-link"></i><span>Shortener</span></button><button class="admin-side-item" data-tab="products" type="button"><i class="fa-solid fa-box-open"></i><span>Sản Phẩm</span></button></div>
        <div class="admin-nav-group"><div class="admin-nav-label">HỆ THỐNG</div><button class="admin-side-item" data-tab="logs" type="button"><i class="fa-solid fa-clock-rotate-left"></i><span>Nhật Ký</span></button><button class="admin-side-item" data-tab="integration" type="button"><i class="fa-solid fa-code"></i><span>Tích Hợp API</span></button><button class="admin-side-item" data-tab="security" type="button"><i class="fa-solid fa-shield-halved"></i><span>Bảo Mật</span></button><button class="admin-side-item" data-tab="settings" type="button"><i class="fa-solid fa-sliders"></i><span>Cấu Hình</span></button></div>
        <div class="admin-nav-group"><div class="admin-nav-label">QUẢN TRỊ</div><button class="admin-side-item" data-tab="subadmins" type="button"><i class="fa-solid fa-user-shield"></i><span>Admin Phụ</span></button></div>
      </div>
      <div class="admin-sidebar-footer"><div class="admin-account-card"><div class="admin-account-avatar">A</div><div class="min-w-0 flex-1"><div class="admin-account-name truncate">Admin Panel</div><div class="admin-account-meta truncate">BDZTEAM</div></div></div><div class="admin-footer-actions"><a href="/" class="admin-footer-btn"><i class="fa-solid fa-house"></i><span>Trang chủ</span></a><button id="logoutBtn" class="admin-footer-btn danger" type="button"><i class="fa-solid fa-right-from-bracket"></i><span>Đăng xuất</span></button></div></div>
    </aside>
    <section class="admin-workspace">
      <header class="admin-topbar"><div class="admin-topbar-inner"><button id="adminMenuBtn" class="admin-menu-btn" type="button" aria-label="Thu gọn hoặc mở menu"><i class="fa-solid fa-bars"></i></button><div class="admin-topbar-hidden-copy"><h1 id="tabTitle">Dashboard</h1><p id="tabSub">Tổng quan hệ thống</p></div><div class="admin-topbar-right"><div class="admin-status-chip"><span class="admin-status-dot"></span> Hệ thống hoạt động</div><button class="admin-top-user" type="button" aria-label="Tài khoản"><i class="fa-regular fa-user"></i></button></div></div></header>
      <main class="admin-main admin-content-safe admin-main-wrap"><div id="flash" class="hidden"></div><div id="tabContent" class="admin-action-safe"></div></main>
    </section>
  </div>
  <script src="/common.js?v=admin-ui-v8"></script>
  <script src="/admin-fixed.js?v=admin-ui-v8"></script>
  <script src="/api-guide.js?v=admin-ui-v8"></script>
  <script src="/admin-session.js?v=admin-ui-v8"></script>
  <script src="/admin-runtime.js?v=admin-ui-v8"></script>
  <script src="/admin-ui-runtime.js?v=admin-ui-v8"></script>
  <script src="/admin-reference-ui.js?v=admin-ui-v8"></script>
</body>
</html>

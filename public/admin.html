<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDZ Admin</title><style>body{margin:0;background:#0b0b0e;color:#eee;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:28px}input,select,button{background:#15151b;color:#eee;border:1px solid #303039;border-radius:10px;padding:10px}button{cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:10px;border-bottom:1px solid #24242a;text-align:left}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#121218;border:1px solid #25252c;border-radius:18px;padding:18px;margin-bottom:18px}.muted{color:#888}@media(max-width:700px){.grid{grid-template-columns:1fr}}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}</style><div class="wrap"><div id="login" class="card"><h1>BDZ Admin</h1><div class="row"><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Đăng nhập</button></div><p id="err" class="muted"></p></div><div id="app" class="hidden"><div class="row" style="justify-content:space-between"><h1>Admin Dashboard</h1><button onclick="logout()">Đăng xuất</button></div><div class="grid"><section class="card"><h3>Tạo key</h3><div class="row"><select id="scope"><option value="quick">QUICK</option><option value="dev_ys">DEV YS</option></select><input id="hours" type="number" value="24" min="1"><button onclick="createKey()">Tạo key</button></div><p id="newkey"></p></section><section class="card"><h3>Trạng thái</h3><p id="stats" class="muted">Đang tải…</p></section></div><section class="card"><h3>Keys</h3><div style="overflow:auto"><table><thead><tr><th>Key</th><th>Scope</th><th>Status</th><th>Expires</th><th>Checks</th><th></th></tr></thead><tbody id="keys"></tbody></table></div></section><section class="card"><h3>Recent checks</h3><div style="overflow:auto"><table><thead><tr><th>Key ID</th><th>Scope</th><th>Result</th><th>Version</th><th>Time</th></tr></thead><tbody id="checks"></tbody></table></div></section></div></div><script>const $=id=>document.getElementById(id);async function api(o){const r=await fetch('/api/admin',{method:o.method||'GET',headers:{'content-type':'application/json'},body:o.body?JSON.stringify(o.body):undefined});const d=await r.json();if(r.status===401)showLogin();if(!r.ok)throw Error(d.error||'ERROR');return d}function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden')}async function login(){try{await api({method:'POST',body:{action:'login',username:$('user').value,password:$('pass').value}});await load()}catch(e){$('err').textContent=e.message}}async function logout(){await api({method:'POST',body:{action:'logout'}});showLogin()}async function load(){try{const d=await api({});$('login').classList.add('hidden');$('app').classList.remove('hidden');$('stats').textContent=`${d.keys.length} keys · ${d.users.length} Telegram users · ${d.checks.length} recent checks`;$('keys').innerHTML=d.keys.map(k=>`<tr><td>${k.key_code}</td><td>${k.key_scope}</td><td>${k.status}</td><td>${k.expires_at?new Date(k.expires_at).toLocaleString('vi-VN'):'—'}</td><td>${k.check_count}</td><td><button onclick="toggle(${k.id},'${k.status}')">${k.status==='ACTIVE'?'Khoá':'Mở'}</button> <button onclick="delKey(${k.id})">Xoá</button></td></tr>`).join('');$('checks').innerHTML=d.checks.map(c=>`<tr><td>${c.key_id}</td><td>${c.key_scope}</td><td>${c.result}</td><td>${c.app_version||'—'}</td><td>${new Date(c.created_at).toLocaleString('vi-VN')}</td></tr>`).join('')}catch(e){showLogin()}}async function createKey(){const d=await api({method:'POST',body:{action:'create_key',scope:$('scope').value,duration_hours:Number($('hours').value)}});$('newkey').textContent=d.key.key_code;load()}async function toggle(id,status){await api({method:'POST',body:{action:'set_status',id,status:status==='ACTIVE'?'DISABLED':'ACTIVE'}});load()}async function delKey(id){if(confirm('Xoá key này?')){await api({method:'POST',body:{action:'delete_key',id}});load()}}load()</script></html>

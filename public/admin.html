<script>
try{
  if(typeof shell==='function') shell();
  if(typeof tryRestoreSession==='function') setTimeout(tryRestoreSession, 30);
}catch(e){
  console.error(e);
  document.getElementById('root').innerHTML='<p style="padding:24px;font-family:sans-serif">Lỗi tải admin: '+e.message+'</p>';
}
(function(){
  function bind(el){
    if(el._glowBound) return;
    el._glowBound = true;
    el.addEventListener('pointermove', function(e){
      var r = el.getBoundingClientRect();
      el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      el.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  }
  function scan(){
    document.querySelectorAll('.card, .stat, .login-box, .btn.primary').forEach(bind);
  }
  document.addEventListener('pointerover', function(e){
    var t = e.target.closest && e.target.closest('.card, .stat, .login-box, .btn.primary');
    if(t) bind(t);
  }, true);
  setInterval(scan, 1500);
  setTimeout(scan, 400);
})();
</script>

</body>

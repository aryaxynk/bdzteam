<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="../security-hardening.js?v=121"></script>
<title>Phiên tiếp theo · BDZMOD</title>
<link rel="icon" type="image/png" href="https://263.org.vn/logo?v=20261003">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=210">
</head>
<body>
<main class="gk-page">
  <div class="gk-card">
    <div class="gk-head">
      <div class="gk-brand">
        <img src="https://263.org.vn/logo?v=20261003" alt="">
        <span><strong>BDZMOD</strong><small>Phiên</small></span>
      </div>
    </div>
    <h1>Tiếp tục phiên</h1>
    <p id="intro" class="sub">Đang xác minh…</p>
    <div id="progress" class="gk-bento hidden">
      <div class="gk-cell"><label>Đã vượt</label><strong id="stepDone">—</strong></div>
      <div class="gk-cell"><label>Còn lại</label><strong id="stepLeft">—</strong></div>
    </div>
    <div id="captchaBox" class="gk-cap hidden">
      <label>Captcha phiên tiếp</label>
      <div class="gk-cap-row">
        <span id="captchaPrompt" class="gk-prompt">…</span>
        <input id="captchaAnswer" class="input" type="text" inputmode="numeric" autocomplete="off" placeholder="?">
        <button type="button" id="captchaRefresh" class="btn icon-btn">↻</button>
      </div>
    </div>
    <button id="continueBtn" type="button" class="btn primary lg hidden" style="margin-top:4px"><span id="btnLabel">Tiếp tục vượt link</span></button>
    <div id="status" class="err" style="margin-top:14px;background:rgba(255,255,255,.03);border-color:var(--line);color:var(--fg-2)" role="status">Đang kiểm tra phiên…</div>
  </div>
</main>
<script src="../config.js?v=111"></script>
<script src="../supabase-api.js?v=111"></script>
<script>
(function () {
  function viErr(err) {
    var m = {TOKEN_NOT_FOUND:"Phiên không tồn tại.",TOKEN_ALREADY_USED:"Phiên đã dùng.",TOKEN_EXPIRED:"Phiên hết hạn. Nhận key lại.",TOKEN_CONTEXT_MISMATCH:"Mở link trên cùng thiết bị/IP.",CAPTCHA_INVALID:"Captcha sai hoặc hết hạn.",TOO_FAST:"Quá nhanh. Chờ vài giây rồi thử lại.",STEP_NOT_COMPLETED:"Chưa hoàn tất phiên trước.",SHORTENER_UPSTREAM:"Lỗi dịch vụ rút gọn.",SHORTENER_NOT_CONFIGURED:"API rút gọn chưa cấu hình."};
    return m[err] || err || "Lỗi phiên.";
  }
  var token = (new URLSearchParams(location.search).get("token") || "").trim();
  var captchaId = "";
  var status = document.getElementById("status");
  var intro = document.getElementById("intro");
  var progress = document.getElementById("progress");
  var captchaBox = document.getElementById("captchaBox");
  var continueBtn = document.getElementById("continueBtn");
  var btnLabel = document.getElementById("btnLabel");
  function setStatus(type, msg) {
    status.textContent = msg;
    if (type === "err") { status.style.borderColor = "rgba(255,92,106,.25)"; status.style.background = "var(--danger-soft)"; status.style.color = "#fecaca"; }
    else if (type === "ok") { status.style.borderColor = "rgba(45,212,160,.25)"; status.style.background = "var(--ok-soft)"; status.style.color = "#6ee7b7"; }
    else { status.style.borderColor = "var(--line)"; status.style.background = "rgba(255,255,255,.03)"; status.style.color = "var(--fg-2)"; }
  }
  async function loadCaptcha() {
    captchaId = "";
    document.getElementById("captchaPrompt").textContent = "…";
    document.getElementById("captchaAnswer").value = "";
    var v = BDZ.visitorId();
    var x = await BDZ.edge("web-get-key", { action: "captcha", ip: v, visitor_id: v });
    if (!x || !x.ok) throw Error("CAPTCHA");
    captchaId = x.captcha_id;
    document.getElementById("captchaPrompt").textContent = x.prompt || "?";
  }
  document.getElementById("captchaRefresh").onclick = function () {
    loadCaptcha().catch(function () { setStatus("err", "Không tải captcha."); });
  };
  if (!/^[A-Za-z0-9_-]{20,80}$/.test(token)) {
    setStatus("err", "Token không hợp lệ."); intro.textContent = "Phiên không hợp lệ."; return;
  }
  (async function () {
    try {
      var v = BDZ.visitorId();
      var x = await BDZ.edge("web-get-key", { action: "arrive", token: token, ip: v, visitor_id: v });
      if (!x || !x.ok) throw Error(viErr(x && x.error));
      if (x.phase === "claim") {
        setStatus("ok", "Đã hoàn tất mọi phiên. Đang nhận key…");
        location.replace("../token/?token=" + encodeURIComponent(token)); return;
      }
      progress.classList.remove("hidden");
      document.getElementById("stepDone").textContent = (x.step || 0) + " / " + (x.total_steps || "?");
      document.getElementById("stepLeft").textContent = Math.max(0, (x.total_steps || 0) - (x.step || 0)) + " phiên";
      intro.textContent = "Bạn đã vượt phiên " + (x.step || 0) + ". Giải captcha để sang phiên tiếp theo.";
      captchaBox.classList.remove("hidden");
      continueBtn.classList.remove("hidden");
      setStatus("", "Sẵn sàng tiếp tục.");
      await loadCaptcha();
    } catch (e) {
      setStatus("err", e.message || "Lỗi");
      intro.textContent = "Không xác minh được phiên.";
    }
  })();
  continueBtn.onclick = async function () {
    if (continueBtn.disabled) return;
    var ans = (document.getElementById("captchaAnswer").value || "").trim();
    if (!captchaId || !ans) { setStatus("err", "Nhập kết quả captcha."); return; }
    continueBtn.disabled = true;
    continueBtn.classList.add("loading");
    btnLabel.textContent = "Đang tạo link…";
    try {
      var v = BDZ.visitorId();
      var x = await BDZ.edge("web-get-key", {
        action: "continue", token: token, ip: v, visitor_id: v,
        captcha_id: captchaId, captcha_answer: ans
      });
      if (!x || !x.ok) { await loadCaptcha(); throw Error(viErr(x && x.error)); }
      if (x.phase === "claim" && x.claimUrl) { location.href = x.claimUrl; return; }
      if (x.shortenedUrl) { btnLabel.textContent = "Chuyển tiếp…"; location.href = x.shortenedUrl; return; }
      throw Error("Không nhận được link.");
    } catch (e) {
      continueBtn.disabled = false;
      continueBtn.classList.remove("loading");
      btnLabel.textContent = "Tiếp tục vượt link";
      setStatus("err", e.message || "Lỗi");
    }
  };
})();
</script>
</body>
</html>

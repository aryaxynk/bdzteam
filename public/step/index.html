<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="../security-hardening.js?v=121"></script>
<title>Phiên tiếp theo · BDZMOD</title>
<link rel="icon" type="image/png" href="https://263.org.vn/logo?v=20261003">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=160">
<style>
  .gk-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
  .gk-card{width:min(420px,100%);border:1px solid var(--line);border-radius:18px;background:var(--bg-elevated);box-shadow:0 24px 64px -28px rgba(0,0,0,.65);animation:fade-in .45s var(--ease) both;overflow:hidden}
  .gk-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .gk-brand{display:flex;align-items:center;gap:11px;color:inherit;text-decoration:none}
  .gk-brand img{width:32px;height:32px;border-radius:10px}
  .gk-brand strong{display:block;font-size:14px;font-weight:650;letter-spacing:-.02em}
  .gk-brand small{display:block;font-size:10px;color:var(--fg-muted);letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-top:1px}
  .gk-body{padding:20px 18px}
  .gk-body h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.03em}
  .gk-body .lead{margin:8px 0 0;font-size:13.5px;line-height:1.55;color:var(--fg-secondary)}
  .gk-info{margin-top:16px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .gk-info table{width:100%;border-collapse:collapse;font-size:13px}
  .gk-info th{width:42%;text-align:left;padding:11px 14px;color:var(--fg-muted);font-weight:500;background:rgba(255,255,255,.02);border-bottom:1px solid var(--line)}
  .gk-info td{padding:11px 14px;font-weight:550;border-bottom:1px solid var(--line)}
  .gk-info tr:last-child th,.gk-info tr:last-child td{border-bottom:none}
  .gk-captcha{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:rgba(255,255,255,.015)}
  .gk-captcha label{display:block;font-size:10px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:10px}
  .gk-captcha-row{display:flex;align-items:center;gap:8px}
  .gk-prompt{min-width:7.2rem;padding:0 12px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600}
  .gk-status{margin-top:14px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13px;color:var(--fg-secondary);background:rgba(255,255,255,.02)}
  .gk-status.err{border-color:rgba(248,113,113,.25);background:var(--danger-soft);color:#fecaca}
  .gk-status.ok{border-color:rgba(52,211,153,.25);background:var(--ok-soft);color:#6ee7b7}
  .gk-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--fg-muted)}
  .gk-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.18);animation:pulse-dot 1.8s ease-in-out infinite;display:inline-block;margin-right:6px}
</style>
</head>
<body>
<main class="gk-wrap">
  <div class="gk-card">
    <div class="gk-head">
      <a href="../" class="gk-brand">
        <img src="https://263.org.vn/logo?v=20261003" alt="">
        <span><strong>BDZMOD</strong><small>Xác minh phiên</small></span>
      </a>
    </div>
    <div class="gk-body">
      <h1>Tiếp tục phiên</h1>
      <p id="intro" class="lead">Đang xác minh…</p>

      <div id="progress" class="gk-info hidden">
        <table>
          <tr><th>Đã vượt</th><td id="stepDone">—</td></tr>
          <tr><th>Còn lại</th><td id="stepLeft">—</td></tr>
        </table>
      </div>

      <div id="captchaBox" class="gk-captcha hidden">
        <label>Captcha phiên tiếp</label>
        <div class="gk-captcha-row">
          <span id="captchaPrompt" class="gk-prompt">…</span>
          <input id="captchaAnswer" class="input" type="text" inputmode="numeric" autocomplete="off" placeholder="?">
          <button type="button" id="captchaRefresh" class="btn icon-btn" title="Đổi">↻</button>
        </div>
      </div>

      <button id="continueBtn" type="button" class="btn primary lg hidden" style="margin-top:14px">
        <span id="btnLabel">Tiếp tục vượt link</span>
      </button>

      <div id="status" class="gk-status" role="status">Đang kiểm tra phiên…</div>
    </div>
    <div class="gk-foot">
      <span>Mỗi phiên một captcha</span>
      <span><span class="gk-dot"></span>Online</span>
    </div>
  </div>
</main>
<script src="../config.js?v=111"></script>
<script src="../supabase-api.js?v=111"></script>
<script>
(function () {
  function viErr(err) {
    var m = {
      TOKEN_NOT_FOUND: "Phiên không tồn tại.",
      TOKEN_ALREADY_USED: "Phiên đã dùng.",
      TOKEN_EXPIRED: "Phiên hết hạn. Nhận key lại.",
      TOKEN_CONTEXT_MISMATCH: "Mở link trên cùng thiết bị/IP.",
      CAPTCHA_INVALID: "Captcha sai hoặc hết hạn.",
      TOO_FAST: "Quá nhanh. Chờ vài giây rồi thử lại.",
      STEP_NOT_COMPLETED: "Chưa hoàn tất phiên trước.",
      SHORTENER_UPSTREAM: "Lỗi dịch vụ rút gọn.",
      SHORTENER_NOT_CONFIGURED: "API rút gọn chưa cấu hình."
    };
    return m[err] || err || "Lỗi phiên.";
  }
  var token = (new URLSearchParams(location.search).get("token") || "").trim();
  var captchaId = "";
  var status = document.getElementById("status");
  var intro = document.getElementById("intro");
  var progress = document.getElementById("progress");
  var captchaBox = document.getElementById("captchaBox");
  var continueBtn = document.getElementById("continueBtn");
  var btnLabel = document.getElementById("btnLabel");

  function setStatus(type, msg) {
    status.className = "gk-status" + (type === "err" ? " err" : type === "ok" ? " ok" : "");
    status.textContent = msg;
  }
  async function loadCaptcha() {
    captchaId = "";
    document.getElementById("captchaPrompt").textContent = "…";
    document.getElementById("captchaAnswer").value = "";
    var v = BDZ.visitorId();
    var x = await BDZ.edge("web-get-key", { action: "captcha", ip: v, visitor_id: v });
    if (!x || !x.ok) throw Error("CAPTCHA");
    captchaId = x.captcha_id;
    document.getElementById("captchaPrompt").textContent = x.prompt || "?";
  }
  document.getElementById("captchaRefresh").onclick = function () {
    loadCaptcha().catch(function () { setStatus("err", "Không tải captcha."); });
  };
  if (!/^[A-Za-z0-9_-]{20,80}$/.test(token)) {
    setStatus("err", "Token không hợp lệ.");
    intro.textContent = "Phiên không hợp lệ.";
    return;
  }
  (async function () {
    try {
      var v = BDZ.visitorId();
      var x = await BDZ.edge("web-get-key", { action: "arrive", token: token, ip: v, visitor_id: v });
      if (!x || !x.ok) throw Error(viErr(x && x.error));
      if (x.phase === "claim") {
        setStatus("ok", "Đã hoàn tất mọi phiên. Đang nhận key…");
        intro.textContent = "Chuyển tới trang nhận key.";
        location.replace("../token/?token=" + encodeURIComponent(token));
        return;
      }
      progress.classList.remove("hidden");
      document.getElementById("stepDone").textContent = (x.step || 0) + " / " + (x.total_steps || "?");
      document.getElementById("stepLeft").textContent = Math.max(0, (x.total_steps || 0) - (x.step || 0)) + " phiên";
      intro.textContent = "Bạn đã vượt phiên " + (x.step || 0) + ". Giải captcha để sang phiên tiếp theo.";
      captchaBox.classList.remove("hidden");
      continueBtn.classList.remove("hidden");
      setStatus("", "Sẵn sàng tiếp tục.");
      await loadCaptcha();
    } catch (e) {
      setStatus("err", e.message || "Lỗi");
      intro.textContent = "Không xác minh được phiên.";
    }
  })();
  continueBtn.onclick = async function () {
    if (continueBtn.disabled) return;
    var ans = (document.getElementById("captchaAnswer").value || "").trim();
    if (!captchaId || !ans) { setStatus("err", "Nhập kết quả captcha."); return; }
    continueBtn.disabled = true;
    continueBtn.classList.add("loading");
    btnLabel.textContent = "Đang tạo link…";
    try {
      var v = BDZ.visitorId();
      var x = await BDZ.edge("web-get-key", {
        action: "continue", token: token, ip: v, visitor_id: v,
        captcha_id: captchaId, captcha_answer: ans
      });
      if (!x || !x.ok) { await loadCaptcha(); throw Error(viErr(x && x.error)); }
      if (x.phase === "claim" && x.claimUrl) { location.href = x.claimUrl; return; }
      if (x.shortenedUrl) { btnLabel.textContent = "Chuyển tiếp…"; location.href = x.shortenedUrl; return; }
      throw Error("Không nhận được link.");
    } catch (e) {
      continueBtn.disabled = false;
      continueBtn.classList.remove("loading");
      btnLabel.textContent = "Tiếp tục vượt link";
      setStatus("err", e.message || "Lỗi");
    }
  };
})();
</script>
</body>
</html>

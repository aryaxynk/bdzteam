<!doctype html>

<head>

<meta name="theme-color" content="#f1f3f6"><title>BDZTEAM - Get Key</title>
<link rel="icon" type="image/jpeg" href="https://263.org.vn/logo">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/styles.css?v=public-ui-v23"><link rel="stylesheet" href="/reference-theme.css?v=public-ui-v23"><link rel="stylesheet" href="/admin-ui-fixes.css?v=public-ui-v23"><link rel="stylesheet" href="/basic-ui.css?v=basic-ui-v5"><link rel="stylesheet" href="/reference-demo-v3.css?v=reference-demo-v3"><link rel="stylesheet" href="/responsive-v1.css?v=responsive-v2"><link rel="stylesheet" href="/page-transitions.css?v=fade-v3">
</head><body class="public-contrast"><header class="demo-header"><div class="demo-header-inner"><a class="demo-brand" href="/">BDZTEAM</a><div class="demo-header-tools"><button class="demo-theme" type="button" aria-label="Chuyển sang giao diện tối" title="Chuyển sang giao diện tối"><i class="fa-regular fa-sun"></i></button><a class="demo-login-link" href="/login">Login</a></div></div></header>
<main class="demo-main"><section class="demo-card" aria-label="Get Key"><div class="demo-card-head"><span class="head-user"><i class="fa-regular fa-circle-user"></i></span><span>BDZTEAM</span></div><div id="error" class="demo-error" hidden role="alert"></div><section id="choosePane" class="demo-form"><div class="demo-grid"><div class="demo-field"><div class="demo-control"><span class="demo-icon"><i class="fa-solid fa-gamepad"></i></span><select id="productSelect" aria-label="Chọn app"><option value="">-- Select app --</option></select></div></div><div class="demo-field"><div class="demo-control"><span class="demo-icon"><i class="fa-solid fa-tag"></i></span><input id="slugField" type="text" value="" placeholder="Slug" readonly aria-label="Slug"></div></div><div class="demo-field"><div class="demo-control"><span class="demo-icon"><i class="fa-regular fa-calendar-days"></i></span><input id="durationField" type="text" value="1" readonly aria-label="Duration"></div></div><div class="demo-field"><div class="demo-control"><span class="demo-icon"><i class="fa-regular fa-gem"></i></span><select id="planField" aria-label="Loại key"><option value="FREE">FREE</option></select></div></div></div><div class="demo-generate-row"><button id="startBtn" class="demo-generate" type="button" disabled><i class="fa-solid fa-arrow-right-to-bracket"></i> Generate</button></div><div class="demo-hint" id="todayHint"></div></section><section id="verifyPane" class="demo-success" hidden><div style="font-size:30px;margin-bottom:8px">✅</div><h2>Đã hoàn tất bước vượt link</h2><p>Nhấn nút bên dưới để xác thực token và nhận Key.</p><div class="demo-generate-row" style="justify-content:center;margin-top:18px"><button id="claimBtn" class="demo-generate" type="button"><i class="fa-solid fa-gift"></i> Generate</button></div></section><section id="successPane" class="demo-success" hidden><div style="font-size:30px;margin-bottom:8px">🎉</div><h2>NHẬN KEY THÀNH CÔNG!</h2><p>Key của bạn chỉ hiển thị trong phiên này.</p><div class="demo-keybox"><input id="keyResult" readonly value="" style="width:100%;border:0;outline:0;background:transparent;text-align:center;font:inherit"></div><p id="expires" style="margin-top:9px"></p><div class="demo-generate-row" style="justify-content:center;margin-top:18px"><button id="copyBtn" class="demo-generate" type="button"><i class="fa-regular fa-copy"></i> Sao chép</button></div></section></section></main>
<footer class="demo-footer"><div class="demo-footer-inner"><div class="demo-social" aria-label="Social links"><span title="Telegram"><i class="fa-brands fa-telegram"></i></span><span title="YouTube"><i class="fa-brands fa-youtube"></i></span><span title="TikTok"><i class="fa-brands fa-tiktok"></i></span></div><div class="demo-copy">© Copyright 2026 BDZTEAM</div></div></footer>
<script src="/common.js?v=public-ui-v26"></script><script src="/global-branding.js?v=branding-v1"></script><script src="/page-transitions.js?v=fade-v3"></script><script>let selectedProduct=null;const $=id=>document.getElementById(id);const toMsg=v=>window.BDZToMessage?window.BDZToMessage(v):(typeof v==='string'?v:(v&&typeof v==='object'?(v.error||v.message||v.detail||JSON.stringify(v)):String(v||'')));const showError=m=>{const e=$('error');e.textContent=toMsg(m);e.hidden=!e.textContent};const setPane=id=>['choosePane','verifyPane','successPane'].forEach(x=>$(x).hidden=x!==id);const setReady=v=>{$('startBtn').disabled=!v};async function jsonResponse(r){const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{d={error:text.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()||`Máy chủ trả dữ liệu không hợp lệ (HTTP ${r.status}).`}}return{ok:r.ok,data:d}}async function boot(){const meta=await jsonResponse(await fetch('/api/key-meta',{cache:'no-store'}));if(meta.data.status==='MAINTENANCE')return;if(meta.ok&&meta.data.today_gets!=null)$('todayHint').textContent=`${meta.data.today_gets} Lượt hôm nay`;const res=await jsonResponse(await fetch('/api/products',{cache:'no-store'}));if(!res.ok){if(res.data?.status==='MAINTENANCE')return;throw Error(toMsg(res.data)||'Không thể tải danh sách sản phẩm.')}const products=res.data.products||[],sel=$('productSelect');sel.innerHTML='<option value="">-- Select app --</option>';products.forEach((p,i)=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name||p.slug||`App ${i+1}`;o.dataset.slug=p.slug||'';sel.appendChild(o)});if(products[0]){sel.value=String(products[0].id);selectedProduct=products[0].id;$('slugField').value=products[0].slug||'';setReady(true)}sel.addEventListener('change',()=>{const o=sel.options[sel.selectedIndex];selectedProduct=o.value?Number(o.value):null;$('slugField').value=o.dataset.slug||'';setReady(!!selectedProduct)})}async function start(){showError('');if(!selectedProduct)return showError('Vui lòng chọn app.');const b=$('startBtn');b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Generating...';try{const{ok,data}=await jsonResponse(await fetch('/api/start-get-key',{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({product_id:Number(selectedProduct)})}));if(!ok)throw Error(toMsg(data)||'Không thể bắt đầu.');if(data.status==='MAINTENANCE')throw Error(data.message||'Website đang bảo trì.');if(!data.redirect)throw Error('Không thể tạo đường dẫn.');location.href=data.redirect}catch(e){showError(e);b.disabled=false;b.innerHTML='<i class="fa-solid fa-arrow-right-to-bracket"></i> Generate'}}async function claim(){showError('');const b=$('claimBtn');b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Generating...';const token=new URLSearchParams(location.search).get('token')||'';try{if(!token)throw Error('Token không tồn tại.');const{ok,data}=await jsonResponse(await fetch('/api/claim-key',{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({token})}));if(!ok)throw Error(toMsg(data)||'Không thể nhận Key.');$('keyResult').value=data.key_code||'';$('expires').textContent='Hết hạn: '+(data.expires_at?new Date(data.expires_at).toLocaleString('vi-VN'):'Không xác định');setPane('successPane')}catch(e){showError(e);b.disabled=false;b.innerHTML='<i class="fa-solid fa-gift"></i> Generate'}}$('startBtn').onclick=start;$('claimBtn').onclick=claim;$('copyBtn').onclick=async()=>{const ok=await window.bdzCopy?.($('keyResult').value);if(ok)alert('Đã sao chép Key thành công!')};(async()=>{try{const sp=new URLSearchParams(location.search);if(sp.get('token'))setPane('verifyPane');else await boot()}catch(e){console.error(e);showError(e)}})();</script><script src="/maintenance-popup.js?v=public-ui-v24"></script></body></html>

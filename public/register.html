<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BDZTEAM - Register</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/styles.css?v=auth-ref-v2"><link rel="stylesheet" href="/reference-theme.css?v=auth-ref-v2"><link rel="stylesheet" href="/basic-ui.css?v=auth-ref-v2"><link rel="stylesheet" href="/reference-demo-v2.css?v=auth-ref-v2"><link rel="stylesheet" href="/auth-reference.css?v=auth-ref-v2"><link rel="stylesheet" href="/page-transitions.css?v=fade-v1">
</head>
<body class="auth-page">
<header class="auth-header"><div class="auth-header-inner"><a class="auth-brand" href="/">BDZTEAM</a><a class="auth-header-login" href="/login">Login</a></div></header>
<main class="auth-main"><section class="auth-card"><div class="auth-title">REGISTER</div><form id="registerForm" class="auth-form" novalidate>
<div class="auth-field"><div class="auth-input-wrap"><i class="fa-regular fa-user"></i><input id="username" required autocomplete="username" placeholder="Your username" maxlength="32"></div></div>
<div class="auth-field"><div class="auth-input-wrap"><i class="fa-solid fa-shield-halved"></i><input id="password" type="password" required autocomplete="new-password" placeholder="Your password" maxlength="128"><button type="button" id="togglePassword" class="auth-eye" aria-label="Hiện mật khẩu"><i id="passwordIcon" class="fa-solid fa-eye"></i></button></div></div>
<div class="auth-field"><div class="auth-input-wrap"><i class="fa-solid fa-shield-halved"></i><input id="confirmPassword" type="password" required autocomplete="new-password" placeholder="Confirm password" maxlength="128"></div></div>
<div class="auth-field"><div class="auth-input-wrap"><i class="fa-solid fa-key"></i><input id="referralCode" required autocomplete="off" placeholder="Referral code" maxlength="22" spellcheck="false"></div></div>
<div id="error" class="auth-error hidden" role="alert"></div>
<div class="auth-actions"><a href="/login" class="auth-link">Login here</a><button id="registerBtn" class="auth-primary" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Register</button></div>
</form></section></main>
<footer class="auth-footer"><div class="auth-social"><a href="https://t.me/BDZTEAM_VN" target="_blank" rel="noopener noreferrer" aria-label="Telegram"><i class="fa-brands fa-telegram"></i></a><a href="https://www.youtube.com/@aryamodz" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a><a href="https://tiktok.com/@bdzteammod" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a></div><div class="auth-copy">© Copyright 2018 - 2026 BDZTEAM</div></footer>
<script src="/page-transitions.js?v=fade-v1"></script><script src="/register.js?v=auth-ref-v2"></script>
</body></html>

<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>BDZTEAM - Không tìm thấy trang</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f3ec;color:#111827;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:24px}.card{width:min(680px,100%);background:#fff;border:3px solid #111827;border-radius:18px;box-shadow:8px 8px 0 #111827;padding:32px;text-align:center}.code{font-size:76px;line-height:1;font-weight:1000;background:#ffcc00;border:3px solid #111827;border-radius:16px;padding:10px 18px;display:inline-block;box-shadow:5px 5px 0 #111827}.msg{font-size:20px;font-weight:900;margin:24px 0 10px}.sub{color:#667085;font-size:14px;line-height:1.6}.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}.links a{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border:3px solid #111827;border-radius:10px;background:#fff;color:#111827;text-decoration:none;font-weight:900;box-shadow:3px 3px 0 #111827}.links a.primary{background:#ffcc00}.links a:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #111827}.path{margin-top:18px;font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;color:#667085;word-break:break-all}
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <div class="msg">The page could not be found</div>
    <div class="sub">Đường dẫn này không tồn tại hoặc liên kết cũ đã được thay đổi. Bạn có thể dùng các đường dẫn chính của BDZTEAM bên dưới.</div>
    <div class="links">
      <a class="primary" href="/">Trang chủ</a>
      <a href="/key">Lấy Key</a>
      <a href="/check-key">Check Key</a>
      <a href="/login">Admin Login</a>
    </div>
    <div id="path" class="path"></div>
  </main>
  <script>document.getElementById('path').textContent=location.pathname+location.search;</script>
</body>
</html>

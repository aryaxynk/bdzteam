<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>BDZTEAM - Check Key</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="/styles.css"></head><body class="min-h-screen p-3 md:p-6"><div id="bdzPageLoader"><span class="loader"></span><span class="font-extrabold text-xs tracking-widest bg-[#FFCC00] border-2 border-[#111827] rounded-lg px-3 py-1.5 shadow-[3px_3px_0_#111827]">ĐANG TẢI...</span></div><main class="max-w-2xl mx-auto"><div class="flex justify-between gap-2 mb-4"><a href="/" class="nb-btn bg-white px-3 py-2 text-xs">← Trang chủ</a><a href="/key.html" class="nb-btn nb-btn-yellow px-3 py-2 text-xs">Lấy Key</a></div><section class="text-center mb-5"><img src="https://files.catbox.moe/5tw3y4.jpg" class="bdz-logo-lg mx-auto" alt="BDZTEAM"><h1 class="text-2xl md:text-4xl font-black mt-3">KIỂM TRA KEY</h1><p class="text-xs md:text-sm text-[#6B7280] mt-2">Kiểm tra trực tiếp qua API bảo vệ Cloudflare và dữ liệu Key trong Supabase.</p></section><section class="nb-card nb-card-active p-4 md:p-5"><form id="checkForm" novalidate><label class="text-xs font-bold text-[#6B7280]">KEY CODE</label><input id="keyInput" class="input mt-2 font-mono uppercase" required maxlength="128" placeholder="BDZ-XXXXXXXXXXXX" autocomplete="off" spellcheck="false"><button id="checkBtn" type="submit" class="w-full nb-btn nb-btn-yellow mt-3 py-3">CHECK KEY</button></form><div id="error" class="error-box hidden mt-4" role="alert"></div><div id="result" class="hidden mt-4"></div></section></main><script src="/common.js"></script><script>
(()=>{const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const meta={ACTIVE:['ĐANG HOẠT ĐỘNG','success'],EXPIRED:['ĐÃ HẾT HẠN','warn'],REVOKED:['ĐÃ BỊ KHÓA','error'],PENDING:['CHỜ KÍCH HOẠT','info'],INVALID:['KHÔNG HỢP LỆ','error'],WRONG_PRODUCT:['SAI SẢN PHẨM','warn'],IP_MISMATCH:['SAI THIẾT BỊ / IP','warn'],RATE_LIMIT:['QUÁ NHIỀU YÊU CẦU','warn'],SERVER_ERROR:['MÁY CHỦ TẠM THỜI LỖI','error'],DENIED:['BỊ TỪ CHỐI','error']};const form=document.getElementById('checkForm'),input=document.getElementById('keyInput'),btn=document.getElementById('checkBtn'),errorBox=document.getElementById('error'),result=document.getElementById('result');let busy=false;const showError=m=>{errorBox.textContent=m;errorBox.classList.toggle('hidden',!m)};const readResponse=async r=>{const text=await r.text();let d=null;try{d=text?JSON.parse(text):null}catch{}if(!d||typeof d!=='object')throw Error(`Máy chủ trả về dữ liệu không hợp lệ (HTTP ${r.status}).`);return d};const verify=async k=>{const urls=[`/api/v1/verify?key=${encodeURIComponent(k)}`,`/api/check-key?key=${encodeURIComponent(k)}`];let last='';for(const url of urls){try{const r=await fetch(url,{method:'GET',cache:'no-store',headers:{Accept:'application/json'}});const d=await readResponse(r);if(d?.status)return d;last=d?.message||d?.error||`API không trả về trạng thái (HTTP ${r.status}).`;if(r.status>=500)continue;return d}catch(e){last=e?.message||last}}throw Error(last||'Không thể kết nối API kiểm tra Key.')};form.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;showError('');result.classList.add('hidden');const k=input.value.trim().toUpperCase();if(!k){showError('Vui lòng nhập Key.');input.focus();return}busy=true;btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> ĐANG KIỂM TRA...';try{const d=await verify(k);const status=String(d?.status||d?.code||'SERVER_ERROR').toUpperCase();const [label,kind]=meta[status]||[status,'info'];result.innerHTML='<div class="nb-card p-4"><div class="flex flex-wrap justify-between items-center gap-2"><code class="font-black break-all">'+esc(k)+'</code><span class="status-pill '+kind+'">'+esc(label)+'</span></div><div class="mt-4 grid gap-2 text-sm"><div><b>Sản phẩm:</b> '+esc(d.product||d.product_name||d.slug||'Không xác định')+'</div><div><b>Trạng thái:</b> '+esc(d.message||d.error||status)+'</div><div><b>Thời hạn gốc:</b> '+esc(d.duration_hours??d.hours??0)+' giờ</div><div><b>Hết hạn:</b> '+(d.expires_at?esc(new Date(d.expires_at).toLocaleString('vi-VN')):'Chưa có')+'</div></div></div>';result.classList.remove('hidden');result.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(x){showError(x?.message||'Không thể kiểm tra Key. Vui lòng thử lại.')}finally{busy=false;btn.disabled=false;btn.innerHTML='CHECK KEY'}})})();
</script></body></html>

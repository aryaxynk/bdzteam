<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDZTEAM — Check Key</title><link rel="icon" href="https://files.catbox.moe/5tw3y4.jpg"><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><div class="top"><a class="btn" href="/">← Trang chủ</a><a class="btn yellow" href="/key.html">Lấy Key</a></div><section class="center"><img class="logo" src="https://files.catbox.moe/5tw3y4.jpg" alt="BDZTEAM"><h1>KIỂM TRA KEY</h1><p class="muted">Kiểm tra trạng thái và thời hạn Key bằng Supabase RPC.</p></section><section class="card"><form id="check"><input id="keyInput" class="input" required placeholder="BDZ-XXXXXXXXXXXX" autocomplete="off"><div class="spacer"></div><button class="btn yellow" style="width:100%">Check Key</button></form><div class="spacer"></div><div id="error" class="error hidden"></div><div id="result" class="hidden"></div></section><footer>© 2026 BDZTEAM</footer></main><script>const f=document.querySelector('#check'),e=document.querySelector('#error'),r=document.querySelector('#result');f.addEventListener('submit',async x=>{x.preventDefault();e.classList.add('hidden');r.classList.add('hidden');const k=document.querySelector('#keyInput').value.trim().toUpperCase();try{const q=await fetch('/api/check-key?key='+encodeURIComponent(k));const d=await q.json();if(!q.ok)throw Error(d.error||'Không kiểm tra được Key');const status=d.status||'INVALID';const labels={ACTIVE:'ĐANG HOẠT ĐỘNG',EXPIRED:'ĐÃ HẾT HẠN',REVOKED:'ĐÃ BỊ KHÓA',PENDING:'CHƯA KÍCH HOẠT',INVALID:'KHÔNG HỢP LỆ'};r.innerHTML='<div class="card"><div class="row"><code style="font-weight:900">'+k.replaceAll('<','&lt;')+'</code><span class="status">'+(labels[status]||status)+'</span></div><div class="spacer"></div><p><b>Sản phẩm:</b> '+(d.product||'Không xác định')+'</p><p><b>Thời hạn gốc:</b> '+(d.duration_hours??'—')+' giờ</p><p><b>Hết hạn:</b> '+(d.expires_at?new Date(d.expires_at).toLocaleString('vi-VN'):'Chưa có')+'</p></div>';r.classList.remove('hidden')}catch(a){e.textContent=a.message;e.classList.remove('hidden')}});</script></body></html>

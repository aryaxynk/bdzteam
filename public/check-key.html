<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>BDZTEAM - Check Key</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.googleapis.com" crossorigin><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="/styles.css?v=public-ui-v19"><link rel="stylesheet" href="/reference-theme.css?v=public-ui-v19"><link rel="stylesheet" href="/admin-ui-fixes.css?v=public-ui-v19"></head><body class="min-h-screen p-3 md:p-6 public-contrast"><main class="max-w-2xl mx-auto w-full"><div class="flex flex-wrap justify-between gap-2 mb-4"><a href="/" class="nb-btn bg-white px-3 py-2 text-xs">← Trang chủ</a><a href="/key.html" class="nb-btn nb-btn-yellow px-3 py-2 text-xs">Lấy Key</a></div><section class="text-center mb-5"><img src="https://files.catbox.moe/xpaekr.jpg" class="bdz-logo-lg mx-auto" alt="BDZTEAM"><h1 class="text-2xl md:text-4xl font-black mt-3 break-words">KIỂM TRA KEY</h1><p class="text-xs md:text-sm mt-2 break-words text-[#5f6f84]">Kiểm tra trạng thái Key trực tiếp trên hệ thống.</p></section><section class="nb-card nb-card-active p-4 md:p-5"><form id="checkForm" class="check-key-form" novalidate><label class="text-xs font-bold">KEY CODE</label><input id="keyInput" class="input check-key-input uppercase w-full min-w-0" required maxlength="128" placeholder="BDZ-XXXXXXXXXXXX" autocomplete="off" spellcheck="false"><button id="checkBtn" type="submit" class="w-full nb-btn nb-btn-yellow py-3">CHECK KEY</button></form><div id="error" class="error-box hidden mt-4 break-words" role="alert"></div><div id="result" class="check-result pending mt-4" role="status" aria-live="polite"><div class="text-xs font-black uppercase">KẾT QUẢ KIỂM TRA</div><p class="text-sm mt-1">Nhập Key rồi nhấn <b>CHECK KEY</b>. Kết quả xác thực sẽ hiển thị tại đây.</p></div></section></main><script src="/common.js?v=public-ui-v19"></script><script>const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const msg=v=>window.BDZToMessage?window.BDZToMessage(v):(typeof v==='string'?v:(v&&typeof v==='object'?(v.message||v.error||v.detail||JSON.stringify(v)):String(v??'')));const form=document.getElementById('checkForm'),input=document.getElementById('keyInput'),btn=document.getElementById('checkBtn'),errorBox=document.getElementById('error'),result=document.getElementById('result');let busy=false;const showError=m=>{const s=msg(m);errorBox.textContent=s;errorBox.classList.toggle('hidden',!s)};const verify=async k=>{const r=await fetch('/api/check-key',{method:'POST',cache:'no-store',credentials:'same-origin',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({key:k})});const text=await r.text();let d=null;try{d=text?JSON.parse(text):null}catch{}if(!d||typeof d!=='object')throw Error(`Máy chủ trả dữ liệu không hợp lệ (HTTP ${r.status}).`);if(!r.ok)throw Error(msg(d)||`Yêu cầu thất bại (HTTP ${r.status}).`);return d};form.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;showError('');const k=input.value.trim().toUpperCase();input.value=k;if(!k){showError('Vui lòng nhập Key.');input.focus();return}busy=true;btn.disabled=true;btn.textContent='ĐANG KIỂM TRA...';result.className='check-result pending mt-4';result.innerHTML='<div class="text-xs font-black uppercase">ĐANG KIỂM TRA</div><p class="text-sm mt-1">Đang xác thực Key...</p>';try{const d=await verify(k);const status=String(d?.status||d?.code||'SERVER_ERROR').toUpperCase();const good=['VALID','ACTIVE'].includes(status);result.className=`check-result ${good?'success':'error'} mt-4`;result.innerHTML='<div class="flex flex-wrap justify-between items-center gap-2"><code class="font-black break-all tech-value">'+esc(k)+'</code><span class="status-pill '+(good?'success':status==='MAINTENANCE'?'warn':'error')+'">'+esc(status)+'</span></div><div class="mt-4 grid gap-2 text-sm break-words"><div><b>Sản phẩm:</b> '+esc(d.product||d.product_name||'Không xác định')+'</div><div><b>Trạng thái:</b> '+esc(d.message||status)+'</div><div><b>Thời hạn:</b> '+esc(d.duration_hours??0)+' giờ</div><div><b>Hết hạn:</b> '+esc(d.expires_at?new Date(d.expires_at).toLocaleString('vi-VN'):'Chưa xác định')+'</div></div>'}catch(x){result.className='check-result error mt-4';result.innerHTML='<div class="text-xs font-black uppercase">KHÔNG THỂ XÁC THỰC</div><p class="text-sm mt-1">'+esc(msg(x)||'Vui lòng thử lại sau.')+'</p>';showError(x)}finally{busy=false;btn.disabled=false;btn.textContent='CHECK KEY'}});</script><script src="/maintenance-popup.js?v=public-ui-v19"></script></body></html>

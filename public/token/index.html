<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDZ Get Key</title><link rel="stylesheet" href="../neo.css"></head><body><main class="wrap" style="min-height:100vh;display:grid;place-items:center;padding:24px 0"><section class="neo panel" style="width:min(640px,100%);padding:28px"><div class="brand"><span class="logo">BZ</span> BDZ KEY SYSTEM</div><div class="tag" style="margin-top:24px;background:#8df58d">KEY CLAIM</div><h1 style="font-size:clamp(42px,8vw,72px);line-height:.9;margin:14px 0">NHẬN KEY.</h1><p id="intro" class="muted">Đang xác nhận phiên…</p><div id="status" class="status info">Đang xử lý…</div><div id="out" style="display:none;margin-top:18px"><div class="muted" style="font-size:11px;font-weight:1000">KEY</div><div id="key" class="neo-sm" style="margin-top:7px;padding:18px;background:#ffdf4d;font:1000 22px/1.3 ui-monospace,monospace;word-break:break-all"></div><button id="copy" class="btn primary" style="margin-top:14px">SAO CHÉP KEY</button></div><p style="margin-top:22px;font-size:12px;font-weight:800">Token dùng một lần và phải đúng context tạo session.</p></section></main><script src="../config.js"></script><script src="../supabase-api.js"></script><script>(()=>{const q=new URLSearchParams(location.search),t=(q.get('token')||'').trim(),s=document.getElementById('status'),i=document.getElementById('intro'),o=document.getElementById('out'),k=document.getElementById('key'),c=document.getElementById('copy');const bad=x=>{s.className='status err';s.textContent='✕ '+x;i.textContent='Phiên không thể hoàn tất.'};if(!/^[A-Za-z0-9_-]{20,128}$/.test(t))return bad('Token không hợp lệ.');(async()=>{try{const v=BDZ.visitorId(),d=await BDZ.edge('web-get-key',{action:'claim',token:t,ip:v,visitor_id:v});if(!d?.ok||!d?.key?.key_code)throw Error(d?.error||'Không thể cấp Key.');k.textContent=d.key.key_code;o.style.display='block';s.className='status ok';s.textContent='✓ GET KEY THÀNH CÔNG';i.textContent='Key đã được cấp.';c.onclick=()=>navigator.clipboard?.writeText(d.key.key_code).then(()=>c.textContent='ĐÃ SAO CHÉP ✓').catch(()=>window.prompt('Key:',d.key.key_code))}catch(e){bad(e.message||'Có lỗi xảy ra.')}})()})();</script></body></html>

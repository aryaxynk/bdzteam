<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="../security-hardening.js?v=121"></script>
<title>Nhận Key · BDZMOD</title>
<link rel="icon" type="image/png" href="https://263.org.vn/logo?v=20261003">
<style>
  :root {
    --bg: #07070a;
    --card: #121218;
    --border: #2a2a35;
    --text: #f0eef6;
    --muted: #9a96a8;
    --accent: #00dfd8;
    --ok: #34d399;
    --err: #ff8a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  body {
    display: grid;
    place-items: center;
    padding: 16px;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(121, 40, 202, 0.25), transparent),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0, 223, 216, 0.08), transparent),
      var(--bg);
  }
  .panel {
    width: min(420px, 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--card);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
  }
  .brand img { width: 28px; height: 28px; border-radius: 8px; }
  .brand strong { display: block; font-size: 14px; }
  .brand small {
    display: block;
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .back {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .back:hover { color: var(--text); }
  .panel-body { padding: 22px 18px 18px; }
  .title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 16px;
  }
  .status {
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
    color: var(--muted);
    margin-bottom: 14px;
  }
  .status.ok {
    color: var(--ok);
    border-color: rgba(52, 211, 153, 0.35);
    background: rgba(52, 211, 153, 0.08);
  }
  .status.err {
    color: var(--err);
    border-color: rgba(255, 138, 138, 0.35);
    background: rgba(255, 70, 70, 0.08);
  }
  .key-box {
    display: none;
    margin-bottom: 12px;
  }
  .key-box.show { display: block; }
  .key-box label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .key-code {
    display: block;
    word-break: break-all;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #09090c;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
  }
  .btn {
    width: 100%;
    min-height: 44px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: #041014;
    background: linear-gradient(135deg, var(--accent), #5eead4);
  }
  .btn:hover { opacity: 0.92; }
  .btn.hidden { display: none; }
  .panel-foot {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .live::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2);
  }
</style>
</head>
<body>

<div class="panel" role="main">
  <div class="panel-head">
    <a class="brand" href="../">
      <img src="https://263.org.vn/logo?v=20261003" alt="" width="28" height="28">
      <span><strong>BDZMOD</strong><small>Nhận Key</small></span>
    </a>
    <a class="back" href="../">← Về trang chủ</a>
  </div>

  <div class="panel-body">
    <h1 class="title">Nhận Key</h1>
    <p class="subtitle" id="intro">Đang xác nhận phiên…</p>
    <div id="status" class="status" role="status" aria-live="polite">Đang xác minh token…</div>

    <div id="out" class="key-box">
      <label>KEY CỦA BẠN</label>
      <code id="key" class="key-code"></code>
    </div>
    <button id="copy" class="btn hidden" type="button">Sao chép Key</button>
  </div>

  <div class="panel-foot">
    <span>Token dùng 1 lần</span>
    <span class="live">Online</span>
  </div>
</div>

<script src="../config.js?v=111"></script>
<script src="../supabase-api.js?v=111"></script>
<script>
(function () {
  function viErr(err) {
    var m = {
      TOKEN_NOT_FOUND: "Token không tồn tại hoặc không hợp lệ.",
      TOKEN_ALREADY_USED: "Token đã được sử dụng.",
      TOKEN_EXPIRED: "Token đã hết hạn. Vui lòng nhận key lại.",
      TOKEN_CONTEXT_MISMATCH: "Phiên không khớp. Mở link trên cùng thiết bị.",
      TOKEN_INVALID: "Token không hợp lệ.",
      LIBRARY_TOKEN_INVALID: "Không xác thực được phiên. Tải lại trang.",
      CRYPTO_UNAVAILABLE: "Trình duyệt chưa hỗ trợ. Hãy cập nhật trình duyệt.",
      LIBRARY_TOKEN_STORAGE_UNAVAILABLE: "Bật bộ nhớ trình duyệt rồi thử lại.",
      CLAIM_UNAVAILABLE: "Không thể cấp key. Thử lại sau.",
      MAINTENANCE: "Hệ thống đang bảo trì.",
      BANNED: "Bạn đã bị khóa tạm thời.",
      SERVER_ERROR: "Lỗi máy chủ. Thử lại sau."
    };
    if (!err) return "Không thể cấp key.";
    if (m[err]) return m[err];
    if (/[àáạảãâăèéêìíòóôơùúýăđ]/i.test(err)) return err;
    return "Không thể cấp key. Thử lại sau.";
  }

  var t = (new URLSearchParams(location.search).get("token") || "").trim();
  var s = document.getElementById("status");
  var i = document.getElementById("intro");
  var o = document.getElementById("out");
  var k = document.getElementById("key");
  var c = document.getElementById("copy");

  function bad(msg) {
    s.className = "status err";
    s.textContent = msg;
    i.textContent = "Phiên không thể hoàn tất.";
  }

  if (!/^[A-Za-z0-9_-]{20,128}$/.test(t)) {
    bad("Token không hợp lệ.");
    return;
  }

  function libraryToken() {
    var storageKey = "bdz_library_token";
    var value = "";
    try { value = (localStorage.getItem(storageKey) || "").trim().toLowerCase(); } catch (_) {}
    if (/^[a-f0-9]{64}$/.test(value)) return value;
    if (!window.crypto || typeof window.crypto.getRandomValues !== "function") {
      throw Error("CRYPTO_UNAVAILABLE");
    }
    var bytes = new Uint8Array(32);
    window.crypto.getRandomValues(bytes);
    value = Array.from(bytes, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    try { localStorage.setItem(storageKey, value); }
    catch (_) { throw Error("LIBRARY_TOKEN_STORAGE_UNAVAILABLE"); }
    return value;
  }

  (async function () {
    try {
      var v = BDZ.visitorId();
      var library = libraryToken();
      var d = await BDZ.edge("web-get-key", {
        action: "claim",
        token: t,
        ip: v,
        visitor_id: v,
        library_token: library
      });
      if (!d || !d.ok || !d.key || !d.key.key_code) throw Error(viErr(d && d.error));
      k.textContent = d.key.key_code;
      o.classList.add("show");
      c.classList.remove("hidden");
      s.className = "status ok";
      s.textContent = "Nhận Key thành công";
      i.textContent = "Key đã được cấp. Hãy sao chép và giữ riêng tư.";
      c.onclick = function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(d.key.key_code).then(function () {
            c.textContent = "Đã sao chép";
          }).catch(function () {
            window.prompt("Key:", d.key.key_code);
          });
        } else {
          window.prompt("Key:", d.key.key_code);
        }
      };
    } catch (e) {
      bad(viErr(e.message || "SERVER_ERROR"));
    }
  })();
})();
</script>
</body>
</html>

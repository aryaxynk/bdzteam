<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BDZ Get Key</title><style>:root{color-scheme:dark;--bg:#08090c;--line:#272d38;--text:#f5f7fb;--muted:#9aa4b2;--ok:#4ade80;--err:#fb7185}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1a1c30,transparent 38%),var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:#11141a;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 24px 90px #0000006b}.brand{font-weight:900;letter-spacing:.05em}.sub{color:var(--muted);line-height:1.6}.key{margin:22px 0;padding:18px;border:1px dashed #3a4250;border-radius:16px;background:#0b0e13;font:800 22px ui-monospace,monospace;word-break:break-all;user-select:all}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:12px 15px;border-radius:12px;border:1px solid var(--line);background:#171b23;color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}.btn.primary{background:#6b52e8;border-color:transparent}.status{margin-top:18px;font-weight:800}.ok{color:var(--ok)}.err{color:var(--err)}.note{margin-top:18px;color:var(--muted);font-size:13px;line-height:1.55}.hidden{display:none}</style></head><body><main class="card"><div class="brand">BDZ KEY SYSTEM</div><h1>Nhận Key</h1><p id="intro" class="sub">Đang xác nhận phiên…</p><div id="status" class="status">Đang xử lý…</div><div id="key" class="key hidden"></div><div id="actions" class="actions hidden"><button id="copy" class="btn primary">Sao chép Key</button><a id="home" class="btn" href="../">Lấy Key khác</a></div><div class="note">Mỗi phiên chỉ cấp một Key. Token không được lưu dạng plaintext trong database.</div></main><script src="../config.js"></script><script src="../supabase-api.js"></script><script>const t=(new URLSearchParams(location.search).get('token')||'').trim(),s=document.getElementById('status'),i=document.getElementById('intro'),k=document.getElementById('key'),a=document.getElementById('actions'),c=document.getElementById('copy');const fail=m=>{s.className='status err';s.textContent='✕ '+m;i.textContent='Phiên không thể hoàn tất.'};(async()=>{if(!/^[A-Za-z0-9_-]{20,128}$/.test(t))return fail('Token không hợp lệ.');try{const d=await BDZ.rpc('bdz_web_claim',{p_token:t});if(!d?.ok||!d?.key?.key_code)throw Error(d?.error==='TOKEN_ALREADY_USED'?'Phiên này đã được sử dụng.':d?.error==='TOKEN_EXPIRED'?'Phiên này đã hết hạn.':d?.error||'Không thể cấp Key.');const v=d.key.key_code;s.className='status ok';s.textContent='✓ GET KEY thành công';i.textContent='Key của bạn đã được cấp.';k.textContent=v;k.classList.remove('hidden');a.classList.remove('hidden');c.onclick=async()=>{try{await navigator.clipboard.writeText(v);c.textContent='Đã sao chép ✓';setTimeout(()=>c.textContent='Sao chép Key',1600)}catch{window.prompt('Sao chép Key:',v)}}}catch(e){fail(e?.message||'Có lỗi xảy ra.')}})();</script></body></html>

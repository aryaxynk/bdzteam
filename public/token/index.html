<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Nhận Key</title>
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="https://263.org.vn/logo">
</head>
<body>
<script>document.documentElement.dataset.theme=localStorage.getItem('bdz_theme')||'light';</script>
<div class="topbar">
  <img class="logo-img" src="https://263.org.vn/logo" alt="" referrerpolicy="no-referrer">
  <span class="brand">Nhận Key</span>
  <span class="grow"></span>
  <button type="button" class="btn sm" id="themeBtn" title="Sáng/Tối">◐</button>
</div>
<main class="wrap" style="padding-top:32px;padding-bottom:48px;max-width:420px">
  <div class="card">
    <div style="text-align:center;margin-bottom:16px">
      <img src="https://263.org.vn/logo" alt="" width="56" height="56" style="border-radius:12px;object-fit:cover" referrerpolicy="no-referrer">
      <h2 style="margin:12px 0 4px">Nhận Key</h2>
      <p class="hint" id="intro" style="margin:0">Đang xác nhận phiên…</p>
    </div>
    <div id="status" class="okbox" style="margin-bottom:12px">Đang xử lý…</div>
    <div id="out" class="hidden">
      <div class="field" style="margin-bottom:10px">
        <label>KEY</label>
        <div id="key" class="mono" style="padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:15px;word-break:break-all;font-weight:600"></div>
      </div>
      <button id="copy" class="btn primary" style="width:100%">Sao chép key</button>
    </div>
    <p class="hint" style="margin-top:14px;margin-bottom:0;text-align:center;font-size:12px">Token dùng một lần · đúng phiên tạo session</p>
  </div>
</main>
<script src="../config.js"></script>
<script src="../supabase-api.js"></script>
<script>
(function(){
  document.getElementById('themeBtn').onclick=function(){
    var n=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=n;
    localStorage.setItem('bdz_theme',n);
  };
  var q=new URLSearchParams(location.search);
  var t=(q.get('token')||'').trim();
  var s=document.getElementById('status');
  var i=document.getElementById('intro');
  var o=document.getElementById('out');
  var k=document.getElementById('key');
  var c=document.getElementById('copy');
  function bad(x){
    s.className='err';
    s.textContent=x;
    i.textContent='Phiên không thể hoàn tất.';
  }
  if(!/^[A-Za-z0-9_-]{20,128}$/.test(t)){
    bad('Token không hợp lệ.');
    return;
  }
  (async function(){
    try{
      var v=BDZ.visitorId();
      var d=await BDZ.edge('web-get-key',{action:'claim',token:t,ip:v,visitor_id:v});
      if(!d||!d.ok||!d.key||!d.key.key_code) throw Error((d&&d.error)||'Không thể cấp Key.');
      k.textContent=d.key.key_code;
      o.classList.remove('hidden');
      s.className='okbox';
      s.textContent='Get key thành công';
      i.textContent='Key đã được cấp.';
      c.onclick=function(){
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(d.key.key_code).then(function(){
            c.textContent='Đã sao chép';
          }).catch(function(){
            window.prompt('Key:', d.key.key_code);
          });
        } else {
          window.prompt('Key:', d.key.key_code);
        }
      };
    }catch(e){
      bad(e.message||'Có lỗi xảy ra.');
    }
  })();
})();
</script>
</body>
</html>

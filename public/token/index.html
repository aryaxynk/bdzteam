<!doctype html>
<html lang="vi" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="../security-hardening.js?v=121"></script>
<title>Nhận Key · BDZMOD</title>
<link rel="icon" type="image/png" href="https://263.org.vn/logo?v=20261003">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        border: 'hsl(240 4% 16%)',
        background: 'hsl(240 6% 4%)',
        foreground: 'hsl(0 0% 98%)',
        card: 'hsl(240 5% 8%)',
        muted: 'hsl(240 4% 16%)',
        'muted-foreground': 'hsl(240 5% 64%)',
        primary: 'hsl(0 0% 98%)',
        'primary-foreground': 'hsl(240 6% 6%)',
      },
      borderRadius: { lg: '0.5rem', md: '0.375rem', sm: '0.25rem' }
    }
  }
}
</script>
</head>
<body class="min-h-screen overflow-hidden bg-background text-foreground antialiased">
<div class="pointer-events-none fixed inset-0 bg-[radial-gradient(ellipse_80%_50%_at_50%_-20%,hsla(270,60%,40%,0.12),transparent),radial-gradient(ellipse_50%_40%_at_90%_100%,hsla(173,60%,40%,0.06),transparent)]"></div>

<main class="relative z-10 flex min-h-screen items-center justify-center p-4">
  <div class="w-full max-w-md rounded-lg border border-border bg-card/60 backdrop-blur-sm">
    <div class="flex items-center justify-between gap-3 border-b border-border px-5 py-4">
      <a href="../" class="flex items-center gap-2.5 no-underline">
        <img src="https://263.org.vn/logo?v=20261003" alt="" width="28" height="28" class="h-7 w-7 rounded-md">
        <span class="leading-tight">
          <span class="block text-sm font-semibold tracking-tight text-foreground">BDZMOD</span>
          <span class="block text-[10px] font-medium uppercase tracking-widest text-muted-foreground">Nhận Key</span>
        </span>
      </a>
      <a href="../" class="inline-flex h-8 items-center rounded-md border border-border bg-transparent px-3 text-xs font-medium text-muted-foreground transition-colors hover:bg-muted/40 hover:text-foreground no-underline">← Trang chủ</a>
    </div>

    <div class="px-5 py-5">
      <h1 class="text-xl font-semibold tracking-tight text-foreground">Nhận Key</h1>
      <p id="intro" class="mt-1.5 text-sm text-muted-foreground leading-relaxed">Đang xác nhận phiên…</p>

      <div id="status" role="status" aria-live="polite" class="mt-4 rounded-md border border-border bg-muted/30 px-3.5 py-2.5 text-sm text-muted-foreground leading-relaxed">
        Đang xác minh token…
      </div>

      <div id="out" class="mt-4 hidden">
        <label class="mb-2 block text-[10px] font-semibold uppercase tracking-widest text-muted-foreground">Key của bạn</label>
        <code id="key" class="block break-all rounded-md border border-border bg-background/80 px-3.5 py-3 font-mono text-sm leading-relaxed text-foreground"></code>
      </div>

      <button id="copy" type="button" class="mt-4 hidden inline-flex h-10 w-full items-center justify-center rounded-md border border-transparent bg-primary px-4 text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/90">
        Sao chép Key
      </button>
    </div>

    <div class="flex items-center justify-between border-t border-border px-5 py-3 text-[11px] text-muted-foreground">
      <span>Token dùng 1 lần</span>
      <span class="inline-flex items-center gap-1.5">
        <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
        Online
      </span>
    </div>
  </div>
</main>

<script src="../config.js?v=111"></script>
<script src="../supabase-api.js?v=111"></script>
<script>
(function () {
  function viErr(err) {
    var m = {
      TOKEN_NOT_FOUND: "Token không tồn tại hoặc không hợp lệ.",
      TOKEN_ALREADY_USED: "Token đã được sử dụng.",
      TOKEN_EXPIRED: "Token đã hết hạn. Vui lòng nhận key lại.",
      TOKEN_CONTEXT_MISMATCH: "Phiên không khớp. Mở link trên cùng thiết bị.",
      TOKEN_INVALID: "Token không hợp lệ.",
      LIBRARY_TOKEN_INVALID: "Không xác thực được phiên. Tải lại trang.",
      CRYPTO_UNAVAILABLE: "Trình duyệt chưa hỗ trợ. Hãy cập nhật trình duyệt.",
      LIBRARY_TOKEN_STORAGE_UNAVAILABLE: "Bật bộ nhớ trình duyệt rồi thử lại.",
      CLAIM_UNAVAILABLE: "Không thể cấp key. Thử lại sau.",
      MAINTENANCE: "Hệ thống đang bảo trì.",
      BANNED: "Bạn đã bị khóa tạm thời.",
      SERVER_ERROR: "Lỗi máy chủ. Thử lại sau."
    };
    if (!err) return "Không thể cấp key.";
    if (m[err]) return m[err];
    if (/[àáạảãâăèéêìíòóôơùúýăđ]/i.test(err)) return err;
    return "Không thể cấp key. Thử lại sau.";
  }

  var t = (new URLSearchParams(location.search).get("token") || "").trim();
  var s = document.getElementById("status");
  var i = document.getElementById("intro");
  var o = document.getElementById("out");
  var k = document.getElementById("key");
  var c = document.getElementById("copy");

  function bad(msg) {
    s.className = "mt-4 rounded-md border border-red-500/30 bg-red-500/10 px-3.5 py-2.5 text-sm text-red-400 leading-relaxed";
    s.textContent = msg;
    i.textContent = "Phiên không thể hoàn tất.";
  }

  if (!/^[A-Za-z0-9_-]{20,128}$/.test(t)) {
    bad("Token không hợp lệ.");
    return;
  }

  function libraryToken() {
    var storageKey = "bdz_library_token";
    var value = "";
    try { value = (localStorage.getItem(storageKey) || "").trim().toLowerCase(); } catch (_) {}
    if (/^[a-f0-9]{64}$/.test(value)) return value;
    if (!window.crypto || typeof window.crypto.getRandomValues !== "function") {
      throw Error("CRYPTO_UNAVAILABLE");
    }
    var bytes = new Uint8Array(32);
    window.crypto.getRandomValues(bytes);
    value = Array.from(bytes, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    try { localStorage.setItem(storageKey, value); }
    catch (_) { throw Error("LIBRARY_TOKEN_STORAGE_UNAVAILABLE"); }
    return value;
  }

  (async function () {
    try {
      var v = BDZ.visitorId();
      var library = libraryToken();
      var d = await BDZ.edge("web-get-key", {
        action: "claim",
        token: t,
        ip: v,
        visitor_id: v,
        library_token: library
      });
      if (!d || !d.ok || !d.key || !d.key.key_code) throw Error(viErr(d && d.error));
      k.textContent = d.key.key_code;
      o.classList.remove("hidden");
      c.classList.remove("hidden");
      s.className = "mt-4 rounded-md border border-emerald-500/30 bg-emerald-500/10 px-3.5 py-2.5 text-sm text-emerald-400 leading-relaxed";
      s.textContent = "Nhận Key thành công";
      i.textContent = "Key đã được cấp. Hãy sao chép và giữ riêng tư.";
      c.onclick = function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(d.key.key_code).then(function () {
            c.textContent = "Đã sao chép";
          }).catch(function () {
            window.prompt("Key:", d.key.key_code);
          });
        } else {
          window.prompt("Key:", d.key.key_code);
        }
      };
    } catch (e) {
      bad(viErr(e.message || "SERVER_ERROR"));
    }
  })();
})();
</script>
</body>
</html>

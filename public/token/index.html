<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="../security-hardening.js?v=121"></script>
<title>Nhận Key · BDZMOD</title>
<link rel="icon" type="image/png" href="https://263.org.vn/logo?v=20261003">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=250">
</head>
<body>
<main class="gk-page">
  <div class="gk-card">
    <div class="gk-head">
      <a href="../" class="gk-brand">
        <img src="https://263.org.vn/logo?v=20261003" alt="">
        <span><strong>BDZMOD</strong><small>Key Service</small></span>
      </a>
      <a href="../" class="btn sm">← Trang chủ</a>
    </div>
    <h1>Nhận Key</h1>
    <p id="intro" class="sub">Đang xác nhận phiên…</p>
    <div id="status" class="err" style="display:flex;align-items:center;gap:10px" role="status">
      <span class="loader-ring" id="statusSpin"></span>
      <span id="statusText">Đang xác minh token…</span>
    </div>
    <div id="out" class="hidden" style="margin-top:16px">
      <label style="display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);font-weight:800;margin-bottom:8px">Key của bạn</label>
      <code id="key" class="mono code" style="display:block;word-break:break-all"></code>
      <button id="copy" type="button" class="btn primary lg" style="margin-top:14px">Sao chép Key</button>
    </div>
  </div>
</main>
<script src="../config.js?v=111"></script>
<script src="../supabase-api.js?v=111"></script>
<script>
(function () {
  function viErr(err) {
    var m = {TOKEN_NOT_FOUND:"Token không tồn tại hoặc không hợp lệ.",TOKEN_ALREADY_USED:"Token đã được sử dụng.",TOKEN_EXPIRED:"Token đã hết hạn. Vui lòng nhận key lại.",TOKEN_CONTEXT_MISMATCH:"Phiên không khớp. Mở link trên cùng thiết bị.",TOKEN_INVALID:"Token không hợp lệ.",STEPS_INCOMPLETE:"Chưa hoàn tất đủ phiên vượt link.",LIBRARY_TOKEN_INVALID:"Không xác thực được phiên. Tải lại trang.",CRYPTO_UNAVAILABLE:"Trình duyệt chưa hỗ trợ.",LIBRARY_TOKEN_STORAGE_UNAVAILABLE:"Bật bộ nhớ trình duyệt rồi thử lại.",CLAIM_UNAVAILABLE:"Không thể cấp key. Thử lại sau.",MAINTENANCE:"Hệ thống đang bảo trì.",BANNED:"Bạn đã bị khóa tạm thời.",SERVER_ERROR:"Lỗi máy chủ. Thử lại sau."};
    if (!err) return "Không thể cấp key.";
    if (m[err]) return m[err];
    if (/[àáạảãâăèéêìíòóôơùúýăđ]/i.test(err)) return err;
    return "Không thể cấp key. Thử lại sau.";
  }
  var t = (new URLSearchParams(location.search).get("token") || "").trim();
  var s = document.getElementById("status");
  var statusText = document.getElementById("statusText");
  var statusSpin = document.getElementById("statusSpin");
  var i = document.getElementById("intro");
  var o = document.getElementById("out");
  var k = document.getElementById("key");
  var c = document.getElementById("copy");
  function setStatus(type, msg) {
    statusSpin.style.display = type ? "none" : "inline-block";
    statusText.textContent = msg;
    if (type === "err") { s.style.borderColor = "var(--line)"; s.style.background = "var(--danger-soft)"; s.style.color = "var(--fg)"; }
    else if (type === "ok") { s.style.borderColor = "var(--line)"; s.style.background = "var(--ok-soft)"; s.style.color = "var(--ok)"; }
  }
  function bad(msg) { setStatus("err", msg); i.textContent = "Phiên không thể hoàn tất."; }
  if (!/^[A-Za-z0-9_-]{20,128}$/.test(t)) { bad("Token không hợp lệ."); return; }
  function libraryToken() {
    var storageKey = "bdz_library_token", value = "";
    try { value = (localStorage.getItem(storageKey) || "").trim().toLowerCase(); } catch (_) {}
    if (/^[a-f0-9]{64}$/.test(value)) return value;
    if (!window.crypto || typeof window.crypto.getRandomValues !== "function") throw Error("CRYPTO_UNAVAILABLE");
    var bytes = new Uint8Array(32);
    window.crypto.getRandomValues(bytes);
    value = Array.from(bytes, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    try { localStorage.setItem(storageKey, value); } catch (_) { throw Error("LIBRARY_TOKEN_STORAGE_UNAVAILABLE"); }
    return value;
  }
  (async function () {
    try {
      var v = BDZ.visitorId();
      var arr = await BDZ.edge("web-get-key", { action: "arrive", token: t, ip: v, visitor_id: v });
      if (arr && arr.ok && arr.phase === "continue") {
        location.replace("../step/?token=" + encodeURIComponent(t)); return;
      }
      if (arr && !arr.ok && arr.error && arr.error !== "TOKEN_ALREADY_USED" && arr.error !== "TOKEN_NOT_FOUND") {
        throw Error(viErr(arr.error));
      }
      var library = libraryToken();
      var d = await BDZ.edge("web-get-key", { action: "claim", token: t, ip: v, visitor_id: v, library_token: library });
      if (!d || !d.ok || !d.key || !d.key.key_code) throw Error(viErr(d && d.error));
      k.textContent = d.key.key_code;
      o.classList.remove("hidden");
      setStatus("ok", "Nhận Key thành công");
      i.textContent = "Key đã được cấp. Hãy sao chép và giữ riêng tư.";
      c.onclick = function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(d.key.key_code).then(function () { c.textContent = "Đã sao chép"; })
            .catch(function () { window.prompt("Key:", d.key.key_code); });
        } else window.prompt("Key:", d.key.key_code);
      };
    } catch (e) { bad(viErr(e.message || "SERVER_ERROR")); }
  })();
})();
</script>
</body>
</html>

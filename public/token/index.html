<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Nhận Key</title>
<link rel="stylesheet" href="../style.css?v=8">
<link rel="icon" href="https://263.org.vn/logo">
</head>
<body>
<script>document.documentElement.dataset.theme=localStorage.getItem('bdz_theme')||'light';</script>
<main class="login-page">
  <div class="login-box">
    <div class="logo-wrap">
      <img src="https://263.org.vn/logo" alt="" referrerpolicy="no-referrer">
    </div>
    <h1>Nhận Key</h1>
    <p class="sub" id="intro">Đang xác nhận phiên…</p>
    <div id="status" class="okbox" style="margin-bottom:12px">Đang xử lý…</div>
    <div id="out" class="hidden">
      <div class="field" style="margin-bottom:10px">
        <label>KEY</label>
        <div id="key" class="mono" style="padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:15px;word-break:break-all;font-weight:600"></div>
      </div>
      <button id="copy" class="btn primary" style="width:100%">Sao chép key</button>
    </div>
    <p class="hint" style="margin-top:14px;margin-bottom:0;text-align:center;font-size:12px">Token dùng một lần</p>
  </div>
</main>
<script src="../config.js?v=8"></script>
<script src="../supabase-api.js?v=8"></script>
<script>
(function(){
  function viErr(err){
    var m={
      TOKEN_NOT_FOUND:'Token không tồn tại hoặc không hợp lệ.',
      TOKEN_ALREADY_USED:'Token đã được sử dụng.',
      TOKEN_EXPIRED:'Token đã hết hạn. Vui lòng nhận key lại.',
      TOKEN_CONTEXT_MISMATCH:'Phiên không khớp. Hãy mở link trên cùng thiết bị.',
      TOKEN_INVALID:'Token không hợp lệ.',
      CLAIM_UNAVAILABLE:'Không thể cấp key. Thử lại sau.',
      MAINTENANCE:'Hệ thống đang bảo trì. Vui lòng thử lại sau.',
      BANNED:'Bạn đã bị khóa tạm thời. Vui lòng thử lại sau.',
      SERVER_ERROR:'Lỗi máy chủ. Thử lại sau.'
    };
    if(!err) return 'Không thể cấp key.';
    if(m[err]) return m[err];
    if(/[àáạảãâăèéêìíòóôơùúýăđ]/i.test(err)) return err;
    return 'Không thể cấp key. Thử lại sau.';
  }
  var q=new URLSearchParams(location.search);
  var t=(q.get('token')||'').trim();
  var s=document.getElementById('status');
  var i=document.getElementById('intro');
  var o=document.getElementById('out');
  var k=document.getElementById('key');
  var c=document.getElementById('copy');
  function bad(x){
    s.className='err';
    s.textContent=x;
    i.textContent='Phiên không thể hoàn tất.';
  }
  if(!/^[A-Za-z0-9_-]{20,128}$/.test(t)){
    bad('Token không hợp lệ.');
    return;
  }
  (async function(){
    try{
      var v=BDZ.visitorId();
      var d=await BDZ.edge('web-get-key',{action:'claim',token:t,ip:v,visitor_id:v});
      if(!d||!d.ok||!d.key||!d.key.key_code) throw Error(viErr(d&&d.error));
      k.textContent=d.key.key_code;
      o.classList.remove('hidden');
      s.className='okbox';
      s.textContent='Nhận key thành công';
      i.textContent='Key đã được cấp.';
      c.onclick=function(){
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(d.key.key_code).then(function(){ c.textContent='Đã sao chép'; })
            .catch(function(){ window.prompt('Key:', d.key.key_code); });
        } else window.prompt('Key:', d.key.key_code);
      };
    }catch(e){
      bad(e.message||'Có lỗi xảy ra.');
    }
  })();
})();
</script>
</body>
</html>

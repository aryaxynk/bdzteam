<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BDZ Control Center</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d14}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="admin" src="/admin.html?embedded=1" title="BDZ Control Center"></iframe><script>(function(){const f=document.getElementById('admin');function patch(){try{const w=f.contentWindow,d=w.document;if(!w.renderUsers||w.__unblockPatched)return;const original=w.renderUsers.bind(w);w.__unblockPatched=true;w.renderUsers=function(){original();const blocked=new Set((w.D?.blocked_users||[]).map(x=>String(x.telegram_user_id)));const rows=d.querySelectorAll('#userRows tr');rows.forEach(tr=>{const id=String(tr.cells?.[0]?.textContent||'').trim();if(!id||!tr.cells?.length||id==='Telegram ID')return;const action=tr.cells[tr.cells.length-1];const isBlocked=blocked.has(id);if(isBlocked){action.innerHTML='<button class="btn sm" data-unblock="'+id+'">Unblock</button>';}else{const b=action.querySelector('button');if(b&&!/block/i.test(b.textContent))return;}action.querySelector('[data-unblock]')?.addEventListener('click',async()=>{try{await w.call({action:'unblock_user',telegram_user_id:Number(id)});await w.refresh();w.toast('Đã unblock')}catch(e){w.toast(e.message||'Unblock failed',false)}});});};w.renderUsers();}catch(e){}}f.addEventListener('load',()=>{patch();setInterval(patch,1000)});})();</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BDZ Control Center</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d14}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="admin" src="/admin.html?embedded=1" title="BDZ Control Center"></iframe><script>(function(){const f=document.getElementById('admin');function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}function patch(){try{const w=f.contentWindow,d=w.document;if(!w.renderUsers||w.__bdzPatched)return;const keyApi=async body=>{const r=await fetch('/api/admin-key',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'REQUEST_FAILED');return x};const u0=w.renderUsers.bind(w);w.renderUsers=function(){u0();const blocked=new Set((w.D?.blocked_users||[]).map(x=>String(x.telegram_user_id)));d.querySelectorAll('#userRows tr').forEach(tr=>{const id=String(tr.cells?.[0]?.textContent||'').trim();if(!id||!tr.cells?.length)return;const a=tr.cells[tr.cells.length-1],b=blocked.has(id);a.innerHTML=b?'<span class="tag bad">BLOCKED</span> <button class="btn sm" data-unblock="'+id+'">Unblock</button>':'<span class="tag ok">ALLOWED</span> <button class="btn sm danger" data-block="'+id+'">Block</button>';a.querySelector('[data-unblock]')?.addEventListener('click',async()=>{try{await w.call({action:'unblock_user',telegram_user_id:Number(id)});await w.refresh();w.toast('Đã unblock')}catch(e){w.toast(e.message||'Unblock failed',false)}});a.querySelector('[data-block]')?.addEventListener('click',async()=>{try{await w.call({action:'block_user',telegram_user_id:Number(id)});await w.refresh();w.toast('Đã block')}catch(e){w.toast(e.message||'Block failed',false)}});});};w.openKey=function(existing){if(existing)return openEditor(existing);const box=d.getElementById('box'),modal=d.getElementById('modal');if(!box||!modal)return;modal.classList.add('show');box.innerHTML='<div class="head"><div><h3>Tạo key Admin</h3><p>Key custom · Admin có thể chọn giới hạn.</p></div><button class="icon" id="kx">×</button></div><div class="fields"><div class="field"><label>KEY TÙY CHỈNH</label><input id="ck" class="input" maxlength="20" placeholder="Để trống = tự tạo"></div><div class="field"><label>THỜI HẠN (GIỜ)</label><input id="ch" class="input" type="number" min="1" max="8760" value="24"></div><div class="field"><label>MAX DEVICES</label><input id="cd" class="input" type="number" min="1" max="100" value="1"></div><div class="field"><label>MAX CHECKS (0 = ∞)</label><input id="cc" class="input" type="number" min="0" value="100"></div><div class="field"><label>TELEGRAM ID</label><input id="ct" class="input" inputmode="numeric"></div><div class="field"><label>USERNAME</label><input id="cu" class="input"></div></div><button class="btn primary" id="cs">Tạo key</button>';d.getElementById('kx').onclick=()=>modal.classList.remove('show');d.getElementById('cs').onclick=async()=>{try{const r=await keyApi({action:'create',key_code:d.getElementById('ck').value.trim(),key_length:16,duration_hours:Number(d.getElementById('ch').value),max_devices:Number(d.getElementById('cd').value),max_checks:Number(d.getElementById('cc').value),telegram_user_id:d.getElementById('ct').value.trim()||null,telegram_username:d.getElementById('cu').value.trim()||null});modal.classList.remove('show');await w.refresh();alert('KEY: '+r.key.key_code);w.toast('Đã tạo key')}catch(e){w.toast(e.message||'Create failed',false)}}};const k0=w.renderKeys.bind(w);w.renderKeys=function(){k0();d.querySelectorAll('#keyRows tr').forEach(tr=>{const code=tr.cells?.[0]?.textContent?.trim();if(!code||!w.D)return;const k=(w.D.keys||[]).find(x=>x.key_code===code);if(!k||!tr.cells?.length)return;const a=tr.cells[tr.cells.length-1];a.innerHTML='<div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn sm" data-edit="1">Edit</button><button class="btn sm" data-toggle="1">'+(k.status==='ACTIVE'||k.status==='REACTIVATED'?'Disable':'Enable')+'</button><button class="btn sm" data-reset="1">Reset</button><button class="btn sm danger" data-delete="1">Delete</button></div>';a.querySelector('[data-edit]').onclick=()=>openEditor(k);a.querySelector('[data-toggle]').onclick=async()=>{try{await keyApi({action:'set_status',id:k.id,status:(k.status==='ACTIVE'||k.status==='REACTIVATED')?'DISABLED':'ACTIVE'});await w.refresh();w.toast((k.status==='ACTIVE'||k.status==='REACTIVATED')?'Đã Disable':'Đã Enable')}catch(e){w.toast(e.message||'Update failed',false)}};a.querySelector('[data-reset]').onclick=async()=>{try{await keyApi({action:'reset_device',id:k.id});await w.refresh();w.toast('Đã reset device + IP')}catch(e){w.toast(e.message||'Reset failed',false)}};a.querySelector('[data-delete]').onclick=async()=>{if(!confirm('Xóa key này?'))return;try{await keyApi({action:'delete',id:k.id});await w.refresh();w.toast('Đã xóa')}catch(e){w.toast(e.message||'Delete failed',false)}};});};function openEditor(k){const box=d.getElementById('box'),modal=d.getElementById('modal');if(!box||!modal)return;modal.classList.add('show');box.innerHTML='<div class="head"><div><h3>Chỉnh sửa key</h3><p>Sửa key + user + giới hạn.</p></div><button class="icon" id="ex">×</button></div><div class="fields"><div class="field"><label>KEY</label><input id="ek" class="input" maxlength="20" value="'+esc(k.key_code||'')+'"></div><div class="field"><label>THỜI HẠN (GIỜ)</label><input id="eh" class="input" type="number" min="1" max="8760" value="'+(k.duration_hours||24)+'"></div><div class="field"><label>MAX DEVICES</label><input id="ed" class="input" type="number" min="1" max="100" value="'+(k.max_devices||1)+'"></div><div class="field"><label>MAX CHECKS (0 = ∞)</label><input id="ec" class="input" type="number" min="0" value="'+(k.max_checks||0)+'"></div><div class="field"><label>TELEGRAM ID</label><input id="et" class="input" value="'+(k.telegram_user_id||'')+'"></div><div class="field"><label>USERNAME</label><input id="eu" class="input" value="'+esc(k.telegram_username||'')+'"></div><div class="field"><label>STATUS</label><select id="es" class="input"><option '+((k.status==='ACTIVE'||k.status==='REACTIVATED')?'selected':'')+'>ACTIVE</option><option '+(k.status==='DISABLED'?'selected':'')+'>DISABLED</option><option '+(k.status==='EXPIRED'?'selected':'')+'>EXPIRED</option><option '+(k.status==='LIMIT_REACHED'?'selected':'')+'>LIMIT_REACHED</option><option '+(k.status==='REACTIVATED'?'selected':'')+'>REACTIVATED</option></select></div></div><button class="btn primary" id="ee">Lưu thay đổi</button>';d.getElementById('ex').onclick=()=>modal.classList.remove('show');d.getElementById('ee').onclick=async()=>{try{await keyApi({action:'update',id:k.id,key_code:d.getElementById('ek').value.trim(),duration_hours:Number(d.getElementById('eh').value),max_devices:Number(d.getElementById('ed').value),max_checks:Number(d.getElementById('ec').value),status:d.getElementById('es').value,telegram_user_id:d.getElementById('et').value.trim()||null,telegram_username:d.getElementById('eu').value.trim()||null});modal.classList.remove('show');await w.refresh();w.toast('Đã lưu key')}catch(e){w.toast(e.message||'Save failed',false)}}}w.__bdzPatched=true;w.renderUsers();w.renderKeys()}catch(e){}}f.addEventListener('load',()=>{setTimeout(patch,100);setInterval(patch,1200)});})();</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BDZ Control Center</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d14}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="admin" src="/admin.html?embedded=1" title="BDZ Control Center"></iframe><script>(function(){const f=document.getElementById('admin');function patch(){try{const w=f.contentWindow,d=w.document;if(!w.renderUsers||w.__bdzPatched)return;const u0=w.renderUsers.bind(w);w.renderUsers=function(){u0();const blocked=new Set((w.D?.blocked_users||[]).map(x=>String(x.telegram_user_id)));d.querySelectorAll('#userRows tr').forEach(tr=>{const id=String(tr.cells?.[0]?.textContent||'').trim();if(!id||!tr.cells?.length)return;const a=tr.cells[tr.cells.length-1],b=blocked.has(id);a.innerHTML=b?'<span class="tag bad">BLOCKED</span> <button class="btn sm" data-unblock="'+id+'">Unblock</button>':'<span class="tag ok">ALLOWED</span> <button class="btn sm danger" data-block="'+id+'">Block</button>';a.querySelector('[data-unblock]')?.addEventListener('click',async()=>{try{await w.call({action:'unblock_user',telegram_user_id:Number(id)});await w.refresh();w.toast('Đã unblock')}catch(e){w.toast(e.message||'Unblock failed',false)}});a.querySelector('[data-block]')?.addEventListener('click',async()=>{try{await w.call({action:'block_user',telegram_user_id:Number(id)});await w.refresh();w.toast('Đã block')}catch(e){w.toast(e.message||'Block failed',false)}});});};const k0=w.renderKeys.bind(w);w.renderKeys=function(){k0();d.querySelectorAll('#keyRows tr').forEach(tr=>{const code=tr.cells?.[0]?.textContent?.trim();if(!code||!w.D)return;const k=(w.D.keys||[]).find(x=>x.key_code===code);if(!k||!tr.cells?.length)return;const a=tr.cells[tr.cells.length-1];a.innerHTML='<div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn sm" data-edit="1">Edit</button><button class="btn sm" data-toggle="1">'+(k.status==='ACTIVE'?'Disable':'Enable')+'</button><button class="btn sm" data-reset="1">Reset</button><button class="btn sm danger" data-delete="1">Delete</button></div>';a.querySelector('[data-edit]').onclick=()=>openEditor(k);a.querySelector('[data-toggle]').onclick=async()=>{try{await keyApi({action:'set_status',id:k.id,status:k.status==='ACTIVE'?'DISABLED':'ACTIVE'});await w.refresh();w.toast(k.status==='ACTIVE'?'Đã Disable':'Đã Enable')}catch(e){w.toast(e.message||'Update failed',false)}};a.querySelector('[data-reset]').onclick=async()=>{try{await keyApi({action:'reset_device',id:k.id});await w.refresh();w.toast('Đã reset device')}catch(e){w.toast(e.message||'Reset failed',false)}};a.querySelector('[data-delete]').onclick=async()=>{if(!confirm('Xóa key này?'))return;try{await keyApi({action:'delete',id:k.id});await w.refresh();w.toast('Đã xóa')}catch(e){w.toast(e.message||'Delete failed',false)}};});};async function keyApi(body){const r=await fetch('/api/admin-key',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'REQUEST_FAILED');return x}function openEditor(k){const host=d.getElementById('box')||d.getElementById('modal');if(!host)return;d.getElementById('modal').classList.add('show');const box=d.getElementById('box');box.innerHTML='<div class="head"><div><h3>Chỉnh sửa key</h3><p>Admin có thể sửa key và thông tin user.</p></div><button class="icon" id="xclose">×</button></div><div class="fields"><div class="field"><label>KEY</label><input id="ek" class="input" value="'+String(k.key_code||'').replace(/"/g,'&quot;')+'"></div><div class="field"><label>THỜI HẠN (GIỜ)</label><input id="eh" class="input" type="number" min="1" max="8760" value="'+(k.duration_hours||24)+'"></div><div class="field"><label>MAX CHECKS (0 = ∞)</label><input id="ec" class="input" type="number" min="0" value="'+(k.max_checks||0)+'"></div><div class="field"><label>TELEGRAM ID</label><input id="et" class="input" value="'+(k.telegram_user_id||'')+'"></div><div class="field"><label>USERNAME</label><input id="eu" class="input" value="'+String(k.telegram_username||'').replace(/"/g,'&quot;')+'"></div><div class="field"><label>STATUS</label><select id="es" class="input"><option '+(k.status==='ACTIVE'?'selected':'')+'>ACTIVE</option><option '+(k.status==='DISABLED'?'selected':'')+'>DISABLED</option><option '+(k.status==='EXPIRED'?'selected':'')+'>EXPIRED</option><option '+(k.status==='REACTIVATED'?'selected':'')+'>REACTIVATED</option></select></div></div><button class="btn primary" id="esave">Lưu thay đổi</button>';d.getElementById('xclose').onclick=()=>d.getElementById('modal').classList.remove('show');d.getElementById('esave').onclick=async()=>{try{await keyApi({action:'update',id:k.id,key_code:d.getElementById('ek').value.trim(),duration_hours:Number(d.getElementById('eh').value),max_checks:Number(d.getElementById('ec').value),status:d.getElementById('es').value,telegram_user_id:d.getElementById('et').value.trim()||null,telegram_username:d.getElementById('eu').value.trim()||null});d.getElementById('modal').classList.remove('show');await w.refresh();w.toast('Đã lưu key')}catch(e){w.toast(e.message||'Save failed',false)}}}w.__bdzPatched=true;w.renderUsers();w.renderKeys()}catch(e){}}f.addEventListener('load',()=>{setTimeout(patch,50);setInterval(patch,1500)});})();</script></body></html>

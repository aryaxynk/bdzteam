<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f3f6"><title>BDZTEAM - Shop</title>
<link rel="icon" type="image/jpeg" href="https://263.org.vn/logo">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/styles.css?v=public-ui-v23"><link rel="stylesheet" href="/reference-theme.css?v=public-ui-v23"><link rel="stylesheet" href="/basic-ui.css?v=basic-ui-v5"><link rel="stylesheet" href="/reference-demo-v3.css?v=reference-demo-v3"><link rel="stylesheet" href="/responsive-v1.css?v=responsive-v2"><link rel="stylesheet" href="/page-transitions.css?v=fade-v3">
<style>.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;text-align:left}.shop-item{border:1px solid #dbe1e8;border-radius:12px;padding:14px;background:#fff;box-shadow:0 5px 16px rgba(15,23,42,.06);display:flex;flex-direction:column}.shop-item img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#f1f5f9}.shop-item h3{margin:12px 0 5px;font-size:17px}.shop-item p{margin:0 0 10px;color:#64748b;font-size:13px;line-height:1.55;flex:1}.shop-price{font-weight:900;margin-bottom:10px}.shop-buy{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;border-radius:8px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800}.shop-empty{padding:24px;text-align:center;color:#64748b}@media(max-width:480px){.shop-grid{grid-template-columns:1fr}}</style>
</head>
<body class="public-contrast">
<header class="demo-header"><div class="demo-header-inner"><a class="demo-brand" href="/">BDZTEAM</a><div class="demo-header-tools"><button class="demo-theme" type="button" aria-label="Chuyển sang giao diện tối" title="Chuyển sang giao diện tối"><i class="fa-regular fa-sun"></i></button><a class="demo-login-link" href="/login">Login</a></div></div></header>
<main class="demo-main"><section class="demo-card" aria-label="Shop"><div class="demo-card-head"><span class="head-user"><i class="fa-solid fa-store"></i></span><span>SHOP</span></div><section class="demo-success" style="display:block"><div id="shopState" class="shop-empty">Đang tải Shop...</div><div id="shopGrid" class="shop-grid" hidden></div></section></section></main>
<footer class="demo-footer"><div class="demo-footer-inner"><div class="demo-social" aria-label="Social links"><span title="Telegram"><i class="fa-brands fa-telegram"></i></span><span title="YouTube"><i class="fa-brands fa-youtube"></i></span><span title="TikTok"><i class="fa-brands fa-tiktok"></i></span></div><div class="demo-copy">© Copyright 2026 BDZTEAM</div></div></footer>
<script src="/common.js?v=public-ui-v26"></script><script src="/global-branding.js?v=branding-v1"></script><script src="/page-transitions.js?v=fade-v3"></script><script src="/maintenance-popup.js?v=public-ui-v24"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));(async()=>{const state=document.getElementById('shopState'),grid=document.getElementById('shopGrid');try{const r=await fetch('/api/shop',{cache:'no-store',headers:{accept:'application/json'}}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.error||`HTTP ${r.status}`);const items=d.items||[];if(!items.length){state.textContent='Shop hiện chưa có sản phẩm.';return}state.hidden=true;grid.hidden=false;grid.innerHTML=items.map(x=>`<article class="shop-item">${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.name)}" loading="lazy">`:''}<h3>${esc(x.name)}</h3><p>${esc(x.description||'')}</p><div class="shop-price">${esc(x.price||'Liên hệ')}</div><a class="shop-buy" href="${esc(x.action_url)}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-cart-shopping"></i> Mua ngay</a></article>`).join('')}catch(e){state.textContent=e.message||'Không thể tải Shop.'}})();</script>
</body></html>

<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BDZTEAM - Đăng Nhập Admin</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/reference-theme.css?v=ref-1"><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script></head><body class="min-h-screen p-4 md:p-8 flex items-center justify-center"><div id="bdzPageLoader"><span class="loader"></span><span class="font-extrabold text-xs tracking-widest">ĐANG TẢI...</span></div><div class="w-full max-w-md"><div class="text-center mb-5"><img src="https://files.catbox.moe/xpaekr.jpg" class="bdz-logo-lg mx-auto" alt="BDZTEAM"><h1 class="text-2xl md:text-3xl font-black mt-3">BDZTEAM ADMIN</h1><p class="text-xs text-[#6B7280]">Admin chính + Admin phụ 2 bước</p></div><section class="nb-card nb-card-active p-5"><div id="error" class="error-box hidden mb-4"></div><form id="loginForm" class="space-y-4" data-no-loader><div><label class="block text-xs font-bold text-[#6B7280] mb-2">TÀI KHOẢN</label><input id="username" class="input" required autofocus autocomplete="username"></div><div><label class="block text-xs font-bold text-[#6B7280] mb-2">MẬT KHẨU</label><div class="relative"><input id="password" class="input pr-11" type="password" required autocomplete="current-password"><button id="togglePassword" type="button" aria-label="Hiện mật khẩu" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center rounded-lg border-2 border-[#111827] bg-white hover:bg-[#FFF7DA] active:translate-y-[1px]"><i id="passwordIcon" class="fa-solid fa-eye"></i></button></div></div><div class="flex justify-center py-1"><div id="turnstileBox" class="cf-turnstile" data-sitekey="0x4AAAAAAEUAqKndNv6JVwAK" data-theme="light" data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired" data-error-callback="onTurnstileError" data-size="flexible"></div></div><p id="turnstileStatus" class="text-center text-xs text-[#6B7280]">Đang tải xác minh bảo mật...</p><input id="turnstileToken" type="hidden"><button id="loginBtn" type="submit" disabled class="w-full nb-btn nb-btn-yellow py-3">ĐĂNG NHẬP</button></form><form id="authForm" class="space-y-4 hidden" data-no-loader><div class="bg-[#FFF7DA] border-2 border-[#111827] rounded-[10px] p-3 text-xs font-bold">Admin phụ yêu cầu thêm mã xác thực 10 ký tự.</div><div><label class="block text-xs font-bold text-[#6B7280] mb-2">MÃ XÁC THỰC</label><input id="authCode" class="input font-mono tracking-widest text-center uppercase" maxlength="10" autocomplete="one-time-code"></div><button id="authBtn" type="submit" class="w-full nb-btn nb-btn-yellow py-3">XÁC NHẬN MÃ</button></form><div class="flex justify-between mt-4 text-xs font-bold"><a href="/" class="text-[#D9A300]">← Trang chủ</a><a href="/check-key.html" class="text-[#D9A300]">Check Key</a></div></section></div><script src="/common.js"></script><script>
const $=id=>document.getElementById(id);function errorMessage(v,fallback='Đã xảy ra lỗi.'){if(v==null)return fallback;if(typeof v==='string'){const s=v.trim();return s||fallback}if(v instanceof Error)return v.message||fallback;if(typeof v==='object'){for(const k of ['error','message','detail','reason','description']){const x=v[k];if(typeof x==='string'&&x.trim())return x.trim();if(x&&typeof x==='object'){const nested=errorMessage(x,'');if(nested)return nested}}try{return JSON.stringify(v)}catch{return fallback}}return String(v)}function showError(v){const e=$('error'),m=errorMessage(v);e.textContent=m;e.classList.toggle('hidden',!m)}function clearError(){const e=$('error');e.textContent='';e.classList.add('hidden')}let turnstileReady=false,turnstileToken='';function updateLoginButton(){$('loginBtn').disabled=!turnstileReady||!turnstileToken}function onTurnstileSuccess(token){turnstileToken=String(token||'');$('turnstileToken').value=turnstileToken;turnstileReady=!!turnstileToken;$('turnstileStatus').textContent=turnstileReady?'✓ Đã xác minh Cloudflare Turnstile':'Đang chờ xác minh...';updateLoginButton()}function onTurnstileExpired(){turnstileReady=false;turnstileToken='';$('turnstileToken').value='';$('turnstileStatus').textContent='Xác minh hết hạn. Vui lòng xác minh lại.';updateLoginButton()}function onTurnstileError(){onTurnstileExpired();$('turnstileStatus').textContent='Không thể tải xác minh. Đang thử lại...';setTimeout(()=>{try{window.turnstile?.reset($('turnstileBox'))}catch{}},1200)}async function readResponse(r){const text=await r.text();if(!text.trim())return{ok:false,error:`Máy chủ không trả dữ liệu (HTTP ${r.status}).`};try{return JSON.parse(text)}catch{const clean=text.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();return{ok:false,error:clean.slice(0,500)||`Máy chủ không trả JSON (HTTP ${r.status}).`}}}async function api(url,options){const r=await fetch(url,{credentials:'include',...options,headers:{accept:'application/json',...(options.body?{'content-type':'application/json'}:{}),...(options.headers||{})}});const d=await readResponse(r);if(!r.ok)throw new Error(errorMessage(d));return d}$('togglePassword').addEventListener('click',()=>{const input=$('password'),icon=$('passwordIcon'),show=input.type==='password';input.type=show?'text':'password';icon.className=show?'fa-solid fa-eye-slash':'fa-solid fa-eye';$('togglePassword').setAttribute('aria-label',show?'Ẩn mật khẩu':'Hiện mật khẩu')});$('loginForm').addEventListener('submit',async e=>{e.preventDefault();clearError();if(!turnstileReady||!turnstileToken){showError('Vui lòng hoàn thành xác minh Cloudflare Turnstile.');return}const btn=$('loginBtn');btn.disabled=true;btn.textContent='ĐANG XÁC THỰC...';try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value,turnstile_token:turnstileToken})});if(d.requires_auth_code){$('loginForm').classList.add('hidden');$('authForm').classList.remove('hidden');$('authCode').focus();return}if(d.ok===true){window.location.replace('/admin');return}throw new Error(errorMessage(d,'Đăng nhập không thành công.'))}catch(x){showError(x);try{window.turnstile?.reset($('turnstileBox'))}catch{}onTurnstileExpired()}finally{btn.textContent='ĐĂNG NHẬP';updateLoginButton()}});$('authForm').addEventListener('submit',async e=>{e.preventDefault();clearError();const btn=$('authBtn');btn.disabled=true;btn.textContent='ĐANG XÁC THỰC...';try{const d=await api('/api/admin/auth-code',{method:'POST',body:JSON.stringify({auth_code:$('authCode').value.trim().toUpperCase()})});if(d.ok===true){window.location.replace('/admin');return}throw new Error(errorMessage(d,'Xác thực thất bại.'))}catch(x){showError(x)}finally{btn.disabled=false;btn.textContent='XÁC NHẬN MÃ'}});
</script></body></html>

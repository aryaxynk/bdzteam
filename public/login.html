<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BDZTEAM - Đăng Nhập Admin</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="/styles.css"></head><body class="min-h-screen p-4 md:p-8 flex items-center justify-center"><div id="bdzPageLoader"><span class="loader"></span><span class="font-extrabold text-xs tracking-widest bg-[#FFCC00] border-2 border-[#111827] rounded-lg px-3 py-1.5 shadow-[3px_3px_0_#111827]">ĐANG TẢI...</span></div><div class="w-full max-w-md"><div class="text-center mb-5"><img src="https://files.catbox.moe/5tw3y4.jpg" class="bdz-logo-lg mx-auto"><h1 class="text-2xl md:text-3xl font-black mt-3">BDZTEAM ADMIN</h1><p class="text-xs text-[#6B7280]">Admin chính + Admin phụ 2 bước</p></div><section class="nb-card nb-card-active p-5"><div id="error" class="error-box hidden mb-4"></div><form id="loginForm" class="space-y-4" data-no-loader><div><label class="block text-xs font-bold text-[#6B7280] mb-2">TÀI KHOẢN</label><input id="username" class="input" required autofocus autocomplete="username"></div><div><label class="block text-xs font-bold text-[#6B7280] mb-2">MẬT KHẨU</label><input id="password" class="input" type="password" required autocomplete="current-password"></div><button id="loginBtn" class="w-full nb-btn nb-btn-yellow py-3">ĐĂNG NHẬP</button></form><form id="authForm" class="space-y-4 hidden" data-no-loader><div class="bg-[#FFF7DA] border-2 border-[#111827] rounded-[10px] p-3 text-xs font-bold">Admin phụ yêu cầu thêm mã xác thực 10 ký tự.</div><div><label class="block text-xs font-bold text-[#6B7280] mb-2">MÃ XÁC THỰC</label><input id="authCode" class="input font-mono tracking-widest text-center uppercase" maxlength="10" autocomplete="one-time-code"></div><button id="authBtn" class="w-full nb-btn nb-btn-yellow py-3">XÁC NHẬN MÃ</button></form><div class="flex justify-between mt-4 text-xs font-bold"><a href="/" class="text-[#D9A300]">← Trang chủ</a><a href="/check-key.html" class="text-[#D9A300]">Check Key</a></div></section></div><script src="/common.js"></script><script>const err=m=>{const e=document.getElementById('error');e.textContent=m||'';e.classList.toggle('hidden',!m)};loginForm.addEventListener('submit',async e=>{e.preventDefault();err('');loginBtn.disabled=true;loginBtn.textContent='ĐANG XÁC THỰC...';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Đăng nhập thất bại');if(d.requires_auth_code){loginForm.classList.add('hidden');authForm.classList.remove('hidden');authCode.focus()}else location.href='/admin.html'}catch(x){err(x.message)}finally{loginBtn.disabled=false;loginBtn.textContent='ĐĂNG NHẬP'}});authForm.addEventListener('submit',async e=>{e.preventDefault();err('');authBtn.disabled=true;authBtn.textContent='ĐANG XÁC THỰC...';try{const r=await fetch('/api/admin/auth-code',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({auth_code:authCode.value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error||'Mã xác thực sai');location.href='/admin.html'}catch(x){err(x.message)}finally{authBtn.disabled=false;authBtn.textContent='XÁC NHẬN MÃ'}});</script></body></html>

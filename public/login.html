<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDZTEAM - Admin</title><link rel="icon" href="https://files.catbox.moe/5tw3y4.jpg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><div id="bdzPageLoader"><span class="loader"></span><b>ĐANG TẢI...</b></div><main class="wrap" style="min-height:100vh;display:grid;place-items:center"><section style="width:min(440px,100%)"><div class="center" style="margin-bottom:18px"><a href="/"><img class="logo" src="https://files.catbox.moe/5tw3y4.jpg" alt="BDZTEAM"></a><h1 style="font-size:28px;margin:14px 0 5px">BDZTEAM ADMIN</h1><p class="muted small">Đăng nhập khu vực quản trị Cloudflare</p></div><div class="card" style="padding:24px"><div id="error" class="error hidden"></div><form id="login" style="display:grid;gap:13px"><label>TÀI KHOẢN<input id="username" class="input" required autocomplete="username" value="admin"></label><label>MẬT KHẨU<input id="password" class="input" type="password" required autocomplete="current-password"></label><button class="btn yellow" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập</button></form><p class="muted small center" style="margin:16px 0 0">Mật khẩu quản trị phải được lưu bằng Cloudflare Secret, không nằm trong HTML/GitHub.</p></div><div class="center" style="margin-top:14px"><a class="small muted" href="/">← Quay lại trang chủ</a></div></section></main><script>document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>document.querySelector('#bdzPageLoader')?.classList.add('hide'),220));const f=document.querySelector('#login'),e=document.querySelector('#error');f.addEventListener('submit',async x=>{x.preventDefault();e.classList.add('hidden');const b=f.querySelector('button');b.disabled=true;b.textContent='Đang xác thực...';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Đăng nhập thất bại');location.href='/admin.html'}catch(a){e.textContent=a.message||'Đăng nhập thất bại';e.classList.remove('hidden');b.disabled=false;b.textContent='Đăng Nhập'}});</script></body></html>

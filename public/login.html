<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BDZTEAM - Đăng Nhập Admin</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="/styles.css"></head><body class="min-h-screen p-4 md:p-8 flex items-center justify-center"><div id="bdzPageLoader"><span class="loader"></span><span class="font-extrabold text-xs tracking-widest bg-[#FFCC00] border-2 border-[#111827] rounded-lg px-3 py-1.5 shadow-[3px_3px_0_#111827]">ĐANG TẢI...</span></div><div class="w-full max-w-md"><div class="text-center mb-5"><img src="https://files.catbox.moe/5tw3y4.jpg" class="bdz-logo-lg mx-auto"><h1 class="text-2xl md:text-3xl font-black mt-3">BDZTEAM ADMIN</h1><p class="text-xs text-[#6B7280]">Admin chính + Admin phụ 2 bước</p></div><section class="nb-card nb-card-active p-5"><div id="error" class="error-box hidden mb-4"></div><form id="loginForm" class="space-y-4" data-no-loader><div><label class="block text-xs font-bold text-[#6B7280] mb-2">TÀI KHOẢN</label><input id="username" class="input" required autofocus autocomplete="username"></div><div><label class="block text-xs font-bold text-[#6B7280] mb-2">MẬT KHẨU</label><input id="password" class="input" type="password" required autocomplete="current-password"></div><button id="loginBtn" class="w-full nb-btn nb-btn-yellow py-3">ĐĂNG NHẬP</button></form><form id="authForm" class="space-y-4 hidden" data-no-loader><div class="bg-[#FFF7DA] border-2 border-[#111827] rounded-[10px] p-3 text-xs font-bold">Admin phụ yêu cầu thêm mã xác thực 10 ký tự.</div><div><label class="block text-xs font-bold text-[#6B7280] mb-2">MÃ XÁC THỰC</label><input id="authCode" class="input font-mono tracking-widest text-center uppercase" maxlength="10" autocomplete="one-time-code"></div><button id="authBtn" class="w-full nb-btn nb-btn-yellow py-3">XÁC NHẬN MÃ</button></form><div class="flex justify-between mt-4 text-xs font-bold"><a href="/" class="text-[#D9A300]">← Trang chủ</a><a href="/check-key.html" class="text-[#D9A300]">Check Key</a></div></section></div><script src="/common.js"></script><script>
const byId=id=>document.getElementById(id);const err=m=>{const e=byId('error');e.textContent=m||'';e.classList.toggle('hidden',!m)};
async function readResponse(r){const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{}if(data&&typeof data==='object')return data;const ct=r.headers.get('content-type')||'';if(ct.includes('text/html')||/^\s*(<!doctype|<html|The page|Not Found)/i.test(text))throw Error('Vercel API route không trả JSON. Kiểm tra deployment và /api/[...path].js.');throw Error(text||'Máy chủ không trả dữ liệu hợp lệ.');}
byId('loginForm').addEventListener('submit',async e=>{e.preventDefault();err('');const btn=byId('loginBtn');btn.disabled=true;btn.textContent='ĐANG XÁC THỰC...';try{const r=await fetch('/api/admin/login',{method:'POST',credentials:'include',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({username:byId('username').value.trim(),password:byId('password').value})});const d=await readResponse(r);if(!r.ok)throw Error(d.error||'Đăng nhập thất bại');if(d.requires_auth_code){byId('loginForm').classList.add('hidden');byId('authForm').classList.remove('hidden');byId('authCode').focus()}else if(d.ok){location.href='/admin.html'}else throw Error(d.error||'Đăng nhập không thành công.')}catch(x){err(x?.message||'Không thể kết nối máy chủ.')}finally{btn.disabled=false;btn.textContent='ĐĂNG NHẬP'}});
byId('authForm').addEventListener('submit',async e=>{e.preventDefault();err('');const btn=byId('authBtn');btn.disabled=true;btn.textContent='ĐANG XÁC THỰC...';try{const r=await fetch('/api/admin/auth-code',{method:'POST',credentials:'include',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({auth_code:byId('authCode').value.trim().toUpperCase()})});const d=await readResponse(r);if(!r.ok)throw Error(d.error||'Mã xác thực sai');if(d.ok)location.href='/admin.html';else throw Error(d.error||'Xác thực thất bại.')}catch(x){err(x?.message||'Không thể kết nối máy chủ.')}finally{btn.disabled=false;btn.textContent='XÁC NHẬN MÃ'}});
</script></body></html>

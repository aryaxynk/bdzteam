<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BDZTEAM - Đăng Nhập Admin</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="/styles.css?v=recaptcha-v3-fix-1"><link rel="stylesheet" href="/reference-theme.css?v=recaptcha-v3-fix-1"></head><body class="min-h-screen p-4 md:p-8 flex items-center justify-center"><div class="w-full max-w-md"><div class="text-center mb-5"><img src="https://files.catbox.moe/xpaekr.jpg" class="bdz-logo-lg mx-auto" alt="BDZTEAM"><h1 class="text-2xl md:text-3xl font-black mt-3">BDZTEAM ADMIN</h1><p class="text-xs text-[#6B7280]">Admin chính + Admin phụ 2 bước</p></div><section class="nb-card nb-card-active p-5"><div id="error" class="error-box hidden mb-4"></div><form id="loginForm" class="space-y-4" data-no-loader><div><label class="block text-xs font-bold text-[#6B7280] mb-2">TÀI KHOẢN</label><input id="username" class="input" required autofocus autocomplete="username"></div><div><label class="block text-xs font-bold text-[#6B7280] mb-2">MẬT KHẨU</label><div class="relative"><input id="password" class="input pr-11" type="password" required autocomplete="current-password"><button id="togglePassword" type="button" aria-label="Hiện mật khẩu" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center rounded-lg border-2 border-[#111827] bg-white hover:bg-gray-100"><i id="passwordIcon" class="fa-solid fa-eye"></i></button></div></div><button id="loginBtn" type="submit" class="w-full nb-btn nb-btn-yellow py-3">ĐĂNG NHẬP</button></form><form id="authForm" class="space-y-4 hidden" data-no-loader><div class="bg-gray-100 border border-gray-300 rounded-md p-3 text-xs font-bold">Admin phụ yêu cầu thêm mã xác thực 10 ký tự.</div><div><label class="block text-xs font-bold text-[#6B7280] mb-2">MÃ XÁC THỰC</label><input id="authCode" class="input font-mono tracking-widest text-center uppercase" maxlength="10" autocomplete="one-time-code"></div><button id="authBtn" type="submit" class="w-full nb-btn nb-btn-yellow py-3">XÁC NHẬN MÃ</button></form><div class="flex justify-between mt-4 text-xs font-bold"><a href="/" class="text-[#173b73]">← Trang chủ</a><a href="/check-key.html" class="text-[#173b73]">Check Key</a></div></section></div><script src="/common.js?v=recaptcha-v3-fix-1"></script><script>
const $=id=>document.getElementById(id);
function errorMessage(v,fallback='Đã xảy ra lỗi.'){if(v==null)return fallback;if(typeof v==='string')return v.trim()||fallback;if(v instanceof Error)return v.message||fallback;if(typeof v==='object'){for(const k of ['error','message','detail','reason','description']){const x=v[k];if(typeof x==='string'&&x.trim())return x.trim();}try{return JSON.stringify(v)}catch{return fallback}}return String(v)}
function showError(v){const e=$('error'),m=errorMessage(v);e.textContent=m;e.classList.toggle('hidden',!m)}
function clearError(){const e=$('error');e.textContent='';e.classList.add('hidden')}
let recaptchaSiteKey='',recaptchaReady=false,recaptchaLoadPromise=null;
async function loadRecaptcha(){if(recaptchaReady&&window.grecaptcha&&recaptchaSiteKey)return; if(recaptchaLoadPromise)return recaptchaLoadPromise; recaptchaLoadPromise=(async()=>{const r=await fetch('/api/admin/recaptcha-config',{credentials:'same-origin',cache:'no-store',headers:{accept:'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.site_key)throw new Error(d.error||'Không thể tải cấu hình reCAPTCHA.');recaptchaSiteKey=String(d.site_key).trim();if(window.grecaptcha){await new Promise(resolve=>window.grecaptcha.ready(resolve));recaptchaReady=true;return}await new Promise((resolve,reject)=>{const old=document.querySelector('script[data-bdz-recaptcha]');if(old){old.addEventListener('load',resolve,{once:true});old.addEventListener('error',()=>reject(new Error('Không thể tải Google reCAPTCHA.')),{once:true});return}const s=document.createElement('script');s.src='https://www.google.com/recaptcha/api.js?render='+encodeURIComponent(recaptchaSiteKey);s.async=true;s.defer=true;s.dataset.bdzRecaptcha='1';s.onload=resolve;s.onerror=()=>reject(new Error('Không thể tải Google reCAPTCHA.'));document.head.appendChild(s)});if(!window.grecaptcha)throw new Error('Không thể khởi tạo reCAPTCHA.');await new Promise(resolve=>window.grecaptcha.ready(resolve));recaptchaReady=true})().finally(()=>{recaptchaLoadPromise=null});return recaptchaLoadPromise}
$('togglePassword').addEventListener('click',()=>{const input=$('password'),icon=$('passwordIcon'),show=input.type==='password';input.type=show?'text':'password';icon.className=show?'fa-solid fa-eye-slash':'fa-solid fa-eye';$('togglePassword').setAttribute('aria-label',show?'Ẩn mật khẩu':'Hiện mật khẩu')});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();clearError();const btn=$('loginBtn');if(btn.disabled)return;btn.disabled=true;const oldText=btn.textContent;btn.textContent='ĐANG ĐĂNG NHẬP...';try{await loadRecaptcha();const token=await window.grecaptcha.execute(recaptchaSiteKey,{action:'admin_login'});if(!token)throw new Error('Không thể tạo phiên bảo mật.');const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value,recaptcha_token:token})});if(d.requires_auth_code){$('loginForm').classList.add('hidden');$('authForm').classList.remove('hidden');$('authCode').focus();return}if(d.ok===true){window.location.replace('/admin');return}throw new Error(errorMessage(d,'Đăng nhập không thành công.'))}catch(x){showError(x)}finally{btn.disabled=false;btn.textContent=oldText}});
async function readResponse(r){const text=await r.text();if(!text.trim())return{ok:false,error:`Máy chủ không trả dữ liệu (HTTP ${r.status}).`};try{return JSON.parse(text)}catch{const clean=text.replace(/<script[\s\S]*?<\\/script>/gi,'').replace(/<style[\s\S]*?<\\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/\\s+/g,' ').trim();return{ok:false,error:clean.slice(0,500)||`Máy chủ không trả JSON (HTTP ${r.status}).`}}}
async function api(url,options){const r=await fetch(url,{credentials:'include',...options,headers:{accept:'application/json',...(options.body?{'content-type':'application/json'}:{}),...(options.headers||{})}});const d=await readResponse(r);if(!r.ok)throw new Error(errorMessage(d));return d}
$('authForm').addEventListener('submit',async e=>{e.preventDefault();clearError();const btn=$('authBtn');btn.disabled=true;const oldText=btn.textContent;btn.textContent='ĐANG XÁC NHẬN...';try{const d=await api('/api/admin/auth-code',{method:'POST',body:JSON.stringify({auth_code:$('authCode').value.trim().toUpperCase()})});if(d.ok===true){window.location.replace('/admin');return}throw new Error(errorMessage(d,'Xác thực thất bại.'))}catch(x){showError(x)}finally{btn.disabled=false;btn.textContent=oldText}});
loadRecaptcha().catch(()=>{});
</script></body></html>

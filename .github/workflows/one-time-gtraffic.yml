name: one-time-gtraffic-integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-gtraffic.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch GTraffic provider support
        shell: python
        run: |
          from pathlib import Path
          import re

          # src/db.js: allow gtraffic in persisted shortener slots and add a server-side adapter.
          p = Path('src/db.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('["link4m","trafficvn"].includes(provider)?provider:""',
                        '["link4m","trafficvn","gtraffic"].includes(provider)?provider:""')
          s = s.replace('["link4m","trafficvn"].includes(String(x.provider||"").toLowerCase())?String(x.provider).toLowerCase():""',
                        '["link4m","trafficvn","gtraffic"].includes(String(x.provider||"").toLowerCase())?String(x.provider).toLowerCase():""')

          new_fn = '''export async function shorten(slot,destination,env){
            if(slot.provider==="gtraffic"){
              const u=new URL(env.GTRAFFIC_BASE_URL||"https://manager.gtraffic.io/api/cong-khai/tao-lien-ket");
              u.searchParams.set("apikey",slot.token);
              u.searchParams.set("url",destination);
              const r=await fetch(u,{headers:{accept:"application/json","user-agent":"BDZTEAM-Shortener/2.0"}});
              let x={};try{x=await r.json()}catch{}
              const id=String(x?.id||"").trim();
              const base=(env.GTRAFFIC_PUBLIC_BASE_URL||"https://gtraffic.io").replace(/\\/+$/,'');
              const s=id?safeUrl(base+"/"+encodeURIComponent(id)):"";
              if(!r.ok||!s)throw Error("GTraffic không tạo được link rút gọn");
              return s
          }
          const base=slot.provider==="link4m"?(env.LINK4M_BASE_URL||"https://link4m.co/api-shorten/v2"):(env.TRAFFICVN_BASE_URL||"https://trafficvn.com/apidevelop");
          const u=base.replace(/[?&]+$/,'')+"?api="+encodeURIComponent(slot.token)+"&url="+encodeURIComponent(destination);
          const r=await fetch(u,{headers:{accept:"application/json","user-agent":"BDZTEAM-Shortener/2.0"}});let x={};try{x=await r.json()}catch{}
          const c=[x.shortenedUrl,x.shortened_url,x.short_url,x.shorturl,x.url,x.link,x.data?.shortenedUrl,x.data?.short_url,x.data?.url,x.data?.link,x.result?.shortenedUrl,x.result?.short_url,x.result?.url];
          const s=c.map(safeUrl).find(Boolean);if(!r.ok||!s)throw Error(slot.provider+" không tạo được link rút gọn");return s
          }'''
          s = re.sub(r'export async function shorten\(slot,destination,env\)\{[\s\S]*?\}\s*$', new_fn + '\n', s, count=1)
          p.write_text(s, encoding='utf-8')

          # src/admin_api.js: accept the provider and redact stored API tokens from dashboard JSON.
          p = Path('src/admin_api.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("!['link4m','trafficvn'].includes(provider)", "!['link4m','trafficvn','gtraffic'].includes(provider)")
          needle = 'stats.revoked_keys=(keys||[]).filter(k=>k.status===\'REVOKED\').length;return {session:{user:s.u,role:s.r},stats,products,keys,logs,slots,site,subadmins:subs,events,bans}}'
          repl = 'stats.revoked_keys=(keys||[]).filter(k=>k.status===\'REVOKED\').length;const safeSlots=Object.fromEntries(Object.entries(slots||{}).map(([k,v])=>[k,{position:v.position,provider:v.provider,quota:v.quota,enabled:v.enabled}]));return {session:{user:s.u,role:s.r},stats,products,keys,logs,slots:safeSlots,site,subadmins:subs,events,bans}}'
          if needle in s:
            s = s.replace(needle, repl)
          p.write_text(s, encoding='utf-8')

          # public/admin-fixed.js: add GTraffic to the provider selector without exposing its endpoint/token.
          p = Path('public/admin-fixed.js')
          s = p.read_text(encoding='utf-8')
          needle = '<option value="trafficvn" ${s.provider===\'trafficvn\'?\'selected\':\'\'}>TrafficVN</option>'
          repl = needle + '<option value="gtraffic" ${s.provider===\'gtraffic\'?\'selected\':\'\'}>GTraffic</option>'
          if needle in s and 'value="gtraffic"' not in s:
            s = s.replace(needle, repl, 1)
          p.write_text(s, encoding='utf-8')

      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-gtraffic.yml

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/db.js src/admin_api.js public/admin-fixed.js .github/workflows/one-time-gtraffic.yml
          git diff --cached --quiet || git commit -m 'feat: add GTraffic shortener source'
          git push
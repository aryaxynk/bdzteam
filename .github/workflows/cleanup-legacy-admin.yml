name: cleanup-legacy-admin
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[legacy-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove legacy admin/dashboard code and obsolete assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('public/admin-v2.js')
          s = p.read_text(encoding='utf-8')
          # Remove the compatibility stub for the retired Dashboard renderer.
          s, n = re.subn(r'function\s+dashboard\s*\(\)\s*\{\s*return\s+[\"\']\s*[\"\']\s*;?\s*\}', '', s, count=1)
          if n != 1:
              raise SystemExit('retired dashboard stub not found')
          # Never call the retired renderer from the generic tab renderer.
          s, n = re.subn(r"S\.tab==='dashboard'\?dashboard\(\):", 'S.tab===\'dashboard\'?\'\':', s, count=1)
          if n != 1:
              raise SystemExit('legacy dashboard call not found')
          # The API tab has its own dedicated integration script; remove the retired inline examples.
          s, n = re.subn(r'function\s+apiPanel\s*\(\)\s*\{\s*return\s+[\"\']\s*[\"\']\s*;?\s*\}', '', s, count=1)
          if n != 1:
              raise SystemExit('retired API panel stub not found')
          s, n = re.subn(r"S\.tab==='api'\?apiPanel\(\):", "S.tab==='api'?'':", s, count=1)
          if n != 1:
              raise SystemExit('legacy API panel call not found')
          p.write_text(s, encoding='utf-8')

          h = Path('public/admin.html')
          html = h.read_text(encoding='utf-8')
          html = re.sub(r'<link[^>]+dashboard-bootstrap\.css[^>]*>', '', html)
          html = re.sub(r'<script[^>]+dashboard-bootstrap-release\.js[^>]*></script>', '', html)
          html = html.replace(' class="dashboard-bootstrap"', '')
          h.write_text(html, encoding='utf-8')
          PY

          rm -f \
            public/admin-clean-v1.css \
            public/admin-dashboard-fix.js \
            public/admin-extra-compat.js \
            public/admin-final-polish.css \
            public/admin-final-polish.js \
            public/admin-fixed.js \
            public/admin-full.css \
            public/admin-full.js \
            public/admin-hotfix.css \
            public/admin-key-list-filter.js \
            public/admin-key-list-patch.js \
            public/dashboard-bootstrap.css \
            public/dashboard-bootstrap-release.js \
            CLEANUP_TRIGGER.txt

          python3 - <<'PY'
          from pathlib import Path
          s = Path('public/admin-v2.js').read_text(encoding='utf-8')
          assert 'function dashboard(' not in s
          assert 'function stats(' not in s
          assert 'function apiPanel(' not in s
          assert "S.tab==='dashboard'?dashboard()" not in s
          assert "S.tab==='api'?apiPanel()" not in s
          h = Path('public/admin.html').read_text(encoding='utf-8')
          assert 'dashboard-bootstrap' not in h
          for f in ['admin-dashboard-fix.js','dashboard-bootstrap.css','dashboard-bootstrap-release.js','admin-clean-v1.css','admin-extra-compat.js','admin-final-polish.css','admin-final-polish.js','admin-fixed.js','admin-full.css','admin-full.js','admin-hotfix.css','admin-key-list-filter.js','admin-key-list-patch.js']:
              assert not Path('public',f).exists(), f
          print('legacy cleanup validation: OK')
          PY

          if git diff --quiet; then
            echo 'Nothing to clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(clean): remove retired admin dashboard and legacy assets'
          git push

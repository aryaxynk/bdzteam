name: cleanup-legacy-admin
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[legacy-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove legacy admin renderers and obsolete assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('public/admin-v2.js')
          s = p.read_text(encoding='utf-8')
          original = s
          s2, n = re.subn(r'function\s+stats\s*\(\)\s*\{.*?(?=function\s+keyStatus\s*\()', '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('legacy dashboard block not found')
          s = s2
          s2, n = re.subn(r'const\s+EX\s*=\{.*?(?=function\s+products\s*\()', '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('legacy API examples block not found')
          s = s2
          s = re.sub(r'function\s+dashboard\s*\(\)\s*\{\s*return\s*["\']\s*["\'];?\s*\}', '', s, count=1)
          s = re.sub(r'function\s+apiPanel\s*\(\)\s*\{\s*return\s*["\']\s*["\'];?\s*\}', '', s, count=1)
          p.write_text(s, encoding='utf-8')
          h = Path('public/admin.html')
          html = h.read_text(encoding='utf-8')
          html = re.sub(r'<link[^>]+dashboard-bootstrap\.css[^>]*>', '', html)
          html = re.sub(r'<script[^>]+dashboard-bootstrap-release\.js[^>]*></script>', '', html)
          html = html.replace(' class="dashboard-bootstrap"','')
          h.write_text(html, encoding='utf-8')
          PY
          rm -f \
            public/admin-clean-v1.css \
            public/admin-dashboard-fix.js \
            public/admin-extra-compat.js \
            public/admin-final-polish.css \
            public/admin-final-polish.js \
            public/admin-fixed.js \
            public/admin-full.css \
            public/admin-full.js \
            public/admin-hotfix.css \
            public/admin-key-list-filter.js \
            public/admin-key-list-patch.js \
            public/dashboard-bootstrap.css \
            public/dashboard-bootstrap-release.js
          if git diff --quiet; then
            echo 'Nothing to clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(clean): remove legacy dashboard and obsolete admin assets'
          git push
      - name: Validate cleaned files
        shell: bash
        run: |
          test -f public/admin-v2.js
          test -f public/dashboard-v3.js
          ! grep -Eq 'function[[:space:]]+stats[[:space:]]*\(' public/admin-v2.js
          ! grep -Eq 'function[[:space:]]+dashboard[[:space:]]*\(' public/admin-v2.js
          ! grep -Eq 'const[[:space:]]+EX[[:space:]]*=' public/admin-v2.js
          ! test -e public/admin-dashboard-fix.js
          ! test -e public/dashboard-bootstrap.css
          ! test -e public/dashboard-bootstrap-release.js
